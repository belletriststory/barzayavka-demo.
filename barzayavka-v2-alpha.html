<script>
/* БарЗаявка 2.0 UX Alpha — исключительно учебный браузерный прототип.
 * Нет AI, импорта XLSX, отправки сообщений, авторизации или реальных цен.
 */
(() => {
 'use strict';
 const D=window.BAR_DEMO, KEY='barzayavka-ux-alpha-v1';
 const $=id=>document.getElementById(id);
 const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const rub=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n);
 const qty=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
 const base={view:'home',mode:'list',demoSources:false,text:'',inventory:{},choices:{},surplus:{},excluded:{},history:[],draftInput:'',delivery:{date:'',window:'',address:'',comment:'',includePrices:false},showPrices:false};
 let state;
 try {state={...base,...JSON.parse(localStorage.getItem(KEY)||'{}')};}catch(e){state={...base};}
 state.delivery={...base.delivery,...state.delivery};
 state.inventory=state.inventory||{};state.choices=state.choices||{};state.surplus=state.surplus||{};state.excluded=state.excluded||{};state.history=Array.isArray(state.history)?state.history.slice(0,12):[];
 const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};
 let toastTimer=null;
 function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3100);}
 const btn=(label,action,cls='btn-outline',extra='')=>`<button type="button" class="btn ${cls}" data-action="${action}" ${extra}>${escape(label)}</button>`;
 const stepBack=(target='work')=>`<button class="back" data-action="${target}">← Назад</button>`;
 function nav(view){state.view=view;persist();render();window.scrollTo({top:0,behavior:'auto'});}
 function getSupplier(id){return D.sources.find(s=>s.id===id)?.name||'Учебный поставщик';}
 const normalize=s=>String(s??'').toLowerCase().replaceAll('ё','е').replaceAll('—','-').replaceAll('–','-');
 function detectCategory(name){const t=normalize(name);
   if(/русск.*стандарт|russian standard/.test(t))return 'absent';
   if(/шато\s*таман|chateau\s*taman/.test(t))return 'chateau';
   if(/золот.*балк/.test(t))return 'gold';
   if(/monin|сироп|ванил/.test(t))return 'syrup';
   if(/салфет/.test(t))return 'napkins';
   if(/водк|vodka/.test(t))return 'vodka';
   if(/вода|негаз/.test(t))return 'water';
   return 'unknown';
 }
 function parseLine(line,index){const raw=line.trim();if(!raw)return null;
   // The last quantity+unit is considered the requested quantity (packaging may precede it).
   const all=[...normalize(raw).matchAll(/(\d+(?:[.,]\d+)?)\s*(бут(?:ыл(?:ок|ки|ка|ку|ок)?|\.)?|бут\.|л(?:итр(?:ов|а|ы)?)?(?=$|[\s.,;])|шт(?:ук|\.)?|кг(?=$|[\s.,;])|уп(?:ак(?:ов(?:ок|ки|ка))?|\.)?)/g)];
   if(!all.length)return {id:index,raw,name:raw,invalid:'Укажи количество и единицу — например, 6 бут. или 10 л'};
   const last=all[all.length-1],n=Number(last[1].replace(',','.'));let unit=/^бут/.test(last[2])?'bottle':/^шт/.test(last[2])?'piece':/^уп/.test(last[2])?'pack':/^кг/.test(last[2])?'kg':'liter';
   let name=raw.slice(0,last.index).replace(/[\s\-–—:,;]+$/,'').trim();
   if(!name){return {id:index,raw,name:raw,invalid:'Не указано название товара'};}
   if(!Number.isFinite(n)||n<=0){return {id:index,raw,name,invalid:'Количество должно быть больше нуля'};}
   const category=detectCategory(name),text=normalize(name);
   const requestedVolume=[...text.matchAll(/\b(0[.,](?:2|5|7|75)|1(?:[.,]0)?)\s*л(?=$|[\s.,;])/g)].map(m=>Number(m[1].replace(',','.'))).pop()||null;
   let type=null;
   if(/полуслад/.test(text))type='semisweet';else if(/игрист|брют|brut/.test(text))type='sparkling';else if(/(?:^|\s)сух/.test(text))type='dry';
   const brand=/северн/.test(text)?'северная':/березов|берёзов/.test(name.toLowerCase())?'березовая':null;
   return {id:index,raw,name,n,unit,category,requestedVolume,type,brand,cheap:/дешев|выгод|эконом/.test(text)};
 }
 function sourceLines(){
   if(state.mode==='list') return state.text.split(/[\n;]+/).map((s,i)=>parseLine(s,i)).filter(Boolean);
   const items=[];D.inventory.forEach((it,i)=>{
      const rec=state.inventory[it.id]||{};
      if(rec.skip)return;
      if(rec.current===''||rec.current==null){items.push({id:i,raw:it.label,name:it.label,missingStock:true});return;}
      const current=Number(rec.current),inTransit=Number(rec.inTransit||0);
      if(!Number.isFinite(current)||current<0||!Number.isFinite(inTransit)||inTransit<0){items.push({id:i,raw:it.label,name:it.label,invalid:'Остаток и товар в пути должны быть числами от нуля'});return;}
      const n=Math.max(0,it.target-current-inTransit);
      if(n>0){items.push(parseLine(`${it.request} — ${qty(n)} ${it.unit}`,i));}
   });
   return items;
 }
 function selectPool(item){const offers=D.offers.filter(o=>o.category===item.category);
   if(item.category==='chateau' && item.type)return offers.filter(o=>o.type===item.type);
   if(item.category==='gold'&&item.requestedVolume)return offers.filter(o=>o.volume===item.requestedVolume);
   if(item.category==='vodka'&&item.brand)return offers.filter(o=>o.brand===item.brand);
   return offers;
 }
 function groupsForItem(item){const pool=selectPool(item);const groups=new Map();
   for(const o of pool){const k=item.category==='chateau'?o.type:item.category==='gold'?String(o.volume):item.category==='vodka'?`${o.brand}_${o.volume}`:o.category;
     if(!groups.has(k))groups.set(k,[]);groups.get(k).push(o);
   }
   return groups;
 }
 function requiredUnits(item,o){
   if(item.unit==='liter'){if(!o.volume || o.unit!=='bottle')return null;return Math.ceil((item.n-1e-9)/o.volume);}
   if(item.unit==='bottle'){if(o.unit!=='bottle')return null;return item.n;}
   if(item.unit==='piece' && o.category==='napkins')return Math.ceil(item.n/o.volume);
   if(item.unit==='piece' && o.unit==='bottle')return item.n;
   if(item.unit==='pack'&&o.unit==='pack')return item.n;
   return null;
 }
 function orderOffer(item,o){const needed=requiredUnits(item,o);if(needed==null)return null;
   const count=Math.max(o.min||1,Math.ceil(needed/(o.multiple||1))*(o.multiple||1));return {o,needed,count,cost:count*o.price,over:count>needed};
 }
 function getBestOffer(item,pool){const candidates=pool.map(o=>orderOffer(item,o)).filter(Boolean);
   return candidates.sort((a,b)=>a.cost-b.cost||a.count-b.count)[0]||null;
 }
 function scenario(){
   const lines=sourceLines(),ready=[],missing=[],questions=[];
   for(const item of lines){
     if(item.invalid){missing.push({item,reason:item.invalid});continue;}
     if(item.missingStock){missing.push({item,reason:'Сегодняшний остаток не указан'});continue;}
     if(state.excluded[item.id]){missing.push({item,reason:'Позиция исключена из этой закупки'});continue;}
     const pool=selectPool(item);
     if(!pool.length){missing.push({item,reason:'Не найдено в учебных предложениях'});continue;}
     let eligible=pool;
     const groups=groupsForItem(item);
     if(groups.size>1){
       let choice=state.choices[item.id];
       if(!choice && item.cheap && item.category==='vodka'){const opts=[...groups.entries()].map(([k,v])=>({key:k,cost:getBestOffer(item,v)?.cost??Infinity})).sort((a,b)=>a.cost-b.cost);choice=opts[0]?.key;}
       if(!choice || !groups.has(choice)){
         questions.push({kind:'choice',item,groups});continue;
       }
       eligible=groups.get(choice);
     }
     const selected=getBestOffer(item,eligible);
     if(!selected){missing.push({item,reason:'Нет предложения с подходящей единицей учёта'});continue;}
     if(selected.over && !state.surplus[item.id]){
       questions.push({kind:'surplus',item,selected});continue;
     }
     ready.push({item,...selected});
   }
   const suppliers=new Map();
   for(const r of ready){const k=r.o.supplier;if(!suppliers.has(k))suppliers.set(k,[]);suppliers.get(k).push(r);}
   return {lines,ready,missing,questions,total:ready.reduce((s,r)=>s+r.cost,0),suppliers};
 }
 function viewHome(){
   const hasText=state.text.trim().length>0,hasHistory=state.history.length>0;
   return `<section class="hero"><p class="eyebrow">Твой помощник по закупкам</p><h1>Закупка без<br>лишней работы.</h1><p class="lead">Напиши, что нужно бару. Поможем собрать понятную заявку и сообщения поставщикам.</p></section>
   <div class="card stack"><h3>${hasText?'Продолжить начатое':'Новая закупка'}</h3><p class="muted">${hasText?'Черновик сохранился. Продолжай с того же места.':'Вставь список товаров или посчитай потребность по остаткам.'}</p>${btn(hasText?'Продолжить закупку →':'Собрать закупку →','work','btn-primary btn-wide')}${hasHistory?btn('Повторить предыдущую','repeat','btn-outline btn-wide'):''}</div>
   <div class="card stack"><div class="row"><div><h3>Учебные прайсы</h3><p class="tiny">${state.demoSources?'2 подключено · вымышленные цены':'Не подключены'}</p></div><span class="pill">Демо</span></div><p class="muted">Для этого прототипа используется небольшой заранее подготовленный каталог. Твои Excel-файлы пока не обрабатываются.</p>${btn(state.demoSources?'Посмотреть учебные предложения':'Подключить учебные прайсы','sources','btn-secondary')}</div>
   <p class="tiny">Никакой регистрации. Данные черновика сохраняются только в этом браузере.</p>`;
 }
 function viewSources(){return `${stepBack('home')}<p class="eyebrow">Подключение прайсов</p><h2>Источники предложений</h2><p class="muted">В этой Alpha мы проверяем удобство работы с заказом. Импорт настоящих Excel появится после UX-проверок.</p><div class="card stack">${D.sources.map(s=>`<div class="row"><div><h3>${escape(s.name)}</h3><p class="tiny">${s.count} учебных предложений · цены вымышленные</p></div><span class="pill">Демо</span></div>`).join('<div class="separate"></div>')}${btn(state.demoSources?'Учебные прайсы подключены ✓':'Подключить учебные прайсы','enableSources',state.demoSources?'btn-secondary btn-wide':'btn-primary btn-wide',state.demoSources?'disabled':'')}</div>${btn('Вернуться к закупке','work','btn-outline btn-wide')}`;}
 function viewWork(){const has=state.mode==='list',lineCount=sourceLines().length;
   return `${stepBack('home')}<div class="helper-steps"><b>1. Потребность</b><span>→</span><span>2. Подбор</span><span>→</span><span>3. Сообщения</span></div><p class="eyebrow">Новая закупка</p><h2>Что нужно заказать?</h2><p class="muted">Не нужно заполнять каталог заранее. Просто опиши свою задачу.</p>
    <div class="card"><div class="chiprow"><button class="chip" data-action="mode-list" aria-pressed="${has}">${has?'● ':''}Списком</button><button class="chip" data-action="mode-stock" aria-pressed="${!has}">${!has?'● ':''}По остаткам</button></div><div class="space"></div>${has?renderTextInput():renderStockInput()}</div>
    <div class="card card-flat"><div class="row"><div><strong>${state.demoSources?'Учебные прайсы подключены':'Для подбора нужны прайсы'}</strong><p class="tiny">${state.demoSources?'2 поставщика · учебные данные':'Сначала можно написать список — он не пропадёт'}</p></div><span class="pill ${state.demoSources?'':'pill-warn'}">${state.demoSources?'Готово':'Нет источника'}</span></div><button class="link-btn" data-action="sources">${state.demoSources?'Посмотреть источники':'Подключить учебные прайсы'} →</button></div>
    ${btn('Подобрать предложения →','analyze','btn-primary btn-wide',lineCount?'':'disabled')}`;
 }
 function renderTextInput(){return `<label for="request" class="field-label">Товары и количества</label><textarea id="request" name="request" placeholder="Водка для коктейлей — 10 л&#10;Шато Тамань белое — 6 бут.&#10;Сироп ванильный — 3 л">${escape(state.text)}</textarea><p class="tiny">Один товар на строку. В этой Alpha распознаётся ограниченный набор учебных товаров.</p><div class="step-title">Попробовать пример</div><div class="chiprow">${D.examples.map((it,i)=>`<button type="button" class="chip" data-example="${i}">${escape(it.title)}</button>`).join('')}</div>`;}
 function renderStockInput(){return `<p class="muted">Укажи сегодняшние остатки. Ничего не подставляем автоматически из прошлой закупки.</p><div class="inventory-top"><span>Товар и цель</span><span>Сейчас</span><span>В пути</span></div>${D.inventory.map((it,i)=>{const rec=state.inventory[it.id]||{};return `<div class="inventory-row"><div><div class="offer-title">${escape(it.label)}</div><div class="tiny">Цель: ${qty(it.target)} ${it.unit}</div></div><input class="field" inputmode="decimal" aria-label="Остаток: ${escape(it.label)}" placeholder="—" data-stock="${it.id}" data-type="current" value="${escape(rec.current??'')}"><input class="field" inputmode="decimal" aria-label="В пути: ${escape(it.label)}" placeholder="0" data-stock="${it.id}" data-type="inTransit" value="${escape(rec.inTransit??'')}"></div>`;}).join('')}<p class="tiny">Пустой остаток означает «неизвестно», а не ноль. Товар в пути указывается только когда заказ действительно подтверждён.</p>`;}
 function showQuestion(q,index,total){
   if(q.kind==='choice'){
     const options=[...q.groups.entries()].map(([key,items])=>{const best=getBestOffer(q.item,items);const o=best?.o||items[0];return {key,title:o.name,price:best?.cost??null,note: `${getSupplier(o.supplier)} · ${best?rub(best.cost):'Нужна единица'}`};}).sort((a,b)=>(a.price??Infinity)-(b.price??Infinity));
     let title=q.item.category==='chateau'?'Какое вино нужно?':q.item.category==='gold'?'Какой объём бутылки?':q.item.category==='vodka'?'Какую водку выбрать?':'Уточни товар';
     const lead=q.item.category==='vodka'?'В учебных прайсах есть несколько марок. Не буду выбирать за тебя без разрешения.':q.item.category==='gold'?'Нашёл бутылки разных объёмов. При заказе штуками это важно.':'Нашёл несколько разновидностей. Выбери подходящую.';
     return `<p class="eyebrow">Нужно уточнить · ${index+1} из ${total}</p><h2>${title}</h2><p class="muted">${escape(lead)}</p><div class="note">Твой запрос: <strong>${escape(q.item.raw)}</strong></div><div class="card stack">${options.map(op=>`<button class="offer" data-pick="${q.item.id}" data-key="${escape(op.key)}"><div class="offer-title">${escape(op.title)}</div><div class="offer-meta">${escape(op.note)} · цена учебная</div></button>`).join('')}</div>${btn('Оставить без решения','exclude-'+q.item.id,'btn-outline btn-wide')}`;
   }
   const {item,selected}=q;const u=selected.o.unit==='bottle'?'бут.':'уп.';
   return `<p class="eyebrow">Нужно решение · ${index+1} из ${total}</p><h2>Поставщик продаёт больше, чем нужно</h2><p class="muted">У этого товара есть минимальная партия или кратность упаковки.</p><div class="card stack"><h3>${escape(selected.o.name)}</h3><div class="row"><span class="muted">Нужно</span><strong>${qty(item.n)} ${item.unit==='liter'?'л':item.unit==='bottle'?'бут.':item.unit==='piece'?'шт.':'уп.'}</strong></div><div class="row"><span class="muted">По условиям поставщика</span><strong>${qty(selected.count)} ${u}</strong></div><div class="row"><span class="muted">Стоимость всего заказа</span><span class="metric-small">${rub(selected.cost)}</span></div><p class="tiny">Это вымышленные учебные условия. Превышение не подтверждаем автоматически.</p></div>${btn(`Заказать ${qty(selected.count)} ${u}`,'accept-'+item.id,'btn-primary btn-wide')}<div class="space"></div>${btn('Не включать эту позицию','exclude-'+item.id,'btn-outline btn-wide')}`;
 }
 function viewReview(){const calc=scenario();
   if(!state.demoSources) return `${stepBack('work')}<p class="eyebrow">Сначала источник</p><h2>Нужны предложения поставщиков</h2><p class="muted">Список сохранён. Чтобы проверить подбор на учебных данных, подключи демо-прайсы.</p>${btn('Подключить учебные прайсы','enableSources','btn-primary btn-wide')}`;
   if(!calc.lines.length)return `${stepBack('work')}<h2>Заявка пока пуста</h2>${btn('Вернуться к списку','work','btn-primary btn-wide')}`;
   if(calc.questions.length){return `${stepBack('work')}<div class="helper-steps"><span>1. Потребность</span><span>→</span><b>2. Уточнения</b><span>→</span><span>3. Результат</span></div>${showQuestion(calc.questions[0],0,calc.questions.length)}<p class="tiny">Другие понятные товары уже рассчитаны. Решения сохраняются в этом браузере.</p>`;}
   return resultMarkup(calc);
 }
 function unitLabel(o,count){
   if(o.unit==='pack')return `${qty(count)} уп. × ${qty(o.volume)} шт.`;
   if(o.multiple>1&&count%o.multiple===0)return `${qty(count/o.multiple)} кор. × ${o.multiple} бут.`;
   return `${qty(count)} бут.`;
 }
 function resultMarkup(calc){
   const partial=calc.missing.length>0;
   let sourceCount=calc.lines.filter(x=>!x.missingStock&&!x.invalid).length;
   return `${stepBack('work')}<div class="helper-steps"><span>1. Потребность</span><span>→</span><span>2. Подбор</span><span>→</span><b>3. Результат</b></div><p class="eyebrow">${partial?'Частично готово':'Готово к отправке'}</p><h2>${partial?'Часть позиций требует внимания':'Закупка готова'}</h2><p class="muted">Предварительный расчёт только по подключённым учебным предложениям.</p>
   <div class="card"><p class="label-quiet">Общая стоимость</p><div class="metric">${rub(calc.total)}</div><p class="tiny">${calc.ready.length} ${calc.ready.length===1?'позиция':'позиций'} · ${calc.suppliers.size} ${calc.suppliers.size===1?'поставщик':'поставщика'}${partial?` · ${calc.missing.length} без предложения`:''}</p>${calc.ready.length?'':'<div class="note warm">Пока нет позиций, которые можно включить в заказ.</div>'}</div>
   ${partial?`<div class="card warm"><h3>Не включено в сообщения</h3>${calc.missing.map(x=>`<div class="product-line"><div class="name">${escape(x.item.raw)}</div><div class="detail">${escape(x.reason)}</div></div>`).join('')}<div class="space"></div>${btn('Изменить список','work','btn-outline btn-wide')}</div>`:''}
   ${[...calc.suppliers].map(([id,items])=>{const total=items.reduce((s,x)=>s+x.cost,0);return `<div class="card"><div class="row"><div><h3>${escape(getSupplier(id))}</h3><p class="tiny">${items.length} позиций · вымышленные цены</p></div><div class="metric-small">${rub(total)}</div></div><details><summary class="details-toggle">Посмотреть товары и расчёт ↓</summary>${items.map(x=>`<div class="product-line"><div class="row row-top"><div class="name">${escape(x.o.name)}</div><strong>${rub(x.cost)}</strong></div><div class="detail">К заказу: ${unitLabel(x.o,x.count)} · ${rub(x.o.price)} за ${x.o.unit==='bottle'?'бутылку':'упаковку'}</div>${x.over?`<div class="detail">Потребность: ${qty(x.item.n)} ${x.item.unit==='liter'?'л':x.item.unit==='bottle'?'бут.':'шт.'} · покупка с запасом подтверждена</div>`:''}</div>`).join('')}</details></div>`;}).join('')}
   ${calc.ready.length?`${deliveryForm()}<div class="card"><h3>Сообщения поставщикам</h3><p class="tiny">Без технических расчётов и цен по умолчанию. Сообщения не отправляются автоматически.</p><div class="space"></div>${[...calc.suppliers].map(([id,items])=>`<div class="stack"><div class="row"><strong>${escape(getSupplier(id))}</strong><span class="pill">Готово к копированию</span></div><div class="message-text" id="msg-${id}">${escape(messageForSupplier(id,items))}</div>${btn('Скопировать сообщение','copy-'+id,'btn-primary btn-wide')}</div><div class="space"></div>`).join('')}</div>${btn('Сохранить как прошлую закупку','saveHistory','btn-outline btn-wide')}`:''}
   ${btn('Изменить товары','work','btn-quiet btn-wide')}`;
 }
 function deliveryForm(){const d=state.delivery;return `<div class="card stack"><div><h3>Доставка</h3><p class="tiny">Заполни только то, что нужно указать поставщику. Эти значения сохранятся для следующей закупки.</p></div><div class="grid-2"><div><label class="field-label" for="delivery-date">Дата</label><input type="date" id="delivery-date" class="field" value="${escape(d.date)}"></div><div><label class="field-label" for="delivery-window">Время</label><input id="delivery-window" class="field" placeholder="15:00–19:00" value="${escape(d.window)}"></div></div><div><label class="field-label" for="delivery-address">Адрес</label><input id="delivery-address" class="field" placeholder="Улица, дом, заведение" value="${escape(d.address)}"></div><div><label class="field-label" for="delivery-comment">Комментарий</label><input id="delivery-comment" class="field" placeholder="Например: звонить при подъезде" value="${escape(d.comment)}"></div><label class="checkboxline"><input type="checkbox" id="include-prices" ${d.includePrices?'checked':''}>Указать закупочные цены в сообщениях</label><p class="tiny">Менять доставку можно прямо здесь. Сообщения обновятся автоматически.</p></div>`;}
 function messageForSupplier(id,items){const d=state.delivery;const lines=['Привет! Заказ для бара:',''];items.forEach((x,i)=>{
   const cost=d.includePrices?` · ${rub(x.cost)}`:'';
   lines.push(`${i+1}. ${x.o.name} — ${unitLabel(x.o,x.count)}${cost}`);
 });
   if(d.date||d.window||d.address||d.comment)lines.push('');
   if(d.date){const parts=d.date.split('-');lines.push(`Дата доставки: ${parts.length===3?`${parts[2]}.${parts[1]}.${parts[0]}`:d.date}`);}
   if(d.window)lines.push(`Время доставки: ${d.window}`);
   if(d.address)lines.push(`Адрес: ${d.address}`);
   if(d.comment)lines.push(d.comment);
   lines.push('','Спасибо!');return lines.join('\n');
 }
 function viewHistory(){return `${stepBack('home')}<p class="eyebrow">История</p><h2>Закупки и повтор</h2><p class="muted">Здесь сохраняется утверждённый тобой шаблон. Копирование сообщения не означает, что поставщик его получил.</p>${state.history.length?`<div class="card">${state.history.map((h,i)=>`<div class="history-item"><div class="row"><div><strong>${escape(h.label)}</strong><p class="tiny">${escape(h.savedAt)} · ${h.mode==='stock'?'По остаткам':'Списком'}</p></div><span class="pill">Учебная</span></div><button class="link-btn" data-action="repeat-${i}">Повторить закупку →</button></div>`).join('')}</div>`:'<div class="card"><div class="empty-icon">↻</div><h3>Пока нет сохранённых закупок</h3><p class="muted">После первого учебного расчёта можно сохранить его как основу для повторения.</p></div>'}${btn('Новая закупка','new','btn-primary btn-wide')}`;}
 function render(){const views={home:viewHome,work:viewWork,sources:viewSources,review:viewReview,history:viewHistory};$('app').innerHTML=(views[state.view]||viewHome)();document.title=`БарЗаявка 2.0 · ${({home:'Главная',work:'Закупка',sources:'Прайсы',review:'Результат',history:'История'})[state.view]||'UX Alpha'}`;}
 function resetForRun(){state.choices={};state.surplus={};state.excluded={};}
 function analyze(){if(!state.demoSources){nav('review');return;}const lines=sourceLines();if(!lines.length){toast('Добавь хотя бы один товар');return;}resetForRun();nav('review');}
 function repeat(index=0){const h=state.history[index];if(!h){toast('Пока нечего повторять');return;}state.mode=h.mode;state.text=h.text;
   // Old inventory measurements are never copied as today's stock.
   state.inventory={};resetForRun();nav('work');toast('Товары восстановлены. Проверь сегодняшнюю потребность.');}
 function saveHistory(){const calc=scenario();const entry={label:calc.ready.length?`${calc.ready[0].item.name}${calc.ready.length>1?` и ещё ${calc.ready.length-1}`:''}`:'Закупка',savedAt:new Date().toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}),mode:state.mode,text:state.text};state.history.unshift(entry);state.history=state.history.slice(0,12);persist();toast('Сохранено. Можно повторить из истории.');}
 function updateMessagePreview(){if(state.view!=='review')return;const calc=scenario();for(const [id,items] of calc.suppliers){const el=$(`msg-${id}`);if(el)el.textContent=messageForSupplier(id,items);}}
 const toastCopy=async id=>{const calc=scenario(),items=calc.suppliers.get(id);if(!items)return;const value=messageForSupplier(id,items);
  try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);}else{const el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw new Error('not copied');}toast('Сообщение скопировано. Оно ещё не отправлено.');}catch(e){toast('Не удалось скопировать. Выдели текст сообщения вручную.');}
 };
 document.addEventListener('click',e=>{
   if(e.target.closest('#brand-link')){e.preventDefault();nav('home');return;}
   if(e.target.closest('#menu-toggle')){const menu=$('side-menu');menu.classList.toggle('hidden');$('menu-toggle').setAttribute('aria-expanded',String(!menu.classList.contains('hidden')));return;}
   const example=e.target.closest('[data-example]');if(example){const sample=D.examples[Number(example.dataset.example)];state.text=sample.value;persist();render();return;}
   const pick=e.target.closest('[data-pick]');if(pick){state.choices[Number(pick.dataset.pick)]=pick.dataset.key;persist();render();window.scrollTo(0,0);return;}
   const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
   $('side-menu').classList.add('hidden');$('menu-toggle').setAttribute('aria-expanded','false');
   if(['home','work','sources','history','review'].includes(action)){nav(action);return;}
   if(action==='new'){state.mode='list';state.text='';state.inventory={};resetForRun();nav('work');return;}
   if(action==='enableSources'){state.demoSources=true;persist();nav(state.text.trim()||state.mode==='stock'?'work':'sources');toast('Учебные прайсы подключены');return;}
   if(action==='mode-list'||action==='mode-stock'){state.mode=action==='mode-list'?'list':'stock';persist();render();return;}
   if(action==='analyze'){analyze();return;}
   if(action==='saveHistory'){saveHistory();return;}
   if(action==='repeat'){repeat();return;}
   if(action.startsWith('repeat-')){repeat(Number(action.slice(7)));return;}
   if(action.startsWith('accept-')){state.surplus[Number(action.slice(7))]=true;persist();render();window.scrollTo(0,0);return;}
   if(action.startsWith('exclude-')){state.excluded[Number(action.slice(8))]=true;persist();render();window.scrollTo(0,0);return;}
   if(action.startsWith('copy-')){toastCopy(action.slice(5));return;}
   if(action==='reset'){if(window.confirm('Сбросить все учебные данные этого браузера?')){localStorage.removeItem(KEY);state=structuredClone(base);nav('home');toast('Учебный прототип сброшен');}return;}
 });
 document.addEventListener('input',e=>{
   if(e.target.id==='request'){state.text=e.target.value;persist();const analyzeBtn=document.querySelector('[data-action="analyze"]');if(analyzeBtn)analyzeBtn.disabled=!state.text.trim();return;}
   if(e.target.matches('[data-stock]')){const id=e.target.dataset.stock;state.inventory[id]??={};state.inventory[id][e.target.dataset.type]=e.target.value.replace(',','.');persist();return;}
   const fields={'delivery-date':'date','delivery-window':'window','delivery-address':'address','delivery-comment':'comment'};
   if(fields[e.target.id]){state.delivery[fields[e.target.id]]=e.target.value;persist();updateMessagePreview();return;}
 });
 document.addEventListener('change',e=>{if(e.target.id==='include-prices'){state.delivery.includePrices=e.target.checked;persist();updateMessagePreview();}});
 render();
})();

</script>
