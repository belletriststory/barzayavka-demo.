<script>
'use strict';
/* Browser-native XLSX reader. XLSX ZIP central directory, XML workbooks;
   only cached values, shared/inline strings. No macros, no external network. */
function xmlText(t){const p=new DOMParser().parseFromString(t,'application/xml');if(p.querySelector('parsererror'))throw Error('Некорректная XML-структура');return p;}
function xmlTags(parent,name){return Array.from(parent.getElementsByTagNameNS('*',name));}
function xmlFirst(parent,name){return xmlTags(parent,name)[0]||null;}
function colIndex(ref){let letters=String(ref||'').match(/^[A-Z]+/i)?.[0]||'';let n=0;for(let c of letters.toUpperCase())n=n*26+c.charCodeAt(0)-64;return n-1;}
function zipEntries(bytes){const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);const decoder=new TextDecoder();let end=-1;for(let p=bytes.length-22;p>=Math.max(0,bytes.length-65558);p--){if(view.getUint32(p,true)===0x06054b50){end=p;break;}}if(end<0)throw Error('В файле не найден ZIP-каталог');const n=view.getUint16(end+10,true),off=view.getUint32(end+16,true);if(n>3000)throw Error('Слишком много вложенных частей');let pos=off,m=new Map,total=0;for(let i=0;i<n;i++){if(pos+46>bytes.length||view.getUint32(pos,true)!==0x02014b50)throw Error('Повреждён ZIP-каталог');let method=view.getUint16(pos+10,true),cs=view.getUint32(pos+20,true),us=view.getUint32(pos+24,true),fl=view.getUint16(pos+28,true),el=view.getUint16(pos+30,true),cl=view.getUint16(pos+32,true),local=view.getUint32(pos+42,true),name=decoder.decode(bytes.slice(pos+46,pos+46+fl));pos+=46+fl+el+cl;total+=us;if(total>100*1024*1024)throw Error('Распакованные данные слишком велики');if(local+30>bytes.length||view.getUint32(local,true)!==0x04034b50)throw Error('Повреждён ZIP-файл');let dl=local+30+view.getUint16(local+26,true)+view.getUint16(local+28,true);if(dl+cs>bytes.length)throw Error('Некорректная длина данных');m.set(name,{method,data:bytes.slice(dl,dl+cs),size:us})}return m}
async function unzipPart(ent){if(!ent)return null;if(ent.size>35*1024*1024)throw Error('Слишком большой XML-раздел');if(ent.method===0)return ent.data;if(ent.method!==8)throw Error('Неподдерживаемое сжатие XLSX');if(typeof DecompressionStream!=='function')throw Error('Браузер не поддерживает распаковку XLSX. Используйте CSV.');let ds=new DecompressionStream('deflate-raw');let stream=new Blob([ent.data]).stream().pipeThrough(ds);let out=new Uint8Array(await new Response(stream).arrayBuffer());if(out.byteLength>35*1024*1024)throw Error('Слишком большой распакованный XML');return out;}
async function nativeXLSX(buf){const files=zipEntries(new Uint8Array(buf)),decode=new TextDecoder('utf-8');let read=async path=>{let v=await unzipPart(files.get(path));return v?decode.decode(v):null};let workbook=await read('xl/workbook.xml');if(!workbook)throw Error('Файл не содержит xl/workbook.xml');let wb=xmlText(workbook),rels=xmlText(await read('xl/_rels/workbook.xml.rels')||'<Relationships/>');let relMap=new Map(xmlTags(rels,'Relationship').map(e=>[e.getAttribute('Id'),e.getAttribute('Target')]));let ss=[];let sxml=await read('xl/sharedStrings.xml');if(sxml){let doc=xmlText(sxml);ss=xmlTags(doc,'si').map(si=>xmlTags(si,'t').map(t=>t.textContent||'').join(''));}
let sheets={};for(let sheet of xmlTags(wb,'sheet').slice(0,15)){let name=sheet.getAttribute('name')||'Лист';let rid=sheet.getAttribute('r:id')||sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');let target=relMap.get(rid);if(!target)continue;let path=target.startsWith('/')?target.replace(/^\//,''):target.startsWith('xl/')?target:'xl/'+target.replace(/^\.\//,'');let raw=await read(path);if(!raw)continue;let doc=xmlText(raw);let rows=[];let rowNodes=xmlTags(doc,'row').slice(0,5000);for(let row of rowNodes){let idx=Number(row.getAttribute('r')||rows.length+1)-1;if(idx<0||idx>=5000)continue;let cols=[];for(let cell of xmlTags(row,'c')){let ci=colIndex(cell.getAttribute('r'));if(ci<0||ci>=50)continue;let t=cell.getAttribute('t'),v=xmlFirst(cell,'v')?.textContent;let value='';if(t==='s')value=ss[Number(v)]||'';else if(t==='inlineStr')value=xmlTags(cell,'t').map(x=>x.textContent||'').join('');else if(t==='str')value=v||'';else value=v??'';cols[ci]=String(value).slice(0,700);}rows[idx]=cols;}sheets[name]=rows.map(x=>x||[]);}if(!Object.keys(sheets).length)throw Error('Не удалось прочитать листы Excel');return sheets;}

const steps=['Прайсы','Потребности','Сопоставление','Предложения','Проверка','Сообщения','Сохранение','Повторить'];
let step=0, files=[], needs=[], matches={}, choices={}, approvals={}, confirmed=false, savedStamp=null, supplierMessages=[], lastMessage='';
const id=()=>('id'+Math.random().toString(36).slice(2,12));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=k=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB'}).format(k/100);
const num=x=>{if(typeof x==='number')return Number.isFinite(x)?x:NaN;let s=String(x??'').replace(/\u00a0|\u202f/g,' ').replace(/[^\d.,\- ]/g,'').replace(/\s/g,'');if(!s)return NaN;let commas=(s.match(/,/g)||[]).length,dots=(s.match(/\./g)||[]).length;if(commas&&dots){let k=Math.max(s.lastIndexOf(','),s.lastIndexOf('.'));return Number(s.slice(0,k).replace(/[.,]/g,'')+'.'+s.slice(k+1).replace(/[.,]/g,''));}if(commas){if(commas>1)return Number(s.replace(/,/g,''));return Number(s.replace(',','.'));}if(dots>1)return Number(s.replace(/\./g,''));return Number(s)};
const kop=x=>Math.round(x*100);
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[«»"“”\u00a0]/g,' ').replace(/[.,;:()[\]/\\-]/g,' ').replace(/\s+/g,' ').trim();
const needsQuantity=n=>n.mode==='stock'?Math.max(0,Math.ceil(Number(n.target||0)-Number(n.actual||0))):Math.max(0,Math.ceil(Number(n.quantity||0)));
function select(el){return document.getElementById(el)}
function alertMsg(msg,kind='warn'){lastMessage=msg;select('notices').innerHTML=`<div class="alert ${kind==='bad'?'red':kind==='good'?'green':''}">${esc(msg)}</div>`;}
function invalidate(){confirmed=false;supplierMessages=[];savedStamp=null}
function go(n){if(n<0||n>=8)return;step=n;render();window.scrollTo(0,0)}
function supplierName(k){return files.find(f=>f.id===k)?.supplier||'Поставщик'}
function parseCSV(text){text=String(text||'').replace(/^\uFEFF/,'');const lines=text.slice(0,3500000);let sample=lines.slice(0,1000),counts=[';',',','\t'].map(d=>[d,(sample.match(new RegExp(d==='\t'?'\t':d===';'?';':',','g'))||[]).length]);const del=counts.sort((a,b)=>b[1]-a[1])[0][0];let rows=[],row=[],cell='',quoted=false;for(let i=0;i<lines.length;i++){let c=lines[i];if(quoted){if(c==='"'&&lines[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c;}else if(c==='"')quoted=true;else if(c===del){row.push(cell);cell=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&lines[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c;}if(cell||row.length){row.push(cell);rows.push(row)}return rows.slice(0,5000)}
async function loadFiles(input){let incoming=[...(input.files||[])];for(const f of incoming){if(f.size>8*1024*1024){alertMsg('Файл '+f.name+' превышает тестовый лимит 8 МБ.','bad');continue}try{let sheets={};if(/\.csv$/i.test(f.name)){let b=await f.arrayBuffer();let text=new TextDecoder('utf-8',{fatal:false}).decode(b);sheets['CSV']=parseCSV(text)}else if(/\.xlsx$/i.test(f.name)){sheets=await nativeXLSX(await f.arrayBuffer())}else{alertMsg('Поддерживаются только .xlsx и .csv','bad');continue}const sheet=Object.keys(sheets)[0];if(!sheet)throw Error('Нет листов с данными');let o={id:id(),name:f.name,supplier:f.name.replace(/\.(csv|xlsx)$/i,'').slice(0,55),sheets,sheet,header:0,cols:{name:-1,price:-1,final:-1,discount:-1,pack:-1,min:-1,volume:-1},priceMode:'unit',packSize:1,minQty:1,date:'',issues:[]};guess(o);files.push(o)}catch(e){alertMsg('Не удалось разобрать «'+f.name+'»: '+e.message,'bad')}}input.value='';invalidate();render()}
const colNames={name:['наимен','назван','товар','позиция','номенклат','продукц','product','name'],price:['цена','стоим','price'],final:['со скидкой','итогов','после скидк','закупочн','цена финал'],discount:['скидка','скидк, %','discount'],pack:['в упаков','кратност','кол в кор','штук в','фасовк'],min:['минимал','мин.','мин ','отгрузк от'],volume:['объём','объем','литраж','объем/ед']};
function classifyHeader(x){let n=norm(x);if(!n)return null;if(colNames.name.some(q=>n.includes(q)))return 'name';if(colNames.final.some(q=>n.includes(q)))return 'final';if(n==='%'||/^скидк/.test(n)||n.startsWith('discount'))return 'discount';if(colNames.volume.some(q=>n.includes(q)))return 'volume';if(colNames.pack.some(q=>n.includes(q)))return 'pack';if(colNames.min.some(q=>n.includes(q)))return 'min';if(colNames.price.some(q=>n.includes(q)))return 'price';return null}
function autoColumns(f){f.cols={name:-1,price:-1,final:-1,discount:-1,pack:-1,min:-1,volume:-1};let rows=f.sheets[f.sheet]||[];
for(let r=f.header;r>=Math.max(0,f.header-2);r--){(rows[r]||[]).forEach((c,i)=>{let k=classifyHeader(c);if(k&&f.cols[k]<0&&String(c||'').length<52)f.cols[k]=i;});}
if(f.cols.name<0)f.cols.name=0;
let heads=rows.slice(Math.max(0,f.header-2),f.header+1).flat();
if(f.cols.final>=0)f.priceMode='final';
else if(f.cols.price>=0){let pcol=f.cols.price;let text=rows.slice(Math.max(0,f.header-2),f.header+1).map(r=>norm((r||[])[pcol]||'')).join(' ');f.priceMode=/(за короб|за упаков|за ящик)/.test(text)?'box':'unit';}
else f.priceMode='unit';}
function guess(f){let rows=f.sheets[f.sheet]||[],best=-1,score=-1;for(let r=0;r<Math.min(rows.length,25);r++){let v=rows[r]||[];let c=v.map(classifyHeader);let n=c.includes('name'),p=c.includes('price')||c.includes('final');let s=(n?6:0)+(p?5:0)+v.filter(x=>String(x||'').trim()).length/12;if(n&&p&&s>score){best=r;score=s;}}
if(best<0){let nameRows=[],priceRows=[];rows.slice(0,25).forEach((row,r)=>{(row||[]).forEach((v,c)=>{let k=classifyHeader(v);if(k==='name')nameRows.push({r,c});if(k==='price'||k==='final')priceRows.push({r,c});})});
let pairs=[];for(let a of nameRows)for(let b of priceRows)if(Math.abs(a.r-b.r)<=2)pairs.push({header:Math.max(a.r,b.r),dist:Math.abs(a.r-b.r)});pairs.sort((a,b)=>a.dist-b.dist||b.header-a.header);if(pairs.length)best=pairs[0].header;}
f.header=best<0?0:best;autoColumns(f)}
function updFile(fid,key,value){let f=files.find(x=>x.id===fid);if(!f)return;if(key==='sheet'){f.sheet=value;guess(f)}else if(key==='header'){f.header=Number(value);guessFromHeader(f)}else if(key.startsWith('col_')){f.cols[key.slice(4)]=Number(value)}else if(key==='supplier'||key==='date'){f[key]=value}else if(key==='priceMode'){f.priceMode=value}else if(key==='packSize'||key==='minQty'){f[key]=Math.max(1,Math.ceil(Number(value)||1))}invalidate();render()}
function guessFromHeader(f){autoColumns(f)}
function updateFileSelect(fid,k,which){let f=files.find(x=>x.id===fid);if(!f)return;if(k==='sheet')f.sheet=which,guess(f);else if(k==='header')f.header=Number(which),guessFromHeader(f);invalidate();render()}
function cleanOffer(f,row,r){let c=f.cols;let txt=String(row[c.name]??'').trim(),vol=c.volume>=0?String(row[c.volume]??'').trim():'';if(!txt||r<=f.header)return null;let rawPrice=num(row[c.price]);let final=num(row[c.final]);let disc=num(row[c.discount]);let pack=num(row[c.pack]);let min=num(row[c.min]);let inferred=String(txt).match(/\d+(?:[.,]\d+)?\s*\/\s*(\d{1,3})(?!\d)/);pack=Number.isInteger(pack)&&pack>0?pack:(inferred&&f.priceMode==='box'?Number(inferred[1]):f.packSize);min=Number.isInteger(min)&&min>0?min:f.minQty;if(f.priceMode==='box'&&c.min>=0){let headerName=norm((f.sheets[f.sheet][f.header]||[])[c.min]);if(/короб|ящик|упаков/.test(headerName))min*=pack}let priceKop,mode=f.priceMode;
if(mode==='final'){priceKop=Number.isFinite(final)?kop(final):NaN;}
else if(mode==='discount'){priceKop=Number.isFinite(final)?kop(final):Number.isFinite(rawPrice)&&Number.isFinite(disc)?Math.round(kop(rawPrice)*(100-disc)/100):NaN;}
else priceKop=Number.isFinite(rawPrice)?kop(rawPrice):NaN;
if(!(Number.isInteger(priceKop)&&priceKop>0))return {id:f.id+':'+r,fid:f.id,sourceRow:r+1,name:txt,bad:'Нет достоверной цены',mode,pack,min,volume:vol};
if(mode==='box'&&!(Number.isInteger(pack)&&pack>0)||mode==='box'&&pack===1&&c.pack<0&&!inferred)return {id:f.id+':'+r,fid:f.id,sourceRow:r+1,name:txt,bad:'Неизвестно количество в коробке',mode,pack,min,volume:vol};
return {id:f.id+':'+r,fid:f.id,sourceRow:r+1,name:txt,priceKop,pack, min,mode, rawPrice,final,disc,volume:vol,packInferred:mode==='box'&&c.pack<0&&!!inferred};}
function offers(){return files.flatMap(f=>{let rows=f.sheets[f.sheet]||[];return rows.slice(f.header+1,Math.min(rows.length,5010)).map((r,i)=>cleanOffer(f,r,f.header+1+i)).filter(Boolean)});}
function addNeed(){const name=select('newName')?.value.trim();let qty=Number(select('newQty')?.value);if(!name)return alertMsg('Введите название товара','bad');if(!Number.isFinite(qty)||qty<0)return alertMsg('Укажите количество от нуля','bad');needs.push({id:id(),name,mode:'direct',quantity:Math.ceil(qty),actual:0,target:0,unit:'шт.'});invalidate();render()}
function addFromOffer(oid){const o=offers().find(x=>x.id===oid);if(!o)return;needs.push({id:id(),name:o.name,mode:'direct',quantity:1,actual:0,target:0,unit:'шт.'});invalidate();render();}
function needChange(nid,key,val){let n=needs.find(x=>x.id===nid);if(!n)return;n[key]=key==='mode'||key==='name'||key==='unit'?val:Math.max(0,Math.ceil(Number(val)||0));invalidate();render()}
function removeNeed(nid){needs=needs.filter(n=>n.id!==nid);delete matches[nid];delete choices[nid];invalidate();render()}
function matchList(n,o){let nam=norm(n.name),other=norm(o.name);let word=nam.split(' ').filter(x=>x.length>=3);let score=word.filter(x=>other.includes(x)).length/Math.max(1,word.length);return (nam===other?100:score*100);}
function matchCandidates(n,fid){return offers().filter(o=>o.fid===fid&& !o.bad).map(o=>({...o,score:matchList(n,o)})).filter(o=>o.score>=30).sort((a,b)=>b.score-a.score).slice(0,12)}
function unitVolume(s){let t=String(s||'').toLowerCase().replace(/,/g,'.');let m=t.match(/(\d+(?:\.\d+)?)\s*(мл|л|литр|кг|г)(?![а-я])/);if(!m){m=t.match(/(\d+[.]\d+)\s*\/\s*\d+/);if(m)return 'l:'+Math.round(Number(m[1])*1000);return null;}let v=Number(m[1]);return m[2]==='мл'?'l:'+Math.round(v):m[2]==='г'?'kg:'+Math.round(v):m[2]==='кг'?'kg:'+Math.round(v*1000):'l:'+Math.round(v*1000)}
function updateMatch(nid,fid,oid){let n=needs.find(x=>x.id===nid),o=offers().find(x=>x.id===oid);if(n&&o){let nVol=unitVolume(n.name),oVol=unitVolume(o.name+' '+(o.volume||''));if(nVol&&oVol&&nVol!==oVol&&!window.confirm('Объём или масса не совпадают: '+n.name+' и '+o.name+' '+(o.volume||'')+'. Вы действительно разрешаете замену для этой закупки?')){render();return;}}matches[nid]??={};if(oid)matches[nid][fid]=oid;else delete matches[nid][fid];delete choices[nid];delete approvals[nid];delete approvals[nid+':pack'];invalidate();render()}
function matchedOffers(n){let m=matches[n.id]||{};return Object.values(m).map(oid=>offers().find(o=>o.id===oid)).filter(Boolean);}
function orderOption(o,q){let ordered=q,pack=1;
if(o.mode==='box'){pack=o.pack||0;if(!pack)return null;ordered=Math.ceil(Math.max(q,o.min||1)/pack)*pack}else ordered=Math.max(q,o.min||1);
const units=o.mode==='box'?ordered/o.pack:ordered;
return {offer:o,orderQty:ordered, units, surplus:ordered-q,amount:o.priceKop*units,unitCost:o.mode==='box'?Math.round(o.priceKop/o.pack):o.priceKop};}
function options(n){let q=needsQuantity(n);return q>0?matchedOffers(n).map(o=>orderOption(o,q)).filter(Boolean).sort((a,b)=>a.amount-b.amount||a.offer.fid.localeCompare(b.offer.fid)):[]}
function chosen(n){let opts=options(n);return opts.find(o=>o.offer.id===choices[n.id])||opts[0]||null}
function issues(){let errs=[],warns=[];if(!files.length)errs.push('Не загружены прайсы');let relevant=needs.filter(n=>needsQuantity(n)>0);if(!relevant.length)errs.push('Нет товаров с положительной потребностью');for(let n of relevant){let c=chosen(n);if(!c)errs.push('Нет подтверждённого предложения: '+n.name);else{if(c.surplus>0&&!approvals[n.id])errs.push('Подтвердите превышение '+c.surplus+' ед.: '+n.name);if(c.offer.packInferred&&!approvals[n.id+':pack'])errs.push('Проверьте размер короба ('+c.offer.pack+' шт.), извлечённый из названия: '+n.name);let f=files.find(f=>f.id===c.offer.fid);if(f&&!f.date)warns.push('Не указана дата прайса: '+f.supplier);if(f&&f.date&&Date.now()-new Date(f.date+'T12:00:00').getTime()>14*86400000)warns.push('Прайс устарел более чем на 14 дней: '+f.supplier)}}return {errs,warns}}
function lines(){return needs.filter(n=>needsQuantity(n)>0).map(n=>({n,q:needsQuantity(n),chosen:chosen(n)}));}
function total(){return lines().reduce((s,l)=>s+(l.chosen?.amount||0),0)}
function confirmOrder(){let err=issues();if(err.errs.length)return alertMsg('Исправьте: '+err.errs.join('; '),'bad');confirmed=true;supplierMessages=buildMessages();render();alertMsg('Проект закупки подтверждён для формирования сообщений. Перед отправкой проверьте цены и наличие.','good')}
function buildMessages(){let map=new Map;for(let l of lines()){if(!l.chosen)continue;let o=l.chosen;let f=files.find(f=>f.id===o.offer.fid);let g=map.get(f.id)||{id:f.id,name:f.supplier,lines:[],total:0};let unit=o.offer.mode==='box'?`${o.units} кор. × ${o.offer.pack} шт. (всего ${o.orderQty})`:`${o.orderQty} ${l.n.unit}`;g.lines.push(`${g.lines.length+1}. ${o.offer.name} — ${unit} · ${money(o.amount)}`);g.total+=o.amount;map.set(f.id,g)}return [...map.values()].map(g=>({...g,text:`Здравствуйте!\n\nПросим подготовить заказ:\n${g.lines.join('\n')}\n\nРасчётная сумма по загруженному прайсу: ${money(g.total)}.\nПожалуйста, подтвердите наличие, актуальные цены и окончательные условия поставки.`}))}
async function copyMessage(i){let x=supplierMessages[i];if(!x)return;try{await navigator.clipboard.writeText(x.text);alertMsg('Сообщение «'+x.name+'» скопировано.','good')}catch(e){let t=document.createElement('textarea');t.value=x.text;document.body.append(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}t.remove();alertMsg(ok?'Сообщение скопировано.':'Автоматическое копирование недоступно. Выделите текст и скопируйте вручную.',ok?'good':'bad')}}
function saveLocal(){if(!confirmed)return alertMsg('Сначала проверьте и подтвердите закупку','bad');try{let payload={version:1,savedAt:new Date().toISOString(),files,needs,matches,choices,approvals};let js=JSON.stringify(payload);if(js.length>3_500_000)return alertMsg('Данные слишком велики для локального хранения. Уменьшите размер прайсов.','bad');localStorage.setItem('barzayavka-real-draft-v1',js);savedStamp=payload.savedAt;alertMsg('Закупка сохранена только в этом браузере. При очистке Safari данные могут исчезнуть.','good');render()}catch(e){alertMsg('Не удалось сохранить на устройстве: '+e.message,'bad')}}
function restoreLocal(){try{const js=localStorage.getItem('barzayavka-real-draft-v1');if(!js)return alertMsg('Сохранённой закупки нет','bad');let d=JSON.parse(js);if(d.version!==1||!Array.isArray(d.files)||!Array.isArray(d.needs))throw Error('Некорректная версия данных');files=d.files;needs=d.needs;matches=d.matches||{};choices=d.choices||{};approvals={};invalidate();go(1);alertMsg('Список и ранее выбранные предложения восстановлены. Обязательно проверьте актуальность цен и повторно подтвердите заказ.','good')}catch(e){alertMsg('Не удалось открыть сохранённую закупку: '+e.message,'bad')}}
function freshCycle(){choices={};approvals={};confirmed=false;supplierMessages=[];needs.forEach(n=>{if(n.mode==='stock')n.actual=0});go(1);alertMsg('Новый цикл открыт. Уточните остатки, загрузите новые прайсы и проверьте совпадения до утверждения.','warn')}
function colOptions(f,k){let rows=f.sheets[f.sheet]||[],max=Math.max(...rows.slice(0,25).map(x=>x.length),1);return `<select class="field" onchange="updFile('${f.id}','col_${k}',this.value)"><option value="-1" ${f.cols[k]<0?'selected':''}>— не указан —</option>${Array.from({length:Math.min(50,max)},(_,i)=>`<option value="${i}" ${f.cols[k]===i?'selected':''}>${i+1} · ${esc(String((rows[f.header]||[])[i]||'Столбец '+(i+1)).slice(0,30))}</option>`).join('')}</select>`}
function render0(){let count=offers();return `<div class="eyebrow">Шаг 1 из 8</div><h1>Загрузите свои прайсы</h1><p class="muted">Файлы разбираются внутри браузера. Они не отправляются на сервер. Используйте XLSX/CSV до 8 МБ, до 5000 строк на лист.</p><div class="alert">Бета: работа с собственными файлами. Цена за бутылку и цена за коробку — разные режимы. Запись «0,7/6» <b>не доказывает</b> минимальную партию. В сомнительных случаях уточните условия у поставщика.</div><div class="panel"><h2>Добавить предложения поставщиков</h2><input class="field wide" type="file" accept=".xlsx,.csv" multiple onchange="loadFiles(this)"><p class="note">XLSX и CSV обрабатываются внутри вашего браузера без внешних скриптов. PDF, изображения и макросы не поддерживаются.</p><div class="btnbar"><button class="btn" onclick="restoreLocal()">Открыть ранее сохранённую закупку</button><button class="btn" onclick="if(confirm('Очистить текущие прайсы?')){files=[];matches={};choices={};invalidate();render()}">Очистить прайсы</button></div></div>${files.map(f=>`<div class="panel"><div class="row between"><h3>${esc(f.name)}</h3><button class="btn" onclick="files=files.filter(x=>x.id!=='${f.id}');invalidate();render()">Удалить</button></div><div class="grid two"><div><label class="caption">Поставщик</label><input class="field wide" value="${esc(f.supplier)}" onchange="updFile('${f.id}','supplier',this.value)"></div><div><label class="caption">Дата прайса (если известна)</label><input class="field wide" type="date" value="${esc(f.date)}" onchange="updFile('${f.id}','date',this.value)"></div><div><label class="caption">Лист Excel</label><select class="field wide" onchange="updateFileSelect('${f.id}','sheet',this.value)">${Object.keys(f.sheets).map(x=>`<option ${x===f.sheet?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label class="caption">Строка заголовков</label><select class="field wide" onchange="updateFileSelect('${f.id}','header',this.value)">${Array.from({length:Math.min(30,f.sheets[f.sheet].length)},(_,i)=>`<option value="${i}" ${f.header===i?'selected':''}>Строка ${i+1}</option>`).join('')}</select></div></div><div class="grid" style="margin-top:12px">${[['name','Название товара'],['volume','Объём/масса'],['price','Цена основная'],['final','Цена со скидкой'],['discount','Скидка, %'],['pack','Штук в упаковке'],['min','Минимум, шт.']].map(([k,label])=>`<div><label class="caption">${label}</label>${colOptions(f,k)}</div>`).join('')}</div><div class="grid two" style="margin-top:12px"><div><label class="caption">Какую цену показывает прайс?</label><select class="field wide" onchange="updFile('${f.id}','priceMode',this.value)">${[['unit','За 1 единицу'],['box','За коробку / упаковку'],['final','Использовать столбец «Цена со скидкой»'],['discount','Исходная цена − скидка % (или готовая итоговая)']].map(([v,t])=>`<option value="${v}" ${v===f.priceMode?'selected':''}>${t}</option>`).join('')}</select></div><div class="grid two"><div><label class="caption">Размер короба (если нет столбца)</label><input type="number" min="1" class="field wide" value="${f.packSize}" onchange="updFile('${f.id}','packSize',this.value)"></div><div><label class="caption">Минимальная партия, шт. (если известна)</label><input type="number" min="1" class="field wide" value="${f.minQty}" onchange="updFile('${f.id}','minQty',this.value)"></div></div></div><details><summary>Посмотреть исходные строки и распознавание</summary><p class="note">Всего распознано: ${count.filter(x=>x.fid===f.id&&!x.bad).length}; требуют исправления цены: ${count.filter(x=>x.fid===f.id&&x.bad).length}. Столбцы и единицу цены подтвердите вручную.</p><div class="preview"><table>${f.sheets[f.sheet].slice(Math.max(0,f.header),f.header+9).map((r,i)=>`<tr>${(r||[]).slice(0,22).map(c=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div></details></div>`).join('')}<div class="panel"><b>${files.length} прайсов · ${count.filter(x=>!x.bad).length} предложений с ценой · ${count.filter(x=>x.bad).length} строк требуют уточнения</b><p class="note">Неполные или подозрительные строки не будут использованы для цены, пока вы не исправите столбцы либо исходный файл.</p></div>`}
function render1(){return `<div class="eyebrow">Шаг 2 из 8</div><h1>Что нужно заказать?</h1><p class="muted">Добавьте нужные позиции. Можно указать количество напрямую или разницу между целевым и фактическим остатком.</p><div class="panel"><h2>Добавить товар</h2><div class="row"><input class="field flex1" id="newName" placeholder="Например: Виски Лесной Берег 0,7 л"><input class="field" id="newQty" type="number" min="0" value="1" style="max-width:100px"><button class="btn primary" onclick="addNeed()">Добавить</button></div><details><summary>Добавить из загруженных прайсов</summary><div class="row"><select class="field wide" id="fromOffer">${offers().filter(x=>!x.bad).slice(0,300).map(o=>`<option value="${o.id}">${esc(o.name)} · ${esc(supplierName(o.fid))}</option>`).join('')}</select><button class="btn" onclick="addFromOffer(select('fromOffer').value)">Добавить</button></div></details></div>${needs.map(n=>`<div class="panel"><div class="row between"><b>${esc(n.name)}</b><button class="btn" onclick="removeNeed('${n.id}')">Удалить</button></div><div class="grid two"><div><label class="caption">Название для поиска</label><input class="field wide" value="${esc(n.name)}" onchange="needChange('${n.id}','name',this.value)"></div><div><label class="caption">Способ расчёта</label><select class="field wide" onchange="needChange('${n.id}','mode',this.value)"><option value="direct" ${n.mode==='direct'?'selected':''}>Указать количество</option><option value="stock" ${n.mode==='stock'?'selected':''}>Факт и целевой остаток</option></select></div></div><div class="row" style="margin-top:9px">${n.mode==='direct'?`<label>К заказу: <input class="field" style="width:100px" type="number" min="0" value="${n.quantity}" onchange="needChange('${n.id}','quantity',this.value)"></label>`:`<label>Факт: <input class="field" style="width:95px" type="number" min="0" value="${n.actual}" onchange="needChange('${n.id}','actual',this.value)"></label><label>Цель: <input class="field" style="width:95px" type="number" min="0" value="${n.target}" onchange="needChange('${n.id}','target',this.value)"></label>`}<b>Потребность: ${needsQuantity(n)}</b></div></div>`).join('')||'<div class="alert">Товары пока не добавлены.</div>'}`}
function render2(){return `<div class="eyebrow">Шаг 3 из 8</div><h1>Подтвердите совпадения</h1><p class="muted">Выберите точное предложение каждого поставщика. Похожие названия, разные бренды и объёмы не считаются одинаковыми автоматически.</p>${needs.filter(n=>needsQuantity(n)>0).map(n=>`<div class="panel"><h3>${esc(n.name)} · нужно ${needsQuantity(n)}</h3><div class="grid">${files.map(f=>{let cc=matchCandidates(n,f.id),current=matches[n.id]?.[f.id]||'';let options=offers().filter(x=>x.fid===f.id&&!x.bad).slice(0,400);return `<div><label class="caption">${esc(f.supplier)}</label><select class="field wide" onchange="updateMatch('${n.id}','${f.id}',this.value)"><option value="">Не выбран / нет совпадения</option>${options.map(o=>`<option value="${o.id}" ${o.id===current?'selected':''}>${cc.some(c=>c.id===o.id)?'★ ':''}${esc((o.name+(o.volume?' · '+o.volume:'')).slice(0,95))}</option>`).join('')}</select><div class="tag">★ предложенное совпадение — только подсказка, не подтверждение</div></div>`}).join('')}</div>${matchedOffers(n).length?`<div class="alert green">Выбрано предложений: ${matchedOffers(n).length}. Вы подтвердили их сопоставимость для этой закупки.</div>`:'<div class="alert red">Не выбрано ни одного подтверждённого предложения. Эта позиция заблокирует утверждение.</div>'}</div>`).join('')||'<div class="alert">Нет потребностей с положительным количеством.</div>'}`}
function render3(){return `<div class="eyebrow">Шаг 4 из 8</div><h1>Выберите поставщиков</h1><p class="muted">Сравнивается <b>стоимость допустимой партии</b>, а не только цена за единицу. Можно изменить поставщика вручную.</p>${needs.filter(n=>needsQuantity(n)>0).map(n=>{let list=options(n),sel=chosen(n);return `<div class="panel"><div class="row between"><h3>${esc(n.name)} · требуется ${needsQuantity(n)}</h3><span class="badge ${sel?'good':'bad'}">${sel?'Найдено '+list.length:'Нет подтверждённого предложения'}</span></div>${list.length?`<div class="radios">${list.map((o,i)=>`<div class="card ${o.offer.id===sel?.offer.id?'chosen':''}"><label class="row"><input type="radio" name="choice-${n.id}" ${o.offer.id===sel?.offer.id?'checked':''} onchange="choices['${n.id}']='${o.offer.id}';delete approvals['${n.id}'];invalidate();render()"><b>${esc(supplierName(o.offer.fid))}</b></label><div class="price">${money(o.amount)}</div><div class="mini">${money(o.unitCost)} / ед. · ${o.offer.mode==='box'?o.units+' кор. по '+o.offer.pack+' шт.':o.orderQty+' шт.'}</div>${o.surplus?`<p class="warnline">Заказ на ${o.surplus} ед. больше потребности</p>`:''}${i===0?'<span class="badge good">Минимальная стоимость позиции</span>':''}</div>`).join('')}</div>${sel?.surplus?`<label class="row" style="margin-top:10px"><input type="checkbox" ${approvals[n.id]?'checked':''} onchange="approvals['${n.id}']=this.checked;confirmed=false;render()"><b>Подтверждаю лишние ${sel.surplus} ед. из-за условий продажи</b></label>`:''}${sel?.offer.packInferred?`<label class="row" style="margin-top:10px"><input type="checkbox" ${approvals[n.id+':pack']?'checked':''} onchange="approvals['${n.id}:pack']=this.checked;confirmed=false;render()"><b>Проверил: запись в названии означает короб ${sel.offer.pack} шт., а не только транспортную тару</b></label>`:''}`:'<div class="alert red">Для этого товара пока нет подтверждённого предложения с известной ценой.</div>'}</div>`}).join('')}<div class="total"><span>Итого по выбранным предложениям</span><strong>${money(total())}</strong></div>`}
function render4(){let x=issues();return `<div class="eyebrow">Шаг 5 из 8</div><h1>Проверьте расчёт</h1><p class="muted">Проверьте каждый товар, поставщика, единицу цены, превышение потребности и итоговую сумму.</p><div class="grid"><div class="panel"><div class="kpi">${lines().length}</div><div class="mini">Позиций к заказу</div></div><div class="panel"><div class="kpi">${money(total())}</div><div class="mini">Расчётная стоимость</div></div><div class="panel"><div class="kpi">${x.errs.length}</div><div class="mini">Неразрешённых проблем</div></div></div>${x.errs.length?`<div class="alert red"><b>Нужно уточнить:</b><ul>${x.errs.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:'<div class="alert green">Блокирующих вопросов нет. Можно подтвердить закупку для подготовки сообщений.</div>'}${x.warns.length?`<div class="alert"><b>Проверка актуальности:</b><ul>${[...new Set(x.warns)].map(a=>`<li>${esc(a)}</li>`).join('')}</ul>Цены не подтверждены поставщиками.</div>`:''}<div class="panel">${lines().map(l=>`<div class="line"><b>${esc(l.n.name)}</b> · нужно ${l.q}<div class="mini">${l.chosen?`${esc(supplierName(l.chosen.offer.fid))} · заказать ${l.chosen.orderQty} · ${money(l.chosen.amount)} · исходная строка ${l.chosen.offer.sourceRow}`:'Позиция не рассчитана'}</div></div>`).join('')}</div><div class="btnbar"><button class="btn good" ${x.errs.length?'disabled':''} onclick="confirmOrder()">✓ Утвердить проект закупки</button><span class="badge ${confirmed?'good':'warn'}">${confirmed?'✓ Утверждено':'Ещё не утверждено'}</span></div>`}

function render6(){return `<div class="eyebrow">Шаг 7 из 8</div><h1>Сохраните закупку</h1><div class="panel"><h2>Локальный шаблон</h2><p>Вы можете сохранить загруженные и сопоставленные данные в этом браузере. <b>Это не облачная синхронизация</b>, и Safari может удалить их при очистке данных сайта.</p><div class="alert">Файлы не отправляются нам, но после сохранения строки прайсов будут храниться в памяти вашего браузера. Если это конфиденциальные данные — согласуйте такой способ хранения.</div><button class="btn good" onclick="saveLocal()" ${!confirmed?'disabled':''}>Сохранить только на этом устройстве</button><div class="mini" style="margin-top:12px">${savedStamp?'Последнее сохранение: '+esc(savedStamp):'Данные ещё не сохранены'}</div></div>`}
