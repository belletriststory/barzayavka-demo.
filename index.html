<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.48 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--blue)}.layout{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--navy);color:#f6f9fa;padding:28px 16px 22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:3px 10px 26px}.brand-mark{width:40px;height:40px;border-radius:13px;background:#ddf0e6;color:#1b634c;font-weight:900;display:grid;place-items:center;font-size:14px;letter-spacing:-1px}.brand-name{font-size:20px;font-weight:850;letter-spacing:-.8px}.brand-note{font-size:11px;color:#b8c9d3}.side-title{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700;color:#a9c0cb;padding:8px 12px}.navlink{display:flex;gap:11px;align-items:center;width:100%;border:0;background:transparent;color:#d7e1e6;padding:12px 10px;text-align:left;border-radius:10px;font-size:13px;margin:3px 0}.navlink:hover{background:#264558}.navlink.active{background:#eef5f5;color:#203c48;font-weight:760}.navnum{display:grid;place-items:center;background:rgba(255,255,255,.1);border-radius:8px;min-width:27px;height:27px;font-size:11px;font-weight:700}.active .navnum{background:#d8e9e3;color:#255b4a}.sidefooter{margin-top:24px;padding:14px 11px;border:1px solid #466070;border-radius:12px;color:#c5d4de;font-size:12px}.main{min-width:0}.topbar{background:#fff;border-bottom:1px solid var(--line);padding:13px clamp(18px,4vw,46px);display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.crumb{font-size:13px;color:var(--sub)}.smalltag{font-size:11px;font-weight:800;letter-spacing:.35px;padding:6px 10px;border:1px solid #b7cfbf;border-radius:999px;color:#1c6b4d;background:#f2f9f5}.content{max-width:1110px;margin:0 auto;padding:34px clamp(16px,4vw,46px) 115px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.15px;color:var(--blue);font-weight:800;margin-bottom:9px}.headline{font-size:clamp(25px,2.7vw,37px);letter-spacing:-1.2px;line-height:1.12;margin:0 0 10px;font-weight:810}.subhead{color:var(--sub);max-width:800px;margin:0 0 24px;font-size:15px}.alert{padding:13px 15px;border-radius:12px;background:var(--amberbg);color:#79530d;border:1px solid #eedaaa;font-size:13px;margin-bottom:20px}.alert.good{background:var(--mint);color:#22664a;border-color:#cbe4d3}.alert.bad{background:var(--redbg);color:#8d4435;border-color:#f5d1cb}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.surface{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}.surface.slim{padding:16px}.surface h3{font-size:17px;letter-spacing:-.3px;margin:0 0 10px}.surface p{margin:0;color:var(--sub)}.soft{background:#f6f9f8;border:1px solid var(--line);border-radius:12px;padding:14px}.muted{color:var(--sub)}.f12{font-size:12px}.f13{font-size:13px}.label{font-size:12px;color:#5b707a;font-weight:720;margin-bottom:6px}.field{border:1px solid #cdd9dd;border-radius:9px;padding:10px 11px;min-width:0;background:white;color:var(--ink);width:100%;outline-color:#2880a1}.field.small{width:85px;padding:8px 9px;text-align:right}.field.medium{width:110px;padding:8px 9px}.btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;border-radius:10px;padding:11px 16px;border:1px solid #cbd8dd;font-weight:750;background:#fff;color:var(--ink);font-size:13px;transition:background .15s}.btn:hover{background:#f4f8f8}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.primary:hover{background:#244a60}.btn.danger{color:#9d3d33}.btn.small{padding:7px 10px;font-size:12px}.btn.active{background:#e4f0eb;border-color:#97c5ae;color:#1e714b}.btnbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:7px;background:#f0f3f5;color:#516371;padding:5px 7px;font-weight:770;white-space:nowrap}.badge.good{background:#e3f3e8;color:#21754b}.badge.warn{background:#fff1d8;color:#946500}.badge.bad{background:#fdece9;color:#ad4537}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.sep{border-top:1px solid var(--line);margin:15px 0}.stat{background:#fff;border:1px solid var(--line);padding:17px;border-radius:13px}.stat strong{display:block;font-size:25px;letter-spacing:-.8px}.stat span{color:var(--sub);font-size:12px}.fileitem{display:flex;align-items:center;gap:14px}.fileic{display:grid;place-items:center;width:40px;height:42px;background:#e9f3ee;color:#267554;border-radius:11px;font-size:14px;font-weight:800}.filemeta{min-width:0}.filemeta b{display:block;font-size:14px}.filemeta span{display:block;color:var(--sub);font-size:12px}.kbd{font-size:11px;font-weight:780;background:#e9eff2;padding:3px 7px;border-radius:6px}.tablewrap{overflow-x:auto}.items-table{border-collapse:collapse;width:100%;min-width:710px}.items-table th{font-size:11px;font-weight:800;letter-spacing:.25px;color:#72818a;text-align:left;padding:10px 10px;background:#f6f8f8;border-bottom:1px solid var(--line)}.items-table td{padding:12px 10px;border-bottom:1px solid #ebf0f0;font-size:13px;vertical-align:middle}.items-table tr:last-child td{border-bottom:0}.items-table .name{font-weight:720}.tagnum{font-size:10px;color:#697983;margin-top:3px}.minicard{padding:12px;border:1px solid var(--line);background:#fff;border-radius:11px}.mini-title{font-weight:750;font-size:13px}.price{font-weight:820;font-size:18px;letter-spacing:-.4px}.seller-card{padding:13px;border-radius:11px;border:1px solid #d7e2e4;min-width:0;flex:1}.seller-card.current{border:2px solid #2e876b;background:#f5fbf7;padding:12px}.seller-card.cheapest:not(.current){border-color:#c0d5c7}.seller-name{font-weight:770;font-size:13px}.seller-detail{font-size:12px;color:#657781;margin:4px 0 10px}.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--green);background:#e0f1e7;border-radius:5px;padding:3px 6px;margin-left:5px}.expand{width:100%;border:0;text-align:left;background:none;display:flex;justify-content:space-between;align-items:center;padding:0;color:var(--ink);font:inherit;gap:8px}.details{margin-top:15px;padding-top:15px;border-top:1px solid #e3eaeb}.totalpanel{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--navy);border-radius:14px;padding:18px 20px;color:#fff;margin:18px 0}.totalpanel strong{font-size:26px;letter-spacing:-.6px}.totalpanel small{display:block;color:#c5d7df}.fixedactions{position:fixed;bottom:0;right:0;left:258px;z-index:7;display:flex;gap:10px;align-items:center;justify-content:space-between;background:rgba(255,255,255,.97);backdrop-filter:blur(5px);border-top:1px solid var(--line);padding:12px clamp(16px,4vw,46px)}.actions-caption{color:var(--sub);font-size:12px}.checkboxrow{display:flex;gap:10px;align-items:flex-start;line-height:1.45}.checkboxrow input{margin-top:3px;accent-color:#287d61;min-width:18px;min-height:18px}.message{white-space:pre-wrap;background:#f6f8f8;border:1px solid #e6eceb;padding:14px;border-radius:10px;font:13px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace}.empty{text-align:center;padding:36px 18px;color:var(--sub)}.checklist{padding:0;list-style:none;margin:0}.checklist li{padding:10px 0;border-bottom:1px solid #edf1f0;display:flex;gap:10px;font-size:13px}.checklist li:last-child{border-bottom:0}.dot{height:19px;min-width:19px;border-radius:99px;display:grid;place-items:center;background:#e9f3ee;color:#20764d;font-size:11px;font-weight:bold}.dot.w{background:#fff1db;color:#8b6108}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.center{text-align:center}.modaloverlay{position:fixed;inset:0;background:rgba(4,18,30,.55);z-index:30;display:grid;place-items:center;padding:20px}.modal{background:white;width:min(540px,100%);border-radius:18px;padding:26px;box-shadow:0 35px 85px rgba(10,20,20,.2)}.hidden{display:none!important}input[type=search]{max-width:300px}.mini-icon{font-size:17px}.stepchip{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:12px 14px 10px}.brand{padding:3px 4px 10px}.side-title,.sidefooter{display:none}.navsteps{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.navsteps::-webkit-scrollbar{display:none}.navlink{flex:0 0 auto;width:auto;font-size:12px;margin:0;padding:7px 9px}.navnum{min-width:24px;height:24px}.topbar{top:0}.fixedactions{left:0}.content{padding-top:28px}.split{grid-template-columns:1fr}}
@media(max-width:650px){.grid,.grid.two{grid-template-columns:1fr}.surface{padding:16px}.topbar{padding:11px 14px}.content{padding-left:14px;padding-right:14px}.headline{font-size:29px}.btnbar{gap:6px}.seller-list{flex-direction:column}.seller-card{width:100%}.fixedactions{padding:10px 13px}.actions-caption{display:none}.fileitem{align-items:flex-start}.hide-mobile{display:none}.stat strong{font-size:23px}.topbar .smalltag{font-size:10px}}

<body>
<div class="layout">
<aside class="sidebar"><div class="brand"><div class="brand-mark">БЗ</div><div><div class="brand-name">БарЗаявка</div><div class="brand-note">Бесплатное демо · v1.2</div></div></div><button class="btn" style="margin:0 10px 18px;width:calc(100% - 20px);text-align:left" onclick="home()">⌂  Главная</button><div class="side-title">Маршрут закупки</div><nav class="navsteps" id="nav" aria-label="Этапы закупки"></nav><div class="sidefooter">Интерактивная модель с синтетическими данными. Это <b>не</b> запущенный сервис: свои файлы здесь загрузить нельзя.</div></aside>
<div class="main"><header class="topbar"><div class="crumb" id="breadcrumb">Демо / Прайсы</div><div class="row"><span class="smalltag">ДЕМО • без реальных заказов</span><span class="badge" id="topstatus">10 товаров</span></div></header><main class="content" id="root" aria-live="polite"></main></div></div>
<div class="fixedactions"><div class="actions-caption" id="actionsnote">Прототип: цифры и поставщики учебные</div><div class="btnbar"><button class="btn" id="back" type="button">← Назад</button><button class="btn primary" id="next" type="button">Далее →</button></div></div>
<div class="modaloverlay hidden" id="modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h3 id="modalTitle" style="margin-top:0">Информация</h3><p id="modalText"></p><div style="text-align:right;margin-top:22px"><button class="btn primary" onclick="hideModal()">Понятно</button></div></div></div>
<script>
const catalog=[
{id:'V01',name:'Водка Северная Нота',size:'0,5 л',unit:'бут.',mode:'direct',direct:7,stock:0,target:0,A:460,B:2580,pack:6,V:468},
{id:'W02',name:'Виски Лесной Берег',size:'0,7 л',unit:'бут.',mode:'direct',direct:2,stock:0,target:0,A:1720,B:9600,pack:6,V:1615},
{id:'G03',name:'Джин Портовый Dry',size:'0,7 л',unit:'бут.',mode:'stock',direct:0,stock:1,target:7,A:1310,B:6900,pack:6,V:1200},
{id:'S04',name:'Игристое Огни Брют',size:'0,75 л',unit:'бут.',mode:'stock',direct:0,stock:4,target:12,A:790,B:4260,pack:6,V:720},
{id:'R05',name:'Ром Белая Волна White',size:'0,7 л',unit:'бут.',mode:'direct',direct:3,stock:0,target:0,A:1120,B:6360,pack:6,V:1160},
{id:'Y06',name:'Сироп Вишня',size:'1 л',unit:'бут.',mode:'stock',direct:0,stock:2,target:5,A:500,B:1800,pack:4,V:510},
{id:'C07',name:'Кофе Ночной Бленд',size:'1 кг',unit:'уп.',mode:'stock',direct:0,stock:3,target:5,A:1350,B:6250,pack:5,V:1440},
{id:'M08',name:'Молоко 3,2%',size:'1 л',unit:'шт.',mode:'direct',direct:16,stock:0,target:0,A:125,B:1200,pack:12,V:126},
{id:'N09',name:'Салфетки белые',size:'200 шт. / уп.',unit:'уп.',mode:'stock',direct:0,stock:1,target:5,A:180,B:1500,pack:10,V:165},
{id:'T10',name:'Текила Агава Silver',size:'0,7 л',unit:'бут.',mode:'direct',direct:3,stock:0,target:0,A:1760,B:9000,pack:6,V:1600}
];
const steps=['Прайсы','Потребности','Совпадения','Предложения','Проверка','Сообщения','Сохранение','Повторная закупка'];
const state={step:-1,items:catalog.map(x=>({...x})),choice:{},manual:{},matchDry:false,checked:false,overageAccepted:false,expanded:{G03:true},saved:null,templateName:'Основная закупка бара',cycle:1,search:'',notification:'',guide:false,savedTemplates:[]};
// Сохранение локально на устройстве — без сервера и отправки данных третьим лицам.
try{const prev=JSON.parse(localStorage.getItem('barzayavka-demo-v12')||'null');if(prev&&Array.isArray(prev.savedTemplates)){state.savedTemplates=prev.savedTemplates; if(prev.draft&&Array.isArray(prev.draft.items)){Object.assign(state,prev.draft);}}}catch(e){console.warn('Локальное хранение недоступно',e)}
function persist(){try{localStorage.setItem('barzayavka-demo-v12',JSON.stringify({savedTemplates:state.savedTemplates,draft:{step:state.step,items:state.items,choice:state.choice,manual:state.manual,matchDry:state.matchDry,checked:state.checked,overageAccepted:state.overageAccepted,expanded:state.expanded,saved:state.saved,templateName:state.templateName,cycle:state.cycle}}))}catch(e){console.warn('Не удалось сохранить демо',e)}}
const root=document.getElementById('root');const supplierLabel=k=>({A:'А',B:'Б',V:'В'}[k]||k);const rub=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n);const nfmt=n=>new Intl.NumberFormat('ru-RU').format(n);const el=(s)=>document.getElementById(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function qty(x){return x.mode==='direct'?Math.max(0,Math.trunc(Number(x.direct)||0)):Math.max(0,Math.trunc(Number(x.target)||0)-Math.trunc(Number(x.stock)||0))}
function opts(x){const q=qty(x),np=q?Math.ceil(q/x.pack):0;return {A:{s:'А',price:x.A*q,volume:q,unit:x.unit,desc:`${rub(x.A)} за ${x.unit}`,line:`${q} ${x.unit}`},B:{s:'Б',price:x.B*np,volume:np*x.pack,unit:x.unit,desc:`${rub(x.B)} за короб ${x.pack} ${x.unit}`,line:`${np} кор. × ${x.pack} ${x.unit}`},V:{s:'В',price:x.V*q,volume:q,unit:x.unit,desc:`${rub(x.V)} за ${x.unit} (со скидкой)`,line:`${q} ${x.unit}`}}}
function recommended(x){const o=opts(x);return Object.keys(o).sort((a,b)=>o[a].price-o[b].price)[0]}
function selected(x){return state.choice[x.id]||recommended(x)}
function selectedOpt(x){return opts(x)[selected(x)]}
function ordered(){return state.items.filter(x=>qty(x)>0)}
function grand(){return ordered().reduce((s,x)=>s+selectedOpt(x).price,0)}
function overages(){return ordered().filter(x=>selectedOpt(x).volume>qty(x))}
function ready(){return state.matchDry&&state.checked&&(overages().length===0||state.overageAccepted)&&ordered().length>0}
function brief(){return `<div class="grid"><div class="stat"><strong>${state.items.length}</strong><span>Товаров в списке</span></div><div class="stat"><strong>${ordered().length}</strong><span>Позиций к покупке</span></div><div class="stat"><strong>${rub(grand())}</strong><span>Проект закупки</span></div></div>`}
function showModal(title,text){el('modalTitle').textContent=title;el('modalText').textContent=text;el('modal').classList.remove('hidden')};function hideModal(){el('modal').classList.add('hidden')};el('modal').addEventListener('click',e=>{if(e.target.id==='modal')hideModal()});
function title(i,name,sub){return `<div class="eyebrow">Шаг ${i+1} / 8 · Учебная закупка №${state.cycle}</div><h1 class="headline">${name}</h1><p class="subhead">${sub}</p>`}
function banner(){return `<div class="alert">Это кликабельный <b>прототип</b>. Используются только синтетические прайсы и демонстрационные правила. Он не импортирует ваши файлы, не подтверждает наличие товаров и не оформляет заказы.</div>`}
function renderHome(){return `<div class="eyebrow">БЕСПЛАТНАЯ ИНТЕРАКТИВНАЯ ДЕМОНСТРАЦИЯ</div><h1 class="headline">БарЗаявка</h1><p class="subhead">Из прайсов поставщиков — в готовую закупку. Реальные действия, проверяемые суммы и готовые сообщения без регистрации.</p>${banner()}<div class="grid two"><div class="surface"><h3>Быстрая заявка</h3><p>10 товаров, 3 учебных поставщика. Изменяй количество, сравнивай предложения и получай сообщения.</p><div class="stat"><strong>${rub(34130)}</strong><span>Начальная эталонная закупка</span></div><div style="margin-top:14px"><button class="btn primary" onclick="startDemo()">Попробовать демо →</button></div></div><div class="surface"><h3>Регулярная закупка</h3><p>Сохрани шаблон, открой его позже в этом же браузере и обнови остатки для нового цикла.</p><div class="stat"><strong>${state.savedTemplates.length}</strong><span>Сохранённых шаблонов на устройстве</span></div><div style="margin-top:14px"><button class="btn" onclick="showTemplates()">Мои закупки →</button></div></div></div><div class="surface"><h3>На что обратить внимание</h3><ol class="f13"><li>Перейди к потребностям и измени водку с 7 на 12 бутылок.</li><li>На экране предложений проверь смену оптимального поставщика А → Б.</li><li>Подтверди совпадение джина Dry и предупреждения по коробкам.</li><li>Скопируй сообщения, сохрани закупку и повтори её.</li></ol><p class="muted f12">Файлы XLSX/CSV здесь не загружаются: это бесплатный интерактивный тест интерфейса и арифметики, не коммерческий сервис.</p></div>`}
function renderTemplates(){return `<div class="eyebrow">ШАБЛОНЫ ЭТОГО УСТРОЙСТВА</div><h1 class="headline">Мои закупки</h1><p class="subhead">Сохранённые шаблоны хранятся только в браузере. Очистка данных сайта может их удалить.</p>${state.savedTemplates.length?state.savedTemplates.map((t,i)=>`<div class="surface"><div class="row between"><div><h3>${esc(t.title)}</h3><span class="muted f12">Цикл ${t.cycle} · ${esc(t.date||'Без даты')} · ${t.items.length} товаров</span></div><div class="btnbar"><button class="btn primary" onclick="repeatFrom(${i})">↻ Повторить</button><button class="btn" onclick="renameTemplate(${i})">Переименовать</button><button class="btn" onclick="deleteTemplate(${i})">Удалить</button></div></div><div class="muted f12">Сохранённые учебные цены могут устареть; перед реальной закупкой обязательно проверяй прайсы.</div></div>`).join(''):`<div class="surface"><h3>Пока нет сохранённых закупок</h3><p>Попробуй демонстрацию, утверди заказ и сохрани шаблон.</p><button class="btn primary" onclick="startDemo()">Создать первую закупку →</button></div>`}<button class="btn" onclick="home()">← На главную</button>`}
function home(){state.step=-1;render()}
function showTemplates(){state.step=-2;render()}
function startDemo(){state.step=0;state.items=catalog.map(x=>({...x}));state.choice={};state.manual={};state.matchDry=false;state.checked=false;state.overageAccepted=false;state.expanded={G03:true};state.saved=null;state.cycle=1;state.search='';render()}
function repeatFrom(i){const t=state.savedTemplates[i];if(!t)return;state.items=t.items.map(x=>({...x}));state.choice={...t.choice};state.manual={};state.matchDry=t.matchDry;state.checked=false;state.overageAccepted=false;state.expanded={G03:true};state.saved=t;state.cycle=(t.cycle||1)+1;state.step=1;render();showModal('Новый цикл готов','Обнови остатки и количества. Цены в демо остаются учебными — они не являются действующими коммерческими условиями.')}
function deleteTemplate(i){const t=state.savedTemplates[i];if(!t)return;if(confirm('Удалить шаблон «'+t.title+'» из браузера?')){state.savedTemplates.splice(i,1);render()}}
function renameTemplate(i){const t=state.savedTemplates[i];if(!t)return;const v=prompt('Новое название',t.title);if(v&&v.trim()){t.title=v.trim();render()}}

function render6(){return title(6,'Сохраните закупку','Подтверждённые товары и правила можно будет использовать в следующем цикле.')+`<div class="grid two"><div class="surface"><h3>Шаблон закупки</h3><label class="label" for="templateName">Название</label><input id="templateName" class="field" value="${esc(state.templateName)}" oninput="state.templateName=this.value"><div class="sep"></div><ul class="checklist"><li><span class="dot">✓</span>10 товаров и их единицы измерения</li><li><span class="dot">✓</span>Способы расчёта потребностей</li><li><span class="dot">✓</span>Выбор и соответствия поставщиков</li><li><span class="dot">✓</span>Учебные фасовки и предупреждения</li></ul><div style="margin-top:16px"><button class="btn primary" onclick="saveTemplate()">Сохранить шаблон в этом браузере</button></div></div><div class="surface"><h3>Последний результат</h3>${brief()}<div class="sep"></div>${state.saved?`<div class="alert good">✓ Шаблон «${esc(state.saved.title)}» сохранён в этом браузере.</div>`:`<div class="alert">Шаблон пока не сохранён. После сохранения он будет доступен на этом устройстве, пока не очищены данные браузера.</div>`}<p class="f12">Учебный HTML сохраняет шаблоны только в этом браузере, без учётной записи и синхронизации между устройствами.</p></div></div>`}

function setMode(id,v){state.items.find(x=>x.id===id).mode=v;invalidate();render()};function setNum(id,key,v){state.items.find(x=>x.id===id)[key]=Math.max(0,Math.trunc(Number(v)||0));invalidate();render()};
function confirmDry(){state.matchDry=!state.matchDry;state.checked=false;render()};function toggle(id){state.expanded[id]=!state.expanded[id];render()};function pick(id,k){state.choice[id]=k;state.manual[id]=true;state.checked=false;state.overageAccepted=false;render()};function resetChoices(){state.choice={};state.manual={};state.checked=false;state.overageAccepted=false;render()};function ackChecked(v){state.checked=v;render()};function ackOverages(v){state.overageAccepted=v;state.checked=false;render()};function saveTemplate(){if(!ready()){showModal('Нужно завершить проверку','Вернитесь на экран «Проверка» и подтвердите товары и итоговую заявку, прежде чем сохранять её как утверждённый шаблон.');return}if(!state.templateName.trim()){showModal('Введите название','Название шаблона не может быть пустым.');return}state.saved={title:state.templateName.trim(),items:state.items.map(x=>({...x})),choice:{...state.choice},matchDry:state.matchDry,cycle:state.cycle,date:new Date().toLocaleDateString('ru-RU')};state.savedTemplates.unshift({...state.saved});render()};function repeatOrder(){if(!state.saved)return;let idx=state.savedTemplates.findIndex(t=>t.date===state.saved.date&&t.title===state.saved.title);if(idx<0){state.savedTemplates.unshift({...state.saved});idx=0;}repeatFrom(idx)};async function copyMessage(k,btn){const msg=supplierMessages().find(s=>s.k===k)?.msg;if(!msg)return;try{await navigator.clipboard.writeText(msg);let old=btn.textContent;btn.textContent='✓ Скопировано';setTimeout(()=>{btn.textContent=old},1800)}catch(e){let t=document.createElement('textarea');t.value=msg;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=document.execCommand('copy');t.remove();if(ok){btn.textContent='✓ Скопировано';setTimeout(()=>btn.textContent='⧉ Скопировать сообщение',1800)}else showModal('Не удалось скопировать','Браузер ограничил работу буфера обмена в локальном файле. Выделите текст сообщения вручную и скопируйте.')}}
el('back').onclick=()=>go(state.step-1);el('next').onclick=()=>{if(state.step===-1){startDemo();return}if(state.step===-2){home();return}if(state.step===7){home();return}if(state.step===5&&!ready()){go(4);return}if(state.step===6&&!state.saved){showModal('Сначала сохраните шаблон','После успешной проверки закупки нажмите «Сохранить шаблон в этом браузере».');return}go(state.step+1)};render();
</script></body></html>
