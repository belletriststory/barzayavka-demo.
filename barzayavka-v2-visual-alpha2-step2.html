.back-dock-indicator{font-size:9px;color:#42986e}
.back-dock-speech{pointer-events:auto;width:min(300px,calc(100vw - 32px));display:flex;flex-direction:column;gap:5px;line-height:1.38;margin-bottom:8px;background:#fff;color:#243a32;padding:12px 15px;border-radius:16px;border:1px solid #cfe1d2;box-shadow:0 10px 32px #2c47342b;font-size:13px}
.back-dock-speech strong{font-size:15px;color:#1d5d45}
.back-message-question .back-sprite-wrap:after{content:'?';position:absolute;top:-9px;right:-9px;width:23px;height:23px;background:#f1cb72;color:#394b36;border:2px solid #fff;display:grid;place-items:center;border-radius:7px;font-weight:900;font-size:15px}
.back-message-thinking .back-sprite{animation:back-think 2.6s steps(3,end) infinite}
.back-message-care .back-sprite{animation:back-care 2.8s steps(3,end) infinite}
@keyframes back-think{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@keyframes back-care{0%,100%{transform:translateX(0)}40%,60%{transform:translateX(-2px)}}
@media(max-width:550px){
 .shell{padding:0 14px calc(132px + env(safe-area-inset-bottom))}
 .back-experiment-descriptor{display:none}.back-experiment-switch{justify-content:center;border:0;background:transparent;box-shadow:none;padding:2px 0;margin:0 0 10px}
 .back-mode-group{width:100%;justify-content:center}.back-mode-option{flex:1;min-height:42px;font-size:13px}
 .with-back .back-message{margin:3px 0 17px;padding:10px 11px;gap:11px}
 .with-back .back-heading{font-size:17px}.with-back .back-dialog p{font-size:12px}
 .back-dock{bottom:calc(104px + env(safe-area-inset-bottom));left:12px}
 .back-dock-button{min-height:53px;padding:4px 9px 4px 4px}
 .back-dock-button img{width:45px;height:45px}
 .back-reward{bottom:calc(172px + env(safe-area-inset-bottom));max-width:calc(100vw - 30px)}
}
@media(max-width:355px){.with-back .back-message{gap:9px}.with-back .back-sprite-wrap{width:57px;height:57px}.with-back .back-sprite{width:54px;height:54px}.with-back .back-heading{font-size:15px}}
@media(prefers-reduced-motion:reduce){.back-message-thinking .back-sprite,.back-message-care .back-sprite{animation:none!important}}

/* VISUAL MVP ALPHA: real isolated Higgsfield assets. UI controls remain semantic HTML. */
:root{--bg:#F5F2E9;--paper:#FFFDF7;--ink:#24312A;--muted:#6A7D73;--line:#DFE7DF;--accent:#075B43;--accent-hover:#064735;--soft:#E9F2EA;--warm:#FFF3DF;--shadow:0 7px 24px rgba(21,49,34,.065);background:#F5F2E9}
body{background:linear-gradient(180deg,#F4F2EA,#F8F7F2)}
.shell{max-width:850px;padding:0 18px calc(115px + env(safe-area-inset-bottom))}
main{max-width:720px}
.topbar{height:60px}
.brand{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:20px;font-weight:950;letter-spacing:-1.25px;color:#103F30;gap:8px}
.brand-symbol{font:21px/1 monospace;width:29px;height:29px;border-radius:7px;background:#114C37;color:#E7AF55}
.alpha{font-size:9px;letter-spacing:.4px;color:#527363;border:1px solid #D9E3D9;padding:7px 7px;background:#EAF2E9}
.demo-banner{margin:2px 0 10px;background:#F0F1E8;border:0;border-left:3px solid #DDA952;border-radius:6px;color:#506255;padding:5px 9px;min-height:27px}
.demo-banner strong{font-size:10px;color:#587064;font-weight:650}
.back-experiment-switch{border:0;background:transparent;box-shadow:none;margin:0 0 10px;padding:0;justify-content:flex-end}
.back-mode-group{background:#E6ECE5;border:1px solid #DCE5DE}
.back-mode-option[aria-pressed=true]{box-shadow:0 2px 6px #062D1915;background:#FFFDF7;color:#095B40}
.card{background:#FFFDF9;border-color:var(--line);border-radius:20px}
.btn{border-radius:12px;min-height:48px}
.btn-primary{background:linear-gradient(105deg,#075C44,#0A8060);box-shadow:0 5px 15px rgba(4,95,63,.13)}
.btn-primary:hover{background:#054D39}
.offer,.field,textarea,select{border-radius:13px}
.offer-title{color:#1B4739;font-weight:750}
.metric{font-size:clamp(37px,9vw,48px);color:#102F25;letter-spacing:-1.5px}
.eyebrow{color:#19684F}

.with-back .bar-hero{display:block}
.bar-hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,26,20,.65) 0%,rgba(3,26,20,.27) 42%,rgba(3,26,20,.06) 80%);pointer-events:none}
.bar-hero-sign{position:absolute;left:13px;top:12px;font:900 21px/1.2 ui-monospace,'SFMono-Regular',monospace;letter-spacing:-1.4px;color:#FFF0D6;text-shadow:3px 3px #102B20,0 0 14px rgba(0,0,0,.7);z-index:3}
.bar-sparkle{color:#EFB85C;margin-left:5px}
.bar-hero-sub{position:absolute;left:14px;top:39px;font-size:8px;letter-spacing:.8px;color:#F6DCAF;text-shadow:0 1px 3px #000;z-index:3}
.bar-hero-bek{position:absolute;width:172px;height:172px;object-fit:contain;image-rendering:pixelated;bottom:0;left:11%;z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.38));animation:back-breathe 3.8s steps(3,end) infinite}
.bar-hero-speech{position:absolute;z-index:4;right:12px;top:72px;width:49%;max-width:240px;background:#FFFDF5;color:#173B2E;border-radius:12px;padding:12px 10px;font-size:13px;line-height:1.45;box-shadow:0 7px 23px rgba(0,0,0,.23);margin:0}
.bar-hero-speech:after{content:'';position:absolute;left:-10px;top:25px;border-right:11px solid #FFFDF5;border-top:10px solid transparent;border-bottom:10px solid transparent}
.bar-hero-speech strong{font-weight:800}
.home-quiet{padding:20px 4px 8px}
.with-back .home-quiet{display:none}
.home-quiet h1{font-size:36px;margin:0 0 8px}
.home-request{margin:0 0 11px;padding:20px;border:1px solid #E1E9E0;box-shadow:0 6px 22px rgba(20,60,39,.055)}
.home-request-heading{align-items:center;margin:0 0 12px}
.home-request h2{font-size:21px;letter-spacing:-.6px;margin:0}
.home-stock-link{background:none;color:#14674F;border:0;font-weight:750;font-size:12px;padding:7px 0;white-space:nowrap}
.home-request textarea{min-height:112px;height:112px;max-height:240px;resize:vertical;background:#FCFDF8;margin:0 0 12px;font-size:16px;line-height:1.6}
.home-request textarea::placeholder{color:#95A69A}
.home-request .btn-primary{width:100%;font-size:16px}
.home-subrow{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 0;gap:12px;color:#557365;font-size:11px;font-weight:700}
.home-subrow button{font-size:11px;font-weight:800;white-space:nowrap}
.home-repeat{display:flex;align-items:center;justify-content:space-between;gap:15px;border-radius:12px;background:#E8F1E8;padding:10px 13px;color:#315847;font-size:12px}
.home-repeat .btn{flex:0 0 auto}
.home-caution{color:#8B9A8C;font-size:10px;text-align:center;margin:7px 0 15px}
/* Back character is richer but compact enough to leave room for choices. */
.with-back .back-message{background:linear-gradient(125deg,#123D2F,#235D48);border:1px solid #28674E;color:white;min-height:111px;padding:12px 14px;box-shadow:0 6px 21px #0A493018;margin-bottom:17px}
.with-back .back-message-care{background:linear-gradient(120deg,#725128,#9D733D);border-color:#D3A25C}
.with-back .back-message-success{background:linear-gradient(125deg,#104535,#1B7552)}
.with-back .back-message .back-sprite-wrap{background:transparent;border:0;box-shadow:none;width:90px;height:90px}
.with-back .back-message .back-sprite{width:89px;height:89px}
.with-back .back-message .back-heading{font-size:18px;color:#FFF2D8}
.with-back .back-message .back-name,.with-back .back-message .back-name span,.with-back .back-message p{color:#E3EEE6}
.with-back .back-message .back-name{font-weight:900}
.with-back .back-question-host{margin-top:0}
.with-back .result-heading{display:none}
.back-dock-button{background:#EAF3E8;border:2px solid #A6C9AB;box-shadow:0 5px 17px #12382834;color:#144735}
.back-dock-speech{border-radius:12px;border-color:#CBDFCC}
.back-reward{background:#14523C}
/* Readable business data, warm accents used only for important events. */
.offer-choice{background:#FFFDF9;border-color:#DDE5DC}
.offer-choice:hover,.offer-choice:focus-visible{background:#F3FAF3}
.note{background:#EFF5EE;border-color:#DFE7DB}
.pill-warn,.warm{background:#FFF2DC;border-color:#F2D7A9}
.footer{color:#86988A;border-color:#E3E9E0;font-size:10px}
@media(max-width:550px){
 .shell{padding:0 13px calc(132px + env(safe-area-inset-bottom))}
 .topbar{height:57px}
 .brand{font-size:18px;letter-spacing:-1px}
 .alpha{font-size:8px}
 .back-experiment-switch{margin:0 0 8px}
 .back-mode-group{width:100%;}
 .bar-hero{height:181px;margin:1px 0 9px;border-radius:16px}
 .bar-hero-sign{font-size:18px;left:11px;top:12px}
 .bar-hero-sub{font-size:7px;top:36px;left:11px}
 .bar-hero-bek{height:160px;width:160px;left:4%;bottom:-2px}
 .bar-hero-speech{font-size:12px;right:9px;top:75px;padding:9px 8px;width:49%}
 .home-request{padding:15px 14px;margin:0 0 10px}
 .home-request h2{font-size:19px}
 .home-stock-link{font-size:11px}
 .home-request textarea{height:110px;min-height:110px}
 .with-back .back-message{padding:11px 12px;min-height:102px;gap:10px}
 .with-back .back-message .back-sprite-wrap{width:71px;height:71px}
 .with-back .back-message .back-sprite{width:70px;height:70px}
 .with-back .back-message .back-heading{font-size:16px}
 .demo-banner{margin-bottom:7px}
}
@media(max-width:345px){.bar-hero-speech{font-size:11px;width:49%}.bar-hero-bek{left:-4%}.home-stock-link{font-size:10px}.home-request h2{font-size:18px}.brand{font-size:16px}}
@media(prefers-reduced-motion:reduce){.bar-hero-bek{animation:none!important}}

/* VISUAL ALPHA 2 LOCK: only character staging; preserve original MVP layout. */
.bar-hero{isolation:isolate}
.bar-hero-bek{left:22%;bottom:-12px;width:185px;height:185px;z-index:2;transform-origin:50% 90%;animation:back-breathe 3.8s steps(3,end) infinite}
.bar-hero-foreground{position:absolute;inset:0;z-index:3;pointer-events:none;background-position:center center;background-size:cover;background-repeat:no-repeat}
.bar-hero-cat{position:absolute;z-index:4;bottom:13%;right:12%;width:84px;height:84px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));animation:cat-breathe 3.8s steps(2,end) infinite;pointer-events:none}
.bar-hero-sign,.bar-hero-sub{z-index:6}
.bar-hero-speech{z-index:7}
@keyframes cat-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
@media(max-width:430px){
 .bar-hero-bek{left:17%;width:172px;height:172px;bottom:-8px}
 .bar-hero-cat{right:11%;bottom:10%;height:72px;width:72px}
}
@media(max-width:350px){.bar-hero-bek{left:12%;width:160px;height:160px}.bar-hero-speech{right:9px;width:47%;font-size:12px;padding:9px 8px}}
@media(prefers-reduced-motion:reduce){.bar-hero-bek,.bar-hero-cat{animation:none!important}}
/* ALPHA2 phone scene placement: keep cat visible below speech. */
@media(max-width:430px){.bar-hero-speech{top:34px}.bar-hero-cat{right:1%;bottom:-5%;width:83px;height:83px}}
@media(min-width:431px){.bar-hero-speech{top:48px}.bar-hero-cat{right:4%;bottom:-5%;width:90px;height:90px}}

/* Step 2 approved adjustments: canonical cat remains embedded in background. */
.bar-hero .bar-hero-bek{bottom:-29px!important}
@media(max-width:430px){.bar-hero .bar-hero-bek{bottom:-26px!important}}
@media(max-width:350px){.bar-hero .bar-hero-bek{bottom:-25px!important}}
/* Scoped to the prices screen: leave first-screen layout exactly as the visual alpha. */
.bz-import-card .field, .bz-catalog .field{font-size:15px}
.bz-colgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px}
.bz-colgrid .field-label{font-size:12px}
.bz-import-card .field-label{margin-top:12px}
.bz-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.bz-preview{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:14px}
.bz-supplier,.bz-offer{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:11px 0;overflow-wrap:anywhere}
.bz-offer{display:flex;flex-direction:column;gap:4px}
.bz-offer small,.bz-supplier span{color:var(--muted);font-size:12px}
.bz-catalog .field{margin-bottom:12px}
#bz-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.bz-upload{cursor:pointer}
.bz-upload:focus-within{outline:2px solid var(--accent)}
.bz-clarify{border-left:4px solid #D5B878;background:#FFF9EB}
.bz-import-card .field,.bz-import-card select{min-width:0}
@media(max-width:350px){.bz-colgrid{grid-template-columns:1fr}}
</style>

function csvRows(text,del,limit=5030){
 let rows=[],row=[],cell='',quoted=false;const input=String(text||'').replace(/^\uFEFF/,'');
 for(let i=0;i<input.length;i++){
  let c=input[i];
  if(quoted){if(c==='"'&&input[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}
  else if(c==='"')quoted=true;
  else if(c===del){row.push(cell);cell='';}
  else if(c==='\r'||c==='\n'){
   if(c==='\r'&&input[i+1]==='\n')i++;

   if(rows.length>=limit)return rows;

}
function detectCSVDelimiter(text){

  const widths=rows.map(r=>r.length);
  const withColumns=widths.filter(n=>n>=2);
  if(!withColumns.length)return {del,score:-100};
  const histogram=new Map;for(const n of widths){histogram.set(n,(histogram.get(n)||0)+1)}

  let header=0;
  for(const row of rows.slice(0,12)){
   const labels=row.map(v=>norm(v));
   const hasName=labels.some(v=>/^(наимен|назван|товар|позиция|product|name)/.test(v));
   const hasPrice=labels.some(v=>/^(цена|стоим|price|закупочн)/.test(v)||v.includes('цена со скидкой'));
   if(hasName&&hasPrice)header=Math.max(header,20);
   else if(hasName||hasPrice)header=Math.max(header,7);

  const consistency=count/rows.length;

}

function detectVariant(name){
 const v=norm(name);
 if(v.includes('bols')||v.includes('болс')){
  if(v.includes('triple sec')||v.includes('трипл сек'))return 'bols-triple-sec';
  if(v.includes('dry orange')||v.includes('драй оранж'))return 'bols-dry-orange';
 }
 return '';
}
async function parseFile(file){
 if(!/\.(csv|xlsx)$/i.test(file.name))throw Error('Нужен CSV или XLSX');
 if(file.size>LIMIT)throw Error('Файл больше 8 МБ');
 const bytes=await file.arrayBuffer();
 let sheets={};
 if(/\.csv$/i.test(file.name))sheets.CSV=bzCSV(decodeCSVBuffer(bytes));
 else sheets=await bzXLSX(bytes);
 const key=Object.keys(sheets).find(k=>sheets[k].length>0);
 if(!key)throw Error('Нет непустых листов');
 const rows=sheets[key];
 const mapped=autoMap(rows);
 return {file,sheets,sheet:key,supplier:file.name.replace(/\.(csv|xlsx)$/i,'').replace(/[_-]+/g,' ').trim(),header:mapped.header,cols:mapped.cols,mode:mapped.mode,rows};
}
function setSheet(name){if(!draft||!draft.sheets[name])return;draft.sheet=name;draft.rows=draft.sheets[name];const x=autoMap(draft.rows);draft.header=x.header;draft.cols=x.cols;draft.mode=x.mode}
function parseOffers(d){
 const c=d.cols;const accepted=[],ignored=[];
 if(c.name<0||(c.price<0&&c.final<0))return {accepted,ignored:['Выбери столбцы «Наименование» и «Цена»'],fatal:true};
 if(d.mode==='box'&&c.pack<0)return {accepted,ignored:['Для цены за коробку необходим столбец размера коробки'],fatal:true};
 for(let i=d.header+1;i<d.rows.length;i++){
  const row=d.rows[i]||[],name=String(row[c.name]??'').trim(),priceText=(c.final>=0&&String(row[c.final]??'').trim())?row[c.final]:row[c.price];
  if(!name&&row.every(x=>!String(x??'').trim()))continue;
  const price=nval(priceText),pack=c.pack>=0?nval(row[c.pack]):1,minimum=c.min>=0?nval(row[c.min]):1,multiple=c.multiple>=0?nval(row[c.multiple]):1;
  if(!name||!Number.isFinite(price)||price<=0||price>1e9){ignored.push('Строка '+(i+1)+': нет наименования или положительной цены');continue;}
  if(!Number.isInteger(pack)||pack<1||pack>100000||!Number.isInteger(minimum)||minimum<1||!Number.isInteger(multiple)||multiple<1){ignored.push('Строка '+(i+1)+': неверная упаковка, минимум или кратность');continue;}
  if(d.mode==='box'&&pack<=1){ignored.push('Строка '+(i+1)+': не указан размер коробки больше 1');continue;}
  const priceKop=Math.round(price*100),perUnitKop=Math.round(priceKop/(d.mode==='box'?pack:1));
  accepted.push({name:name.slice(0,400),normalizedName:norm(name),variant:detectVariant(name),volume:c.volume>=0?String(row[c.volume]??'').slice(0,80):'',unit:'шт.',priceKop,perUnitKop,mode:d.mode,pack,min:minimum,multiple,sourceRow:i+1});
 }
 return {accepted,ignored,fatal:false};
}
async function loadNextFile(){
 if(draft||!queue.length)return;
 const f=queue.shift();
 try{draft=await parseFile(f);status='Проверь столбцы и условия, затем подтверди импорт';}
 catch(e){status='Не удалось прочитать «'+f.name+'»: '+e.message;draft=null;}
 rerender();
}
async function commit(){
 if(!draft)return;
 const d=draft,supplierName=d.supplier.trim().slice(0,100),parsed=parseOffers(d);
 if(!supplierName){status='Укажи название поставщика';rerender();return}
 if(parsed.fatal||!parsed.accepted.length){status=(parsed.ignored[0]||'Не найдено предложений')+' — импорт не выполнен';rerender();return}
 const next=structuredClone(catalog),nameKey=norm(supplierName);
 let supplier=next.suppliers.find(x=>norm(x.name)===nameKey);
 if(!supplier){supplier={id:id(),name:supplierName,createdAt:new Date().toISOString()};next.suppliers.push(supplier)}
 const now=new Date().toISOString(),sourceId=id();
 const map=new Map(next.offers.map((o,i)=>[o.supplierId+'|'+norm(o.name)+'|'+norm(o.volume)+'|'+o.mode+'|'+o.pack,i]));
 let added=0,updated=0;
 for(const o of parsed.accepted){
  o.supplierId=supplier.id;o.sourceFile=d.file.name;o.importedAt=now;o.sourceId=sourceId;
  const key=o.supplierId+'|'+norm(o.name)+'|'+norm(o.volume)+'|'+o.mode+'|'+o.pack;
  if(map.has(key)){const j=map.get(key);o.id=next.offers[j].id;next.offers[j]=o;updated++}
  else{o.id=id();map.set(key,next.offers.length);next.offers.push(o);added++}
 }
 next.imports.push({id:sourceId,file:d.file.name,supplierId:supplier.id,at:now,count:parsed.accepted.length,skipped:parsed.ignored.length,bytes:d.file.size});
 try{await writeCatalog(next,d.file,sourceId);catalog=next;status='Сохранено: '+added+' новых, '+updated+' обновлено. Пропущено строк: '+parsed.ignored.length+'.';draft=null;rerender();loadNextFile();}
 catch(e){status='Не удалось сохранить прайс: '+e.message;rerender()}
}
async function clearCatalog(){
 if(!confirm('Удалить все сохранённые реальные прайсы, предложения и исходные файлы с этого устройства?'))return;
 const db=await openDB();
 try{await new Promise((res,rej)=>{const tx=db.transaction(['meta','raw'],'readwrite');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.objectStore('meta').delete('catalog');tx.objectStore('raw').clear()})}
 finally{db.close()}
 catalog={version:1,suppliers:[],offers:[],imports:[]};status='Каталог очищен';search='';rerender();
}
function xsel(name,values,current){return '<select data-bz-field="'+esc(name)+'" class="field" aria-label="'+esc(name)+'">'+values.map(x=>'<option value="'+esc(x.value)+'"'+(String(current)===String(x.value)?' selected':'')+'>'+esc(x.label)+'</option>').join('')+'</select>'}
function renderDraft(){

 const d=draft,rows=d.rows,cs=d.cols,colsCount=Math.min(30,Math.max(...rows.slice(0,20).map(x=>x.length),1));
 const heads=Array.from({length:colsCount},(_,i)=>({value:i,label:(i+1)+'. '+String((rows[d.header]||[])[i]??'Столбец '+(i+1)).slice(0,65)}));
 const base=[{value:-1,label:'— Нет столбца —'}].concat(heads);
 const parsed=parseOffers(d);
 const preview=parsed.accepted.slice(0,5).map(o=>'<div class="bz-offer"><strong>'+esc(o.name)+'</strong><small>'+esc(cur(o.perUnitKop))+'/ед. · минимум '+o.min+'</small></div>').join('');

 return '<section class="card bz-import-card"><p class="eyebrow">ПРОВЕРКА ИМПОРТА</p><h3>'+esc(d.file.name)+'</h3>'+

 '<label class="field-label">Строка заголовков (начиная с 1)</label><input class="field" type="number" min="1" max="'+rows.length+'" data-bz-field="header" value="'+(d.header+1)+'">'+
 '<div class="bz-colgrid">'+options.map(([key,label])=>'<div><label class="field-label">'+label+'</label>'+xsel(key,base,cs[key])+'</div>').join('')+'</div>'+
 '<label class="field-label">Цена в прайсе</label>'+xsel('mode',[{value:'unit',label:'За единицу'},{value:'box',label:'За коробку (нужна ёмкость коробки)'}],d.mode)+
 '<div class="bz-preview"><b>Распознано '+parsed.accepted.length+' предложений</b><p class="tiny">Пропущено / требует исправления: '+parsed.ignored.length+'. '+esc(parsed.ignored[0]||'')+'</p>'+preview+'</div>'+
 '<div class="bz-actions"><button class="btn btn-primary" data-bz-act="commit"'+(!parsed.accepted.length||parsed.fatal?' disabled':'')+'>Добавить в каталог</button>'+
 '<button class="btn btn-outline" data-bz-act="cancel">Отменить</button></div></section>';
}
function renderList(){
 if(!ready)return '<p class="muted">Загружаем сохранённые данные…</p>';
 if(loadError)return '<div class="card warm">Хранилище недоступно: '+esc(loadError)+'</div>';
 const names=catalog.suppliers.map(s=>'<div class="bz-supplier"><b>'+esc(s.name)+'</b><span>'+catalog.offers.filter(o=>o.supplierId===s.id).length+' предложений</span></div>').join('');
 const q=norm(search),offs=catalog.offers.filter(o=>!q||norm(o.name).includes(q)||norm(catalog.suppliers.find(s=>s.id===o.supplierId)?.name).includes(q));
 const rows=offs.slice(0,20).map(o=>'<div class="bz-offer"><b>'+esc(o.name)+'</b><small>'+esc(catalog.suppliers.find(s=>s.id===o.supplierId)?.name||'')+' · '+esc(cur(o.perUnitKop))+'/ед.'+(o.mode==='box'?' · '+esc(cur(o.priceKop))+'/кор. ×'+o.pack:'')+' · мин. '+o.min+'</small></div>').join('');
 return '<div class="card bz-catalog"><p class="eyebrow">РАБОЧИЙ КАТАЛОГ · ЛОКАЛЬНО</p><h3>'+catalog.suppliers.length+' поставщиков · '+catalog.offers.length+' предложений</h3>'+
 (names||'<p class="muted">Пока нет прайсов. Загрузите свой CSV или XLSX.</p>')+
 (catalog.offers.length?'<label class="field-label">Поиск по предложениям</label><input class="field" placeholder="Название или поставщик" id="bz-search" value="'+esc(search)+'">'+
 '<div><button type="button" class="btn btn-outline btn-small" data-bz-act="search">Найти</button></div><p class="tiny">Найдено: '+offs.length+' · показаны первые '+Math.min(20,offs.length)+'</p>'+rows+'<div class="bz-actions"><button type="button" class="btn btn-outline btn-small" data-bz-act="clear">Удалить сохранённые прайсы</button></div>':'')+'</div>';
}
function viewSources(){
 return '<p class="eyebrow">ПРАЙСЫ ПОСТАВЩИКОВ</p><h2>Загрузить прайс</h2>'+
 '<p class="muted">CSV или XLSX. Проверим колонки, цены и упаковки, затем сохраним предложения в каталог.</p>'+
 '<div class="card"><label class="btn btn-primary btn-wide bz-upload" for="bz-file">Выбрать файлы CSV/XLSX</label>'+
 '<input id="bz-file" type="file" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple>'+
 '<p class="tiny">До 8 МБ на файл · до 5030 строк на лист. Файлы и каталог остаются на устройстве.</p>'+

 renderDraft()+renderList()+
 '<div class="card bz-clarify"><b>Важно</b><p class="muted">Загруженные реальные прайсы пока НЕ подключены к расчёту заявки. На следующем этапе добавим каталог и безопасное сопоставление. Учебные цены отдельно.</p></div>';
}
const has=()=>catalog.offers.length>0;
const stats=()=>({suppliers:catalog.suppliers.length,offers:catalog.offers.length,imports:catalog.imports.length,ready});
const sourceStatus=()=>has()?'● '+catalog.offers.length+' реальных предложений от '+catalog.suppliers.length+' поставщиков':'○ Прайсы ещё не загружены';
function rerender(){window.dispatchEvent(new Event('bz:catalogready'))}
document.addEventListener('change',async e=>{
 if(e.target?.id==='bz-file'){
  queue.push(...Array.from(e.target.files||[]));e.target.value='';await loadNextFile();return
 }
 const key=e.target?.dataset?.bzField;if(!key||!draft)return;
 if(key==='sheet')setSheet(e.target.value);
 else if(key==='header'){draft.header=Math.max(0,Math.min(draft.rows.length-1,Number(e.target.value)-1));const m=autoMap([draft.rows[draft.header]]);draft.cols=m.cols;draft.mode=m.mode}
 else if(key==='mode')draft.mode=e.target.value;
 else if(key==='supplier'){draft.supplier=e.target.value;return;}
 else if(key in draft.cols)draft.cols[key]=Number(e.target.value);
 rerender();
});
document.addEventListener('input',e=>{
 if(e.target?.dataset?.bzField==='supplier'&&draft)draft.supplier=e.target.value;
 if(e.target?.id==='bz-search'){const pos=e.target.selectionStart;search=e.target.value;/* Do not rerender on every keystroke: preserve caret. */ }
});
document.addEventListener('keydown',e=>{
 if(e.target?.id==='bz-search'&&e.key==='Enter'){e.preventDefault();rerender()}
});
document.addEventListener('click',e=>{
 if(e.target?.id==='bz-search-apply'){rerender();return}
 const btn=e.target.closest('[data-bz-act]');if(!btn)return;
 if(btn.dataset.bzAct==='commit')commit();
 if(btn.dataset.bzAct==='search')rerender();
 if(btn.dataset.bzAct==='clear')clearCatalog().catch(e=>{status='Ошибка очистки: '+e.message;rerender()});
 if(btn.dataset.bzAct==='cancel'){draft=null;status='Импорт отменён';rerender();loadNextFile()}
});
window.BZ_STEP2={viewSources,stats,has,sourceStatus,ready:()=>ready};
readCatalog().then(()=>{ready=true;rerender()}).catch(e=>{ready=true;loadError=e.message;rerender()});
})();

<script>

(() => {
 'use strict';
 const D=window.BAR_DEMO, KEY='barzayavka-visual-mvp-alpha-v1';
 const $=id=>document.getElementById(id);
 const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 const qty=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
 const plural=(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?many:b===1?one:b>=2&&b<=4?few:many;};
 const base={view:'home',mode:'list',demoSources:true,text:'',inventory:{},choices:{},brandChoices:{},surplus:{},excluded:{},acknowledgedMissing:{},editItemId:null,draftInput:'',flowTotal:0,history:[],draftInput:'',delivery:{date:'',window:'',address:'',comment:'',includePrices:false},showPrices:false};
 let state;
 try {state={...base,...JSON.parse(localStorage.getItem(KEY)||'{}')};}catch(e){state={...base};}
 state.delivery={...base.delivery,...state.delivery};
 state.inventory=state.inventory||{};state.choices=state.choices||{};state.brandChoices=state.brandChoices||{};state.surplus=state.surplus||{};state.excluded=state.excluded||{};state.acknowledgedMissing=state.acknowledgedMissing||{};state.history=Array.isArray(state.history)?state.history.slice(0,12):[];
 const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};
 let toastTimer=null;
 function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3100);}

 function nav(view){state.view=view;persist();render();window.scrollTo({top:0,behavior:'auto'});}
 function getSupplier(id){return D.sources.find(s=>s.id===id)?.name||'Учебный поставщик';}
 const normalize=s=>String(s??'').toLowerCase().replaceAll('ё','е').replaceAll('—','-').replaceAll('–','-');
 function detectCategory(name){const t=normalize(name);
   if(/русск.*стандарт|russian standard/.test(t))return 'absent';
   if(/шато\s*таман|chateau\s*taman/.test(t))return 'chateau';
   if(/золот.*балк/.test(t))return 'gold';
   // Open category intent: known wine descriptors only. An extra unknown brand
   // prevents substituting a different trademark without permission.
   const categoryTokens=new Set(['вино','вина','вин','игристое','игристого','игристые','игристых','игристый','шампанское','шампанского','шампанские','брют','сухое','сухого','полусухое','белое','белого','белый','белые','за','до','от','рублей','рубля','рубль','руб','р','бут','бутылок','бутылки','бутылка','бутылку','бутылке','б','л','литр','литров','литра','цена','по','в','диапазоне','цене','примерно','около','минимальное','минимальной','минимальную','минимум','самое','самый','самую','дешевое','дешевого','дешевле','недорого','выгодное','подешевле','стоимости','заказать','розовое','красное','десертное','полусладкое']);
   const categoryOnly=(t.match(/[а-яa-z]+/g)||[]).every(w=>categoryTokens.has(w));
   if(categoryOnly && /(игрист|шампан|брют)/.test(t))return 'sparklingwine';
   // Категорийный запрос допустим только без названного неизвестного бренда.

 function parseLine(line,index){
   const raw=line.trim();if(!raw)return null;

   // Не используем \b: JS не считает кириллические буквы частью слова.
   const unitPattern=/(\d+(?:[.,]\d+)?)\s*(бут(?:ыл(?:ок|ки|ка|ку)?)?\.?|б(?=$|[\s.,;])|л(?:итр(?:ов|а|ы)?)?\.?|шт(?:ук(?:и|а)?)?\.?|штук|уп(?:ак(?:ов(?:ок|ки|ка))?)?\.?|кг)(?=$|[\s,;:!?()\-–—])/gi;
   const all=[...normalize(raw).matchAll(unitPattern)];
   let n,unit,name;
   if(all.length){
     // «6 бутылок по 0,75 л» = 6 бутылок, где 0,75 л — фасовка.
     let last=all[all.length-1];
     if(all.length>1 && /^л/.test(last[2]) && /по\s*$/.test(normalize(raw).slice(0,last.index))){last=all[all.length-2];}
     n=Number(last[1].replace(',','.'));
     unit=/^(?:бут|б$)/.test(last[2])?'bottle':/^(?:шт|штук)/.test(last[2])?'piece':/^уп/.test(last[2])?'pack':/^кг/.test(last[2])?'kg':'liter';
     name=raw.slice(0,last.index).replace(/[\s\-–—:,;]+$/,'').trim();
   }else{
     const tail=normalize(raw).match(/(?:^|[\s:;\-–—])(\d+(?:[.,]\d+)?)\s*$/);
     if(!tail)return {id:index,raw,name:raw,needsQuantity:true,invalid:'Не указано количество'};
     n=Number(tail[1].replace(',','.'));
     name=raw.slice(0,raw.length-tail[1].length).replace(/[\s\-–—:,;]+$/,'').trim();
     if(n<1) return {id:index,raw,name,needsQuantity:true,invalid:'Неясно, это фасовка или количество'};
   }
   if(!name)return {id:index,raw,name:raw,needsQuantity:true,invalid:'Не указано название товара'};
   if(!Number.isFinite(n)||n<=0)return {id:index,raw,name,needsQuantity:true,invalid:'Нужно положительное количество'};
   const category=detectCategory(name),text=normalize(name),fullText=normalize(raw);
   const volumes=[...fullText.matchAll(/(?:^|[\s(])(0[.,](?:2|5|7|75)|1[.,]0)\s*(?:л)?(?=$|[\s.,;)])/g)];
   const requestedVolume=volumes.length?Number(volumes[volumes.length-1][1].replace(',','.')):null;
   let type=null;
   if(/полуслад/.test(text))type='semisweet';else if(/игрист|брют|brut/.test(text))type='sparkling';else if(/(?:^|\s)сух/.test(text))type='dry';

 }
 function sourceLines(){
   if(state.mode==='list') return state.text.split(/[\n;]+/).map(s=>s.trim()).filter(Boolean).map((s,i)=>parseLine(s,i));
   const items=[];D.inventory.forEach((it,i)=>{
      const rec=state.inventory[it.id]||{};
      if(rec.skip)return;
      if(rec.current===''||rec.current==null){items.push({id:i,raw:it.label,name:it.label,missingStock:true});return;}
      const current=Number(rec.current),inTransit=Number(rec.inTransit||0);
      if(!Number.isFinite(current)||current<0||!Number.isFinite(inTransit)||inTransit<0){items.push({id:i,raw:it.label,name:it.label,invalid:'Остаток и товар в пути должны быть числами от нуля'});return;}
      const n=Math.max(0,it.target-current-inTransit);
      if(n>0){items.push(parseLine(`${it.request} — ${qty(n)} ${it.unit}`,i));}
   });
   return items;
 }
 function selectPool(item){const offers=D.offers.filter(o=>item.category==='whitewine' ? o.category==='chateau' : item.category==='sparklingwine'?o.type==='sparkling':o.category===item.category)
   .filter(o=>item.priceMin==null || (o.price>=item.priceMin && o.price<=item.priceMax));
   if((item.category==='chateau'||item.category==='whitewine') && item.type)return offers.filter(o=>o.type===item.type);
   if(item.category==='sparklingwine'&&item.requestedVolume)return offers.filter(o=>o.volume===item.requestedVolume);
   if(item.category==='gold'&&item.requestedVolume)return offers.filter(o=>o.volume===item.requestedVolume);
   if(item.category==='vodka'&&item.brand)return offers.filter(o=>o.brand===item.brand);
   return offers;
 }
 function groupsForItem(item){const pool=selectPool(item);const groups=new Map();
   for(const o of pool){const k=item.category==='sparklingwine'?String(o.volume):(item.category==='chateau'||item.category==='whitewine')?o.type:item.category==='gold'?String(o.volume):item.category==='vodka'?`${o.brand}_${o.volume}`:o.category;
     if(!groups.has(k))groups.set(k,[]);groups.get(k).push(o);
   }
   return groups;
 }
 function requiredUnits(item,o){
   if(item.unit==='liter'){if(!o.volume || o.unit!=='bottle')return null;return Math.ceil((item.n-1e-9)/o.volume);}
   if(item.unit==='bottle'){if(o.unit!=='bottle')return null;return item.n;}
   if(item.unit==='piece' && o.category==='napkins')return Math.ceil(item.n/o.volume);
   if(item.unit==='piece' && o.unit==='bottle')return item.n;
   if(item.unit==='pack'&&o.unit==='pack')return item.n;
   return null;
 }
 function orderOffer(item,o){const needed=requiredUnits(item,o);if(needed==null)return null;
   const count=Math.max(o.min||1,Math.ceil(needed/(o.multiple||1))*(o.multiple||1));return {o,needed,count,cost:count*o.price,over:count>needed};
 }
 function getBestOffer(item,pool){const candidates=pool.map(o=>orderOffer(item,o)).filter(Boolean);
   return candidates.sort((a,b)=>a.cost-b.cost||a.count-b.count)[0]||null;
 }
 function scenario(){
   const lines=sourceLines(),ready=[],missing=[],questions=[];
   for(const item of lines){
     if(state.excluded[item.id]){missing.push({item,reason:'Оставлено без предложения'});continue;}
     if(item.missingStock){missing.push({item,reason:'Сегодняшний остаток не указан'});continue;}
     if(item.invalid && state.mode==='stock'){missing.push({item,reason:item.invalid});continue;}
     if(item.needsUnit){questions.push({kind:'unit',item});continue;}
     if(item.needsQuantity || item.invalid){questions.push({kind:'quantity',item});continue;}
     if(item.missingStock){missing.push({item,reason:'Сегодняшний остаток не указан'});continue;}
     const pool=selectPool(item);
     if(!pool.length){
       if(!state.acknowledgedMissing[item.id])questions.push({kind:'missing',item});
       else missing.push({item,reason:'Не найдено в учебных предложениях'});
       continue;
     }
     const groups=groupsForItem(item);
     let eligible=pool;
     if(groups.size>1){
       let choice=state.choices[item.id];
       if(!choice && item.cheap && item.category==='vodka'){const opts=[...groups.entries()].map(([k,v])=>({key:k,cost:getBestOffer(item,v)?.cost??Infinity})).sort((a,b)=>a.cost-b.cost);choice=opts[0]?.key;}
       if(!choice || !groups.has(choice)){questions.push({kind:'choice',item,groups});continue;}
       eligible=groups.get(choice);
     }
     if(item.category==='sparklingwine' && eligible.length>1 && !item.cheap){
       const brandChoice=state.brandChoices[item.id];
       if(!brandChoice||!eligible.some(o=>o.id===brandChoice)){
         questions.push({kind:'spark-brand',item,offers:eligible});continue;
       }
       eligible=eligible.filter(o=>o.id===brandChoice);
     }
     const selected=getBestOffer(item,eligible);
     if(!selected){
       if(!state.acknowledgedMissing[item.id])questions.push({kind:'missing',item,reason:'Не найден подходящий формат продажи'});
       else missing.push({item,reason:'Нет подходящей фасовки в учебных предложениях'});
       continue;
     }
     if(selected.over&&!state.surplus[item.id]){questions.push({kind:'surplus',item,selected});continue;}
     ready.push({item,...selected});
   }
   const suppliers=new Map();for(const r of ready){const k=r.o.supplier;if(!suppliers.has(k))suppliers.set(k,[]);suppliers.get(k).push(r);}
   return {lines,ready,missing,questions,total:ready.reduce((s,r)=>s+r.cost,0),suppliers};
 }

     const lead=q.item.category==='sparklingwine'?'Нашёл игристое разных фасовок. Сначала выбери объём бутылки, чтобы не сравнивать 0,2 и 0,75 л как одинаковый товар.':q.item.category==='whitewine'?`Есть белые вина в бюджете ${q.item.priceMin}–${q.item.priceMax} ₽ за бутылку. Выбери стиль.`:q.item.category==='vodka'?'Нашёл несколько марок. Выбери подходящую.':q.item.category==='gold'?'Нашёл бутылки разных объёмов. Это влияет на заказ.':'Нашёл несколько разновидностей. Выбери нужную.';

   }
   const {item,selected}=q,u=selected.o.unit==='bottle'?'бут.':'уп.';
   return `${info}<h2>Нужно заказать больше, чем указано</h2><p class="muted">Поставщик продаёт этот товар минимальной партией.</p>${source}<div class="card stack"><h3>${escape(selected.o.name)}</h3><div class="row"><span class="muted">Твоя потребность</span><strong>${qty(item.n)} ${item.unit==='liter'?'л':item.unit==='bottle'?'бут.':item.unit==='piece'?'шт.':'уп.'}</strong></div><div class="row"><span class="muted">У поставщика</span><strong>${qty(selected.count)} ${u}</strong></div><div class="row"><span class="muted">Итог</span><span class="metric-small">${rub(selected.cost)}</span></div><p class="tiny">Учебные условия. Превышение не подтверждаем без тебя.</p>${btn(`Заказать ${qty(selected.count)} ${u}`,'accept-'+item.id,'btn-primary btn-wide')}${btn('Изменить эту позицию','edit-'+item.id,'btn-outline btn-wide')}</div>${btn('Не включать этот товар','exclude-'+item.id,'btn-quiet btn-wide')}`;
 }

 function viewReview(){const calc=scenario();
   if(!state.demoSources) return `${stepBack('work')}<p class="eyebrow">Сначала источник</p><h2>Нужны предложения поставщиков</h2><p class="muted">Список сохранён. Чтобы проверить подбор на учебных данных, подключи демо-прайсы.</p>${btn('Подключить учебные прайсы','enableSources','btn-primary btn-wide')}`;
   if(!calc.lines.length)return `${stepBack('work')}<h2>Заявка пока пуста</h2>${btn('Вернуться к списку','work','btn-primary btn-wide')}`;
   if(state.editItemId!==null){const item=calc.lines.find(x=>x.id===state.editItemId);if(item)return `${stepBack('review')}${editMarkup(item)}`;state.editItemId=null;}
   if(calc.questions.length){state.flowTotal=Math.max(state.flowTotal||0,calc.questions.length);const index=Math.max(1,state.flowTotal-calc.questions.length+1);return `${stepBack('work')}<div class="helper-steps"><span>1. Потребность</span><span>→</span><b>2. Уточнения</b><span>→</span><span>3. Результат</span></div>${showQuestion(calc.questions[0],index,state.flowTotal)}<p class="tiny">Ответ сразу сохраняется и открывает следующий вопрос. Вернуться к списку можно в любой момент.</p>`;}
   return resultMarkup(calc);
 }
 function unitLabel(o,count){
   if(o.unit==='pack')return `${qty(count)} уп. × ${qty(o.volume)} шт.`;
   if(o.multiple>1&&count%o.multiple===0)return `${qty(count/o.multiple)} кор. × ${o.multiple} бут.`;
   return `${qty(count)} бут.`;
 }
 function resultMarkup(calc){
   const partial=calc.missing.length>0;
   let sourceCount=calc.lines.filter(x=>!x.missingStock&&!x.invalid).length;
   return `${stepBack('work')}<div class="helper-steps"><span>1. Потребность</span><span>→</span><span>2. Подбор</span><span>→</span><b>3. Результат</b></div><div class="result-heading"><p class="eyebrow">${partial?'Частично готово':'Готово к отправке'}</p><h2>${partial?'Часть позиций требует внимания':'Закупка готова'}</h2><p class="muted">Предварительный расчёт по учебным предложениям.</p></div>
   <div class="card"><p class="label-quiet">Общая стоимость</p><div class="metric">${rub(calc.total)}</div><p class="tiny">${calc.ready.length} ${plural(calc.ready.length,'позиция','позиции','позиций')} · ${calc.suppliers.size} ${plural(calc.suppliers.size,'поставщик','поставщика','поставщиков')}${partial?` · ${calc.missing.length} без предложения`:''}</p>${calc.ready.length?'':'<div class="note warm">Пока нет позиций, которые можно включить в заказ.</div>'}</div>
   ${partial?`<div class="card warm"><h3>Не включено в сообщения</h3>${calc.missing.map(x=>`<div class="product-line"><div class="name">${escape(x.item.raw)}</div><div class="detail">${escape(x.reason)}</div><button class="link-btn" data-action="edit-${x.item.id}">Исправить эту позицию →</button></div>`).join('')}<div class="space"></div>${btn('Изменить список','work','btn-outline btn-wide')}</div>`:''}
   ${[...calc.suppliers].map(([id,items])=>{const total=items.reduce((s,x)=>s+x.cost,0);return `<div class="card"><div class="row"><div><h3>${escape(getSupplier(id))}</h3><p class="tiny">${items.length} ${plural(items.length,'позиция','позиции','позиций')} · вымышленные цены</p></div><div class="metric-small">${rub(total)}</div></div><details><summary class="details-toggle">Посмотреть товары и расчёт ↓</summary>${items.map(x=>`<div class="product-line"><div class="row row-top"><div class="name">${escape(x.o.name)}</div><strong>${rub(x.cost)}</strong></div><div class="detail">К заказу: ${unitLabel(x.o,x.count)} · ${rub(x.o.price)} за ${x.o.unit==='bottle'?'бутылку':'упаковку'}</div>${x.over?`<div class="detail">Потребность: ${qty(x.item.n)} ${x.item.unit==='liter'?'л':x.item.unit==='bottle'?'бут.':'шт.'} · покупка с запасом подтверждена</div>`:''}</div>`).join('')}</details></div>`;}).join('')}
   ${calc.ready.length?`${deliveryForm()}<div class="card"><h3>Сообщения поставщикам</h3><p class="tiny">Без технических расчётов и цен по умолчанию. Сообщения не отправляются автоматически.</p><div class="space"></div>${[...calc.suppliers].map(([id,items])=>`<div class="stack"><div class="row"><strong>${escape(getSupplier(id))}</strong><span class="pill">Готово к копированию</span></div><div class="message-text" id="msg-${id}">${escape(messageForSupplier(id,items))}</div>${btn('Скопировать сообщение','copy-'+id,'btn-primary btn-wide')}</div><div class="space"></div>`).join('')}</div>${btn('Сохранить как прошлую закупку','saveHistory','btn-outline btn-wide')}`:''}
   ${btn('Изменить товары','work','btn-quiet btn-wide')}`;
 }
 function deliveryForm(){const d=state.delivery;return `<div class="card stack"><div><h3>Доставка</h3><p class="tiny">Заполни только то, что нужно указать поставщику. Эти значения сохранятся для следующей закупки.</p></div><div class="grid-2"><div><label class="field-label" for="delivery-date">Дата</label><input type="date" id="delivery-date" class="field" value="${escape(d.date)}"></div><div><label class="field-label" for="delivery-window">Время</label><input id="delivery-window" class="field" placeholder="15:00–19:00" value="${escape(d.window)}"></div></div><div><label class="field-label" for="delivery-address">Адрес</label><input id="delivery-address" class="field" placeholder="Улица, дом, заведение" value="${escape(d.address)}"></div><div><label class="field-label" for="delivery-comment">Комментарий</label><input id="delivery-comment" class="field" placeholder="Например: звонить при подъезде" value="${escape(d.comment)}"></div><label class="checkboxline"><input type="checkbox" id="include-prices" ${d.includePrices?'checked':''}>Указать закупочные цены в сообщениях</label><p class="tiny">Менять доставку можно прямо здесь. Сообщения обновятся автоматически.</p></div>`;}
 function messageForSupplier(id,items){const d=state.delivery;const lines=['Привет! Заказ для бара:',''];items.forEach((x,i)=>{
   const cost=d.includePrices?` · ${rub(x.cost)}`:'';
   lines.push(`${i+1}. ${x.o.name} — ${unitLabel(x.o,x.count)}${cost}`);
 });
   if(d.date||d.window||d.address||d.comment)lines.push('');
   if(d.date){const parts=d.date.split('-');lines.push(`Дата доставки: ${parts.length===3?`${parts[2]}.${parts[1]}.${parts[0]}`:d.date}`);}
   if(d.window)lines.push(`Время доставки: ${d.window}`);
   if(d.address)lines.push(`Адрес: ${d.address}`);
   if(d.comment)lines.push(d.comment);
   lines.push('','Спасибо!');return lines.join('\n');
 }
 function viewHistory(){return `${stepBack('home')}<p class="eyebrow">История</p><h2>Закупки и повтор</h2><p class="muted">Здесь сохраняется утверждённый тобой шаблон. Копирование сообщения не означает, что поставщик его получил.</p>${state.history.length?`<div class="card">${state.history.map((h,i)=>`<div class="history-item"><div class="row"><div><strong>${escape(h.label)}</strong><p class="tiny">${escape(h.savedAt)} · ${h.mode==='stock'?'По остаткам':'Списком'}</p></div><span class="pill">Учебная</span></div><button class="link-btn" data-action="repeat-${i}">Повторить закупку →</button></div>`).join('')}</div>`:'<div class="card"><div class="empty-icon">↻</div><h3>Пока нет сохранённых закупок</h3><p class="muted">После первого учебного расчёта можно сохранить его как основу для повторения.</p></div>'}${btn('Новая закупка','new','btn-primary btn-wide')}`;}

 function backLine(){
   if(state.view==='home')return {mood:'idle',tag:'ТВОЙ НАПАРНИК',title:'Ну что, пополним бар?',text:'Кидай список. Цены и коробки проверю сам, а где без тебя никак — спрошу.'};
   if(state.view==='sources')return {mood:'thinking',tag:'ГОТОВЛЮСЬ К РАБОТЕ',title:'Откуда берём цены?',text:'Здесь только учебные предложения. Настоящие прайсы подключим после UX-тестов.'};
   if(state.view==='work'){
     if(state.mode==='stock')return {mood:'thinking',tag:'ПРОВЕРКА ЗАПАСОВ',title:'Посчитаем, что закончилось',text:'Введи сегодняшние остатки. Что уже в пути, тоже учтём — но не будем выдавать старые остатки за новые.'};
     if(!state.text.trim())return {mood:'idle',tag:'НАЧИНАЕМ',title:'Кидай список, разберёмся',text:'Напиши товары и количества — я подберу варианты.'};
     if(!state.demoSources)return {mood:'thinking',tag:'СПИСОК НА МЕСТЕ',title:'Нужны предложения поставщиков',text:'Я сохранил товары. Подключи учебные прайсы — продолжим.'};
     return {mood:'thinking',tag:'ВСЁ НА МЕСТЕ',title:'Можем собирать заказ',text:'Если встречу неоднозначный товар, покажу пару вариантов. Переписывать список не придётся.'};
   }
   if(state.view==='history')return {mood:'thinking',tag:'ПОСТОЯННЫЕ ГОСТИ',title:'Повторим знакомое',text:'Товары вспомним, а сегодняшние остатки и новые цены проверим отдельно.'};
   if(state.view==='review'){
     if(!state.demoSources)return {mood:'thinking',tag:'НУЖЕН ПРАЙС',title:'Без цен не посчитать',text:'Твой список сохранён. Подключи учебные прайсы.'};
     if(state.editItemId!==null)return {mood:'thinking',tag:'ТОЧЕЧНАЯ ПРАВКА',title:'Поправим только эту строку',text:'Вводи как удобно. Остальные товары и ответы я не трону.'};
     const calc=scenario(),q=calc.questions[0];
     if(q){
       if(q.kind==='unit')return {mood:'question',tag:'ОДИН МАЛЕНЬКИЙ ВОПРОС',title:'В чём измеряем?',text:`У ${q.item.name} есть количество, но нет единицы. Выбери одной кнопкой.`};
       if(q.kind==='quantity')return {mood:'question',tag:'НУЖНА ОДНА ДЕТАЛЬ',title:'Сколько берём?',text:'Подскажи число и единицу. Всё остальное останется как было.'};
       if(q.kind==='missing')return {mood:'care',tag:'НЕ НАШЁЛ В ДЕМО-ПРАЙСАХ',title:'Этот товар пока без цены',text:`По «${q.item.name}» предложения нет. Не стану придумывать замену — можно сохранить в списке или поправить строку.`};
       if(q.kind==='spark-brand')return {mood:'question',tag:'ВЫБЕРЕМ МАРКУ',title:'Какое игристое берём?',text:'Объём понятен. Вижу несколько марок — выбери нужную.'};
       if(q.kind==='choice'){
         if(q.item.category==='sparklingwine')return {mood:'question',tag:'ВАЖНО ПРО ОБЪЁМ',title:'Маленькая или обычная?',text:'Нашёл игристое 0,2 и 0,75 л. Сравнивать их как одинаковые нельзя — выбери объём.'};
         if(q.item.category==='whitewine')return {mood:'question',tag:'ЕСТЬ ИЗ ЧЕГО ВЫБРАТЬ',title:'Нашёл белое в твоём бюджете',text:`Вижу варианты за ${q.item.priceMin}–${q.item.priceMax} ₽ за бутылку. Какое вино возьмём?`};
         if(q.item.category==='vodka')return {mood:'question',tag:'ВЫБИРАЕМ НАПОЛНЕНИЕ',title:'Какую водку берём?',text:'Есть несколько марок. Покажу цену всего заказа — выбирай одним нажатием.'};
         if(q.item.category==='gold')return {mood:'question',tag:'ОБЪЁМ ВЛИЯЕТ НА ЗАКАЗ',title:'Какая бутылка нужна?',text:'Нашёл разные фасовки. Давай выберем точную.'};
         return {mood:'question',tag:'ЕСТЬ ВАРИАНТЫ',title:'Какой вариант твой?',text:'Нашёл разные разновидности. Выбери нужную, я сохраню решение.'};
       }
       if(q.kind==='surplus')return {mood:'care',tag:'ВАЖНОЕ УТОЧНЕНИЕ',title:'Поставщик требует больше',text:'Партия больше твоего запроса. Покажу количество и цену, а решение — за тобой.'};
     }
     if(calc.missing.length&&!calc.ready.length)return {mood:'care',tag:'ПОКА НЕ СОБРАЛИ',title:'Товары сохранил, цены не нашёл',text:'Не буду выдавать неполную закупку за готовую. Исправим позиции, когда появятся предложения.'};
     if(calc.missing.length)return {mood:'success',tag:'ЧАСТЬ ЗАКУПКИ ГОТОВА',title:'Есть что отправить!',text:`Собрал ${calc.ready.length} ${plural(calc.ready.length,'позицию','позиции','позиций')}. Остальное сохранил отдельно, ничего не потерял.`};
     return {mood:'success',tag:'ЗАКУПКА СОБРАНА',title:'Готово, красавчик!',text:'Позиции и суммы посчитаны. Осталось проверить и скопировать сообщения поставщикам.'};
   }
   return {mood:'idle',tag:'НА СВЯЗИ',title:'Я Бэк',text:'Здесь, когда понадобится помощь.'};
 }
 function drawBack(){
   const app=$('app');
   app.classList.toggle('with-back',backIsOn);
   $('variant-off').setAttribute('aria-pressed',String(!backIsOn));
   $('variant-on').setAttribute('aria-pressed',String(backIsOn));
   if(!backIsOn || state.view==='home')return;
   const {mood,text,title,tag}=backLine();
   const reviewQuestion=state.view==='review' && !!app.querySelector('.question-progress');
   const html=`<aside class="back-message back-message-${mood} ${reviewQuestion?'back-question-host':''}" aria-label="Бэк, цифровой барбэк">
      <div class="back-sprite-wrap"><img class="back-sprite" src="${PIXEL_BACK[mood]||PIXEL_BACK.idle}" width="104" height="104" alt="Бэк — пиксельный помощник"></div>
      <div class="back-dialog"><div class="back-tag"><span class="back-dot"></span>${escape(tag)}</div><div class="back-name">Бэк <span>· цифровой барбэк</span></div><h3 class="back-heading">${escape(title)}</h3><p>${escape(text)}</p></div>
      ${mood==='success'?'<div class="back-confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>':''}
    </aside>`;
   const progress=app.querySelector('.question-progress');
   if(progress)progress.insertAdjacentHTML('afterend',html);
   else{const backlink=app.querySelector('.back');if(backlink)backlink.insertAdjacentHTML('afterend',html);else app.insertAdjacentHTML('afterbegin',html);}
 }
 let dockExpanded=false;
 function renderDock(){
   const dock=$('back-dock');if(!dock)return;
   if(!backIsOn){dock.hidden=true;return;}
   const {mood,title,text}=backLine();
   $('back-dock-image').src=PIXEL_BACK[mood]||PIXEL_BACK.idle;
   $('back-dock-speech').innerHTML=`<strong>${escape(title)}</strong><span>${escape(text)}</span>`;
   $('back-dock-speech').hidden=!dockExpanded;
   $('back-dock-button').setAttribute('aria-expanded',String(dockExpanded));
   syncDock();
 }
 function syncDock(){
   const dock=$('back-dock');if(!dock || !backIsOn)return;
   const full=$('app').querySelector('.back-message');
   const gone=full?full.getBoundingClientRect().bottom<95:window.scrollY>120;
   const typing=document.activeElement?.matches('input:not([type=checkbox]), textarea, select')||false;
   dock.hidden=!gone||typing;
   if(dock.hidden){dockExpanded=false;$('back-dock-speech').hidden=true;$('back-dock-button').setAttribute('aria-expanded','false');}
 }
 $('back-dock-button').addEventListener('click',()=>{
   dockExpanded=!dockExpanded;
   $('back-dock-speech').hidden=!dockExpanded;
   $('back-dock-button').setAttribute('aria-expanded',String(dockExpanded));
 });
 document.addEventListener('pointerdown',e=>{if(dockExpanded&&!e.target.closest('#back-dock')){dockExpanded=false;$('back-dock-speech').hidden=true;$('back-dock-button').setAttribute('aria-expanded','false');}});
 window.addEventListener('scroll',syncDock,{passive:true});
 window.addEventListener('resize',syncDock);
 document.addEventListener('focusin',syncDock);
 document.addEventListener('focusout',()=>requestAnimationFrame(syncDock));
 let rewardTimer=null;
 function backReward(message,celebratory=true){
   if(!backIsOn)return;
   const old=$('back-reward');if(old)old.remove();clearTimeout(rewardTimer);
   const el=document.createElement('div');el.id='back-reward';el.className='back-reward'+(celebratory?' back-reward-happy':'');el.setAttribute('role','status');
   const sticker=document.createElement('span');sticker.className='reward-sticker';sticker.textContent=celebratory?'✦':'✓';
   const copy=document.createElement('span');copy.textContent=message;
   el.append(sticker,copy);document.body.appendChild(el);
   rewardTimer=setTimeout(()=>el.remove(),2300);

function enhanceVisualAlpha2Hero(){
 const hero=$('app')?.querySelector('.bar-hero');
 if(!hero)return;
 const bek=hero.querySelector('.bar-hero-bek');if(!bek)return;
 const textarea=hero.parentElement.querySelector('#request');
 const applyHeroMood=()=>{bek.src=(textarea&&textarea.value.trim())?VISUAL_ALPHA2_ASSETS.work:VISUAL_ALPHA2_ASSETS.sleep;};
 applyHeroMood();
 if(textarea)textarea.addEventListener('input',applyHeroMood,{passive:true});
 const foreground=document.createElement('div');foreground.className='bar-hero-foreground';foreground.setAttribute('aria-hidden','true');
 hero.insertBefore(foreground,hero.querySelector('.bar-hero-speech'));
 const cat=document.createElement('img');cat.className='bar-hero-cat';cat.src=VISUAL_ALPHA2_ASSETS.cat;cat.setAttribute('alt','');cat.setAttribute('aria-hidden','true');cat.width=84;cat.height=84;
 /* Use the canonical cat already painted onto BAR_BG. Avoid double-cat. */
 const raw=window.getComputedStyle(hero).backgroundImage;
 const match=raw.match(/url\(["']?(data:image\/[a-z0-9.+-]+;base64,[^"')]+)["']?\)/i);
 if(!match)return;
 const img=new Image();
 img.onload=()=>{
  try{
   const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
   const data=ctx.getImageData(0,0,c.width,c.height);
   const start=Math.floor(c.height*0.77),fade=Math.max(1,Math.floor(c.height*0.035));
   for(let y=0;y<c.height;y++){
    const alpha=y<start?0:y>=start+fade?1:(y-start)/fade;
    const a=Math.max(0,Math.min(255,Math.round(255*alpha)));
    for(let x=0;x<c.width;x++)data.data[(y*c.width+x)*4+3]=a;
   }
   ctx.putImageData(data,0,0);
   foreground.style.backgroundImage='url("'+c.toDataURL('image/png')+'")';
   foreground.dataset.ready='1';
  }catch(e){console.warn('BAR_FOREGROUND skipped:',e.message)}
 };
 img.src=match[1];
}
function render(){renderBase();enhanceVisualAlpha2Hero();}
window.addEventListener('bz:catalogready',()=>{if(state.view==='sources'||state.view==='home')render()});

function resetForRun(){state.choices={};state.brandChoices={};state.surplus={};state.excluded={};state.acknowledgedMissing={};state.flowTotal=0;state.editItemId=null;state.draftInput='';}
 function analyze(){if(window.BZ_STEP2?.has()&&!confirm('Загруженные реальные прайсы ещё НЕ участвуют в этом расчёте. Продолжить ТОЛЬКО учебный сценарий?'))return;if(!state.demoSources){nav('review');return;}const lines=sourceLines();if(!lines.length){toast('Добавь хотя бы один товар');return;}resetForRun();nav('review');}
 function repeat(index=0){const h=state.history[index];if(!h){toast('Пока нечего повторять');return;}state.mode=h.mode;state.text=h.text;
   // Old inventory measurements are never copied as today's stock.
   state.inventory={};resetForRun();nav('work');toast('Товары восстановлены. Проверь сегодняшнюю потребность.');}
 function saveHistory(){const calc=scenario();const entry={label:calc.ready.length?`${calc.ready[0].item.name}${calc.ready.length>1?` и ещё ${calc.ready.length-1}`:''}`:'Закупка',savedAt:new Date().toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}),mode:state.mode,text:state.text};state.history.unshift(entry);state.history=state.history.slice(0,12);persist();toast('Сохранено. Можно повторить из истории.');}
 function updateMessagePreview(){if(state.view!=='review')return;const calc=scenario();for(const [id,items] of calc.suppliers){const el=$(`msg-${id}`);if(el)el.textContent=messageForSupplier(id,items);}}
 const toastCopy=async id=>{const calc=scenario(),items=calc.suppliers.get(id);if(!items)return;const value=messageForSupplier(id,items);
  try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);}else{const el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw new Error('not copied');}toast('Сообщение скопировано. Оно ещё не отправлено.');}catch(e){toast('Не удалось скопировать. Выдели текст сообщения вручную.');}
 };
 document.addEventListener('click',e=>{
   const variant=e.target.closest('[data-variant]');
   if(variant){
     // Любая незавершённая правка остаётся в черновике при смене интерфейса.
     if(state.editItemId!==null && $('edit-line')){state.draftInput=$('edit-line').value;persist();}
     backIsOn=variant.dataset.variant==='on';
     const url=new URL(location.href);url.searchParams.set('back',backIsOn?'on':'off');history.replaceState(null,'',url);
     render();return;
   }
   if(e.target.closest('#brand-link')){e.preventDefault();nav('home');return;}
   if(e.target.closest('#menu-toggle')){const menu=$('side-menu');menu.classList.toggle('hidden');$('menu-toggle').setAttribute('aria-expanded',String(!menu.classList.contains('hidden')));return;}
   const example=e.target.closest('[data-example]');if(example){const sample=D.examples[Number(example.dataset.example)];state.mode='list';state.text=sample.value;persist();nav('work');return;}
   const fix=e.target.closest('[data-fix-unit]');if(fix){const id=Number(fix.dataset.fixUnit),item=sourceLines().find(it=>it.id===id);if(item){updateOneLine(id,`${item.name} — ${qty(item.n)} ${fix.dataset.unit}`);if(['absent','unknown'].includes(item.category)){state.acknowledgedMissing[id]=true;persist();nav('review');}backReward('Единицу запомнил. Дальше!');}return;}
   const brandPick=e.target.closest('[data-pick-brand]');if(brandPick){state.brandChoices[Number(brandPick.dataset.pickBrand)]=brandPick.dataset.key;persist();render();window.scrollTo(0,0);backReward('Марку выбрали. Отлично!');return;}
   const pick=e.target.closest('[data-pick]');if(pick){delete state.brandChoices[Number(pick.dataset.pick)];state.choices[Number(pick.dataset.pick)]=pick.dataset.key;persist();render();window.scrollTo(0,0);backReward('Отлично, с этим разобрались!');return;}
   const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
   $('side-menu').classList.add('hidden');$('menu-toggle').setAttribute('aria-expanded','false');
   if(['home','work','sources','history','review'].includes(action)){nav(action);return;}
   if(action==='stock-home'){state.mode='stock';persist();nav('work');return;}
   if(action==='new'){state.mode='list';state.text='';state.inventory={};resetForRun();nav('work');return;}
   if(action==='enableSources'){state.demoSources=true;persist();nav(state.text.trim()||state.mode==='stock'?'work':'sources');toast('Учебные прайсы подключены');return;}
   if(action==='mode-list'||action==='mode-stock'){state.mode=action==='mode-list'?'list':'stock';persist();render();return;}
   if(action==='analyze'){analyze();return;}
   if(action==='cancel-edit'){state.editItemId=null;state.draftInput='';nav('review');return;}
   if(action.startsWith('edit-')){editOneItem(Number(action.slice(5)));return;}
   if(action==='ack-all'){const calc=scenario();calc.questions.filter(q=>q.kind==='missing').forEach(q=>state.acknowledgedMissing[q.item.id]=true);persist();nav('review');return;}
   if(action.startsWith('ack-')){state.acknowledgedMissing[Number(action.slice(4))]=true;persist();nav('review');return;}
   if(action==='saveHistory'){saveHistory();backReward('Закупка в истории — сохранил!');return;}
   if(action==='repeat'){repeat();return;}
   if(action.startsWith('repeat-')){repeat(Number(action.slice(7)));return;}
   if(action.startsWith('accept-')){state.surplus[Number(action.slice(7))]=true;persist();render();window.scrollTo(0,0);backReward('Дополнительное количество подтверждено',false);return;}
   if(action.startsWith('exclude-')){state.excluded[Number(action.slice(8))]=true;persist();render();window.scrollTo(0,0);return;}
   if(action.startsWith('copy-')){toastCopy(action.slice(5));return;}
   if(action==='reset'){if(window.confirm('Сбросить все учебные данные этого браузера?')){localStorage.removeItem(KEY);state=structuredClone(base);nav('home');toast('Учебный прототип сброшен');}return;}
 });
 document.addEventListener('submit',e=>{
   if(e.target.id==='edit-line-form'){
     e.preventDefault();const v=$('edit-line')?.value||'';if(!v.trim()){toast('Напиши товар и количество');return;}
     updateOneLine(Number(state.editItemId),v);return;
   }
   if(e.target.id==='amount-form'){
     e.preventDefault();const id=Number(e.target.dataset.id),item=sourceLines().find(it=>it.id===id),n=Number($('amount-value')?.value),unit=$('amount-unit')?.value;
     if(!item||!Number.isFinite(n)||n<=0){toast('Количество должно быть больше нуля');return;}
     updateOneLine(id,`${item.name} — ${qty(n)} ${unit}`);
     if(['absent','unknown'].includes(item.category)){state.acknowledgedMissing[id]=true;persist();nav('review');}
     return;
   }
 });
 document.addEventListener('input',e=>{
   if(e.target.id==='edit-line'){state.draftInput=e.target.value;persist();return;}
   if(e.target.id==='request'){state.text=e.target.value;persist();const analyzeBtn=document.querySelector('[data-action="analyze"]');if(analyzeBtn)analyzeBtn.disabled=!state.text.trim();return;}
   if(e.target.matches('[data-stock]')){const id=e.target.dataset.stock;state.inventory[id]??={};state.inventory[id][e.target.dataset.type]=e.target.value.replace(',','.');persist();return;}
   const fields={'delivery-date':'date','delivery-window':'window','delivery-address':'address','delivery-comment':'comment'};
   if(fields[e.target.id]){state.delivery[fields[e.target.id]]=e.target.value;persist();updateMessagePreview();return;}
 });
 document.addEventListener('change',e=>{if(e.target.id==='include-prices'){state.delivery.includePrices=e.target.checked;persist();updateMessagePreview();}});
 render();
})();

</script>
</body>
</html>
