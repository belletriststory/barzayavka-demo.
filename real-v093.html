function filteredAddOffers(){const q=norm(addOfferQuery);return offers().filter(o=>!o.bad&&(!q||norm(o.name+' '+supplierName(o.fid)).includes(q)));}

function updateAddOffers(q){addOfferQuery=q;addOfferPage=0;paintAddOffers();}

function matchKey(nid,fid){return nid+'-'+fid;}
function pickerData(n,f){const key=matchKey(n.id,f.id),q=norm(matchQuery[key]||'');let all=offers().filter(o=>o.fid===f.id&&!o.bad);
 if(q)all=all.filter(o=>norm(o.name+' '+(o.volume||'')).includes(q));
 else all.sort((a,b)=>{let qa=inspectSku(n,a),qb=inspectSku(n,b);return ['exact','review','conflict'].indexOf(qa.tier)-['exact','review','conflict'].indexOf(qb.tier)||qb.score-qa.score||a.sourceRow-b.sourceRow;});
 return {all,key,page:matchPage[key]||0,current:matches[n.id]?.[f.id]||''};}
function pickerResults(n,f){const {all,key,page,current}=pickerData(n,f),start=page*PAGE_SIZE,list=all.slice(start,start+PAGE_SIZE);
 const old=offers().find(o=>o.id===current),visible=(old&&!list.some(o=>o.id===current))?[old,...list]:list;
 const opts=visible.map(o=>{let v=inspectSku(n,o),mark=v.tier==='exact'?'✓ точное':v.tier==='review'?'? уточнить':'! замена';return `<option value="${o.id}" ${o.id===current?'selected':''}>${esc(mark+' · '+(o.name+(o.volume?' · '+o.volume:'')).slice(0,110))}</option>`}).join('');

 let note=selected?`<div class="tag ${selected.tier==='conflict'?'danger-tag':selected.tier==='review'?'warn-tag':''}">${selected.tier==='exact'?'Совпадают название, тип и доступные характеристики.':`Ручное разрешение на эту закупку: ${esc(selected.reasons.join('; '))}. Автозапоминание запрещено.`}</div>`:'';
 return `<select class="field wide" onchange="updateMatch('${n.id}','${f.id}',this.value)" aria-label="Предложение ${esc(f.supplier)}"><option value="" ${!current?'selected':''}>Не выбрано</option>${opts}</select>${note}<div class="row" style="margin-top:6px"><span class="mini">${list.length?start+1:0}–${Math.min(start+PAGE_SIZE,all.length)} из ${all.length} · ✓ идентично · ? сверить · ! замена</span><button class="btn" onclick="pageMatches('${n.id}','${f.id}',-1)" ${start===0?'disabled':''}>←</button><button class="btn" onclick="pageMatches('${n.id}','${f.id}',1)" ${start+PAGE_SIZE>=all.length?'disabled':''}>→</button></div>`;}
