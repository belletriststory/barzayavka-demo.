/* Step 5.6: barback A/B experiment. Visual only, equal business logic. */
.back-experiment-switch{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 17px;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:#fff}

.back-dock-button img{width:49px;height:49px;image-rendering:pixelated;object-fit:contain}
.back-dock-indicator{font-size:9px;color:#42986e}
.back-dock-speech{pointer-events:auto;width:min(300px,calc(100vw - 32px));display:flex;flex-direction:column;gap:5px;line-height:1.38;margin-bottom:8px;background:#fff;color:#243a32;padding:12px 15px;border-radius:16px;border:1px solid #cfe1d2;box-shadow:0 10px 32px #2c47342b;font-size:13px}
.back-dock-speech strong{font-size:15px;color:#1d5d45}
.back-message-question .back-sprite-wrap:after{content:'?';position:absolute;top:-9px;right:-9px;width:23px;height:23px;background:#f1cb72;color:#394b36;border:2px solid #fff;display:grid;place-items:center;border-radius:7px;font-weight:900;font-size:15px}
.back-message-thinking .back-sprite{animation:back-think 2.6s steps(3,end) infinite}
.back-message-care .back-sprite{animation:back-care 2.8s steps(3,end) infinite}
@keyframes back-think{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@keyframes back-care{0%,100%{transform:translateX(0)}40%,60%{transform:translateX(-2px)}}
@media(max-width:550px){
 .shell{padding:0 14px calc(132px + env(safe-area-inset-bottom))}
 .back-experiment-descriptor{display:none}.back-experiment-switch{justify-content:center;border:0;background:transparent;box-shadow:none;padding:2px 0;margin:0 0 10px}
 .back-mode-group{width:100%;justify-content:center}.back-mode-option{flex:1;min-height:42px;font-size:13px}
 .with-back .back-message{margin:3px 0 17px;padding:10px 11px;gap:11px}
 .with-back .back-heading{font-size:17px}.with-back .back-dialog p{font-size:12px}
 .back-dock{bottom:calc(104px + env(safe-area-inset-bottom));left:12px}
 .back-dock-button{min-height:53px;padding:4px 9px 4px 4px}
 .back-dock-button img{width:45px;height:45px}
 .back-reward{bottom:calc(172px + env(safe-area-inset-bottom));max-width:calc(100vw - 30px)}
}
@media(max-width:355px){.with-back .back-message{gap:9px}.with-back .back-sprite-wrap{width:57px;height:57px}.with-back .back-sprite{width:54px;height:54px}.with-back .back-heading{font-size:15px}}
@media(prefers-reduced-motion:reduce){.back-message-thinking .back-sprite,.back-message-care .back-sprite{animation:none!important}}

/* VISUAL MVP ALPHA: real isolated Higgsfield assets. UI controls remain semantic HTML. */
:root{--bg:#F5F2E9;--paper:#FFFDF7;--ink:#24312A;--muted:#6A7D73;--line:#DFE7DF;--accent:#075B43;--accent-hover:#064735;--soft:#E9F2EA;--warm:#FFF3DF;--shadow:0 7px 24px rgba(21,49,34,.065);background:#F5F2E9}
body{background:linear-gradient(180deg,#F4F2EA,#F8F7F2)}
.shell{max-width:850px;padding:0 18px calc(115px + env(safe-area-inset-bottom))}
main{max-width:720px}
.topbar{height:60px}
.brand{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:20px;font-weight:950;letter-spacing:-1.25px;color:#103F30;gap:8px}
.brand-symbol{font:21px/1 monospace;width:29px;height:29px;border-radius:7px;background:#114C37;color:#E7AF55}
.alpha{font-size:9px;letter-spacing:.4px;color:#527363;border:1px solid #D9E3D9;padding:7px 7px;background:#EAF2E9}
.demo-banner{margin:2px 0 10px;background:#F0F1E8;border:0;border-left:3px solid #DDA952;border-radius:6px;color:#506255;padding:5px 9px;min-height:27px}
.demo-banner strong{font-size:10px;color:#587064;font-weight:650}
.back-experiment-switch{border:0;background:transparent;box-shadow:none;margin:0 0 10px;padding:0;justify-content:flex-end}
.back-mode-group{background:#E6ECE5;border:1px solid #DCE5DE}
.back-mode-option[aria-pressed=true]{box-shadow:0 2px 6px #062D1915;background:#FFFDF7;color:#095B40}
.card{background:#FFFDF9;border-color:var(--line);border-radius:20px}
.btn{border-radius:12px;min-height:48px}
.btn-primary{background:linear-gradient(105deg,#075C44,#0A8060);box-shadow:0 5px 15px rgba(4,95,63,.13)}
.btn-primary:hover{background:#054D39}
.offer,.field,textarea,select{border-radius:13px}
.offer-title{color:#1B4739;font-weight:750}
.metric{font-size:clamp(37px,9vw,48px);color:#102F25;letter-spacing:-1.5px}
.eyebrow{color:#19684F}

.home-quiet{padding:20px 4px 8px}

.home-repeat .btn{flex:0 0 auto}
.home-caution{color:#8B9A8C;font-size:10px;text-align:center;margin:7px 0 15px}
/* Back character is richer but compact enough to leave room for choices. */
.with-back .back-message{background:linear-gradient(125deg,#123D2F,#235D48);border:1px solid #28674E;color:white;min-height:111px;padding:12px 14px;box-shadow:0 6px 21px #0A493018;margin-bottom:17px}
.with-back .back-message-care{background:linear-gradient(120deg,#725128,#9D733D);border-color:#D3A25C}
.with-back .back-message-success{background:linear-gradient(125deg,#104535,#1B7552)}

.with-back .back-message .back-name{font-weight:900}
.with-back .back-question-host{margin-top:0}
.with-back .result-heading{display:none}
.back-dock-button{background:#EAF3E8;border:2px solid #A6C9AB;box-shadow:0 5px 17px #12382834;color:#144735}
.back-dock-speech{border-radius:12px;border-color:#CBDFCC}
.back-reward{background:#14523C}
/* Readable business data, warm accents used only for important events. */
.offer-choice{background:#FFFDF9;border-color:#DDE5DC}
.offer-choice:hover,.offer-choice:focus-visible{background:#F3FAF3}
.note{background:#EFF5EE;border-color:#DFE7DB}
.pill-warn,.warm{background:#FFF2DC;border-color:#F2D7A9}
.footer{color:#86988A;border-color:#E3E9E0;font-size:10px}

body.real-active #app,body.real-active .back-experiment-switch,body.real-active #back-dock,body.real-active .footer{display:none!important}
.real-app{width:100%;max-width:800px;margin:0 auto;padding:8px 4px 35px;color:#24392E;}
.real-head{padding:12px 6px 10px}
.real-head h1{font-size:clamp(23px,4vw,31px);line-height:1.16;margin:6px 0;color:#183C30}
.real-head p{margin:4px 0}
.real-topline{display:flex;align-items:center;gap:13px}
.real-bek{width:88px;height:88px;object-fit:contain;image-rendering:pixelated;flex-shrink:0}
.real-muted,.real-small{color:#6d7b70;line-height:1.55}
.real-small{font-size:12px}
.real-source-status{margin:4px 6px 17px;background:#E9F0E7;border-radius:14px;padding:12px 15px;font-size:13px}
.real-card{padding:20px;background:#FFFEFA;border:1px solid #dce4da;border-radius:22px;margin-bottom:17px;box-shadow:0 8px 24px #25473007}
.real-card h2{font-size:clamp(19px,4vw,24px);line-height:1.2;margin:0 0 10px}
.real-card h3{font-size:18px;margin:12px 0}
.real-card p{line-height:1.55}
.real-card textarea,.real-card input:not([type=file],[type=checkbox]),.real-card select{display:block;width:100%;border:1px solid #cbd8d0;border-radius:12px;background:#fafbf8;padding:12px;font:inherit;color:#24392E;box-sizing:border-box;min-height:45px}
.real-card textarea{min-height:160px;resize:vertical;margin:12px 0}
.real-card label{display:block;font-weight:650;margin:12px 0}
.real-card label.real-upload{position:relative;display:grid;place-items:center;background:#0F674D;color:white;min-height:55px;border-radius:13px;margin:14px 0;cursor:pointer;text-align:center}
.real-upload input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.real-app button:not(.real-upload){cursor:pointer;border-radius:11px;border:1px solid #cddbd1;background:#fff;color:#245846;padding:10px 12px;font:inherit;font-weight:670}
.real-app button:focus-visible,.real-card :focus-visible{outline:3px solid #DAA745;outline-offset:2px}
.real-app button.real-primary{background:#087258;color:white;border:0;min-height:53px;width:100%;margin:10px 0}
.real-app .real-link{border:0!important;background:none!important;padding:4px!important;text-decoration:none;font-size:14px}
.real-file{display:flex;gap:12px;justify-content:space-between;align-items:center;border-bottom:1px solid #edf0eb;padding:11px 0}
.real-file small{display:block;font-size:12px;color:#738074;line-height:1.35}
.real-file button{margin-left:4px}
.real-choices{display:grid;gap:11px}
.real-choices button{text-align:left;width:100%;min-height:53px;background:#F5F8F3!important;padding:13px!important}
.real-choices strong,.real-choices small{display:block}
.real-choices small{font-weight:400;color:#687A6D;margin-top:5px;line-height:1.45}
.real-map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.real-check{display:flex!important;align-items:center;gap:12px}
.real-check input{width:20px;height:20px}
.real-total{font-size:36px;font-weight:820;letter-spacing:-1.3px}
.real-result-row{padding:12px 0;border-bottom:1px solid #E2EAE0;display:grid;gap:4px}
.real-result-row small{color:#698174}
.real-alert{padding:13px;border:1px solid #eebbaa;background:#fff0e9;border-radius:13px;color:#913D2B}
.real-note{padding:13px;border:1px solid #b7d9bd;background:#edf9ee;border-radius:13px;color:#246240}
.real-overline{font-size:12px;color:#1b7457;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.real-message{white-space:pre-wrap;word-break:break-word;font:14px/1.6 system-ui,sans-serif;background:#F4F7F4;border-radius:12px;padding:16px}

<script>
/* БарЗаявка 2.0 UX Alpha — исключительно учебный браузерный прототип.
 * Нет AI, импорта XLSX, отправки сообщений, авторизации или реальных цен.
 */
(() => {
 'use strict';
 const D=window.BAR_DEMO, KEY='barzayavka-visual-mvp-alpha-v2';
 const $=id=>document.getElementById(id);
 const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const rub=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n);
 const qty=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
 const plural=(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?many:b===1?one:b>=2&&b<=4?few:many;};
 const base={view:'home',mode:'list',demoSources:true,text:'',inventory:{},choices:{},brandChoices:{},surplus:{},excluded:{},acknowledgedMissing:{},editItemId:null,draftInput:'',flowTotal:0,history:[],draftInput:'',delivery:{date:'',window:'',address:'',comment:'',includePrices:false},showPrices:false};
 let state;
 try {state={...base,...JSON.parse(localStorage.getItem(KEY)||'{}')};}catch(e){state={...base};}
 state.delivery={...base.delivery,...state.delivery};
 state.inventory=state.inventory||{};state.choices=state.choices||{};state.brandChoices=state.brandChoices||{};state.surplus=state.surplus||{};state.excluded=state.excluded||{};state.acknowledgedMissing=state.acknowledgedMissing||{};state.history=Array.isArray(state.history)?state.history.slice(0,12):[];
 const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};
 let toastTimer=null;
 function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3100);}
 const btn=(label,action,cls='btn-outline',extra='')=>`<button type="button" class="btn ${cls}" data-action="${action}" ${extra}>${escape(label)}</button>`;
 const stepBack=(target='work')=>`<button class="back" data-action="${target}">← Назад</button>`;
 function nav(view){state.view=view;persist();render();window.scrollTo({top:0,behavior:'auto'});}
 function getSupplier(id){return D.sources.find(s=>s.id===id)?.name||'Учебный поставщик';}
 const normalize=s=>String(s??'').toLowerCase().replaceAll('ё','е').replaceAll('—','-').replaceAll('–','-');
 function detectCategory(name){const t=normalize(name);
   if(/русск.*стандарт|russian standard/.test(t))return 'absent';
   if(/шато\s*таман|chateau\s*taman/.test(t))return 'chateau';
   if(/золот.*балк/.test(t))return 'gold';
   // Open category intent: known wine descriptors only. An extra unknown brand
   // prevents substituting a different trademark without permission.
   const categoryTokens=new Set(['вино','вина','вин','игристое','игристого','игристые','игристых','игристый','шампанское','шампанского','шампанские','брют','сухое','сухого','полусухое','белое','белого','белый','белые','за','до','от','рублей','рубля','рубль','руб','р','бут','бутылок','бутылки','бутылка','бутылку','бутылке','б','л','литр','литров','литра','цена','по','в','диапазоне','цене','примерно','около','минимальное','минимальной','минимальную','минимум','самое','самый','самую','дешевое','дешевого','дешевле','недорого','выгодное','подешевле','стоимости','заказать','розовое','красное','десертное','полусладкое']);
   const categoryOnly=(t.match(/[а-яa-z]+/g)||[]).every(w=>categoryTokens.has(w));
   if(categoryOnly && /(игрист|шампан|брют)/.test(t))return 'sparklingwine';
   // Категорийный запрос допустим только без названного неизвестного бренда.
   const genericWhiteWine=/(?:вино|вин[а-я]*)\s+бел|бел[а-я]*\s+(?:вин|вино)/.test(t);
   const categoryWords=new Set(['вино','вина','вин','белое','белого','белый','белые','белых','за','до','от','рублей','рубля','рубль','руб','р','бут','бутылок','бутылки','бутылка','бутылку','бутылке','б','л','литр','литров','литра','цена','по','в','диапазоне','цене','примерно','около','сухое','сухого','полусладкое','брют','игристое']);
   if(genericWhiteWine && (t.match(/[а-яa-z]+/g)||[]).every(w=>categoryWords.has(w)))return 'whitewine';
   if(/monin|сироп|ванил/.test(t))return 'syrup';
   if(/салфет/.test(t))return 'napkins';
   if(/водк|vodka/.test(t))return 'vodka';
   if(/вода|негаз/.test(t))return 'water';
   return 'unknown';
 }
 function parseLine(line,index){
   const raw=line.trim();if(!raw)return null;
   // Количество выбирается по ПОСЛЕДНЕЙ паре «число + единица». До неё может идти фасовка (0,7 л).
   // Не используем \b: JS не считает кириллические буквы частью слова.
   const unitPattern=/(\d+(?:[.,]\d+)?)\s*(бут(?:ыл(?:ок|ки|ка|ку)?)?\.?|б(?=$|[\s.,;])|л(?:итр(?:ов|а|ы)?)?\.?|шт(?:ук(?:и|а)?)?\.?|штук|уп(?:ак(?:ов(?:ок|ки|ка))?)?\.?|кг)(?=$|[\s,;:!?()\-–—])/gi;
   const all=[...normalize(raw).matchAll(unitPattern)];
   let n,unit,name;
   if(all.length){
     // «6 бутылок по 0,75 л» = 6 бутылок, где 0,75 л — фасовка.
     let last=all[all.length-1];
     if(all.length>1 && /^л/.test(last[2]) && /по\s*$/.test(normalize(raw).slice(0,last.index))){last=all[all.length-2];}
     n=Number(last[1].replace(',','.'));
     unit=/^(?:бут|б$)/.test(last[2])?'bottle':/^(?:шт|штук)/.test(last[2])?'piece':/^уп/.test(last[2])?'pack':/^кг/.test(last[2])?'kg':'liter';
     name=raw.slice(0,last.index).replace(/[\s\-–—:,;]+$/,'').trim();
   }else{
     const tail=normalize(raw).match(/(?:^|[\s:;\-–—])(\d+(?:[.,]\d+)?)\s*$/);
     if(!tail)return {id:index,raw,name:raw,needsQuantity:true,invalid:'Не указано количество'};
     n=Number(tail[1].replace(',','.'));
     name=raw.slice(0,raw.length-tail[1].length).replace(/[\s\-–—:,;]+$/,'').trim();
     if(n<1) return {id:index,raw,name,needsQuantity:true,invalid:'Неясно, это фасовка или количество'};
   }
   if(!name)return {id:index,raw,name:raw,needsQuantity:true,invalid:'Не указано название товара'};
   if(!Number.isFinite(n)||n<=0)return {id:index,raw,name,needsQuantity:true,invalid:'Нужно положительное количество'};
   const category=detectCategory(name),text=normalize(name),fullText=normalize(raw);
   const volumes=[...fullText.matchAll(/(?:^|[\s(])(0[.,](?:2|5|7|75)|1[.,]0)\s*(?:л)?(?=$|[\s.,;)])/g)];
   const requestedVolume=volumes.length?Number(volumes[volumes.length-1][1].replace(',','.')):null;
   let type=null;
   if(/полуслад/.test(text))type='semisweet';else if(/игрист|брют|brut/.test(text))type='sparkling';else if(/(?:^|\s)сух/.test(text))type='dry';
   const brand=/северн/.test(text)?'северная':/березов|берёзов/.test(name.toLowerCase())?'березовая':null;
   const priceMatch=text.match(/(\d{2,6})\s*[-–—]\s*(\d{2,6})\s*(?:₽|р(?:уб(?:л(?:ей|я|ь|и)?)?)?\.?)?(?=$|[\s,;])/i);
   // В Alpha считаем такой диапазон ценой ЗА БУТЫЛКУ, что явно показываем в выборе.
   const priceMin=priceMatch?Number(priceMatch[1]):null;
   const priceMax=priceMatch?Number(priceMatch[2]):null;
   return {id:index,raw,name,n,unit,needsUnit:!unit,category,requestedVolume,type,brand,priceMin,priceMax,cheap:/дешев|выгод|эконом|минимальн|минимум|сам(?:ое|ый|ая).*цен|подешевле/.test(fullText)};
 }
 function sourceLines(){
   if(state.mode==='list') return state.text.split(/[\n;]+/).map(s=>s.trim()).filter(Boolean).map((s,i)=>parseLine(s,i));
   const items=[];D.inventory.forEach((it,i)=>{
      const rec=state.inventory[it.id]||{};
      if(rec.skip)return;
      if(rec.current===''||rec.current==null){items.push({id:i,raw:it.label,name:it.label,missingStock:true});return;}
      const current=Number(rec.current),inTransit=Number(rec.inTransit||0);
      if(!Number.isFinite(current)||current<0||!Number.isFinite(inTransit)||inTransit<0){items.push({id:i,raw:it.label,name:it.label,invalid:'Остаток и товар в пути должны быть числами от нуля'});return;}
      const n=Math.max(0,it.target-current-inTransit);
      if(n>0){items.push(parseLine(`${it.request} — ${qty(n)} ${it.unit}`,i));}
   });
   return items;
 }
 function selectPool(item){const offers=D.offers.filter(o=>item.category==='whitewine' ? o.category==='chateau' : item.category==='sparklingwine'?o.type==='sparkling':o.category===item.category)
   .filter(o=>item.priceMin==null || (o.price>=item.priceMin && o.price<=item.priceMax));
   if((item.category==='chateau'||item.category==='whitewine') && item.type)return offers.filter(o=>o.type===item.type);
   if(item.category==='sparklingwine'&&item.requestedVolume)return offers.filter(o=>o.volume===item.requestedVolume);
   if(item.category==='gold'&&item.requestedVolume)return offers.filter(o=>o.volume===item.requestedVolume);
   if(item.category==='vodka'&&item.brand)return offers.filter(o=>o.brand===item.brand);
   return offers;
 }
 function groupsForItem(item){const pool=selectPool(item);const groups=new Map();
   for(const o of pool){const k=item.category==='sparklingwine'?String(o.volume):(item.category==='chateau'||item.category==='whitewine')?o.type:item.category==='gold'?String(o.volume):item.category==='vodka'?`${o.brand}_${o.volume}`:o.category;
     if(!groups.has(k))groups.set(k,[]);groups.get(k).push(o);
   }
   return groups;
 }
 function requiredUnits(item,o){
   if(item.unit==='liter'){if(!o.volume || o.unit!=='bottle')return null;return Math.ceil((item.n-1e-9)/o.volume);}
   if(item.unit==='bottle'){if(o.unit!=='bottle')return null;return item.n;}
   if(item.unit==='piece' && o.category==='napkins')return Math.ceil(item.n/o.volume);
   if(item.unit==='piece' && o.unit==='bottle')return item.n;
   if(item.unit==='pack'&&o.unit==='pack')return item.n;
   return null;
 }
 function orderOffer(item,o){const needed=requiredUnits(item,o);if(needed==null)return null;
   const count=Math.max(o.min||1,Math.ceil(needed/(o.multiple||1))*(o.multiple||1));return {o,needed,count,cost:count*o.price,over:count>needed};
 }
 function getBestOffer(item,pool){const candidates=pool.map(o=>orderOffer(item,o)).filter(Boolean);
   return candidates.sort((a,b)=>a.cost-b.cost||a.count-b.count)[0]||null;
 }
 function scenario(){
   const lines=sourceLines(),ready=[],missing=[],questions=[];
   for(const item of lines){
     if(state.excluded[item.id]){missing.push({item,reason:'Оставлено без предложения'});continue;}
     if(item.missingStock){missing.push({item,reason:'Сегодняшний остаток не указан'});continue;}
     if(item.invalid && state.mode==='stock'){missing.push({item,reason:item.invalid});continue;}
     if(item.needsUnit){questions.push({kind:'unit',item});continue;}
     if(item.needsQuantity || item.invalid){questions.push({kind:'quantity',item});continue;}
     if(item.missingStock){missing.push({item,reason:'Сегодняшний остаток не указан'});continue;}
     const pool=selectPool(item);
     if(!pool.length){
       if(!state.acknowledgedMissing[item.id])questions.push({kind:'missing',item});
       else missing.push({item,reason:'Не найдено в учебных предложениях'});
       continue;
     }
     const groups=groupsForItem(item);
     let eligible=pool;
     if(groups.size>1){
       let choice=state.choices[item.id];
       if(!choice && item.cheap && item.category==='vodka'){const opts=[...groups.entries()].map(([k,v])=>({key:k,cost:getBestOffer(item,v)?.cost??Infinity})).sort((a,b)=>a.cost-b.cost);choice=opts[0]?.key;}
       if(!choice || !groups.has(choice)){questions.push({kind:'choice',item,groups});continue;}
       eligible=groups.get(choice);
     }
     if(item.category==='sparklingwine' && eligible.length>1 && !item.cheap){
       const brandChoice=state.brandChoices[item.id];
       if(!brandChoice||!eligible.some(o=>o.id===brandChoice)){
         questions.push({kind:'spark-brand',item,offers:eligible});continue;
       }
       eligible=eligible.filter(o=>o.id===brandChoice);
     }
     const selected=getBestOffer(item,eligible);
     if(!selected){
       if(!state.acknowledgedMissing[item.id])questions.push({kind:'missing',item,reason:'Не найден подходящий формат продажи'});
       else missing.push({item,reason:'Нет подходящей фасовки в учебных предложениях'});
       continue;
     }
     if(selected.over&&!state.surplus[item.id]){questions.push({kind:'surplus',item,selected});continue;}
     ready.push({item,...selected});
   }
   const suppliers=new Map();for(const r of ready){const k=r.o.supplier;if(!suppliers.has(k))suppliers.set(k,[]);suppliers.get(k).push(r);}
   return {lines,ready,missing,questions,total:ready.reduce((s,r)=>s+r.cost,0),suppliers};
 }
 function editOneItem(id){
   if(state.mode!=='list'){nav('work');return;}
   const item=sourceLines().find(it=>it.id===id);state.editItemId=id;state.draftInput=item?.raw||'';persist();nav('review');
 }
 function editMarkup(item){
   if(!item)return '';
   return `<p class="eyebrow">Исправление одной позиции</p><h2>Как записать этот товар?</h2><p class="muted">Исправь только эту строку. Остальные товары и решения останутся на месте.</p><form id="edit-line-form" class="card stack"><label class="field-label" for="edit-line">Товар и количество</label><input class="field" id="edit-line" autocomplete="off" value="${escape(state.draftInput??item.raw)}"><button class="btn btn-primary btn-wide" type="submit">Сохранить и продолжить →</button><button class="btn btn-outline btn-wide" type="button" data-action="cancel-edit">Отмена</button></form>`;
 }
 function updateOneLine(id,newLine){
   if(state.mode!=='list')return;
   const original=state.text.split(/([\n;])/),value=newLine.trim();
   let pos=0;
   for(let i=0;i<original.length;i+=2){
     if(!original[i].trim())continue;
     if(pos++===id){original[i]=value;break;}
   }
   state.text=original.join('');
   delete state.choices[id];delete state.brandChoices[id];delete state.surplus[id];delete state.excluded[id];delete state.acknowledgedMissing[id];
   state.editItemId=null;state.draftInput='';persist();nav('review');
 }

 function renderStockInput(){return `<p class="muted">Укажи сегодняшние остатки. Ничего не подставляем автоматически из прошлой закупки.</p><div class="inventory-top"><span>Товар и цель</span><span>Сейчас</span><span>В пути</span></div>${D.inventory.map((it,i)=>{const rec=state.inventory[it.id]||{};return `<div class="inventory-row"><div><div class="offer-title">${escape(it.label)}</div><div class="tiny">Цель: ${qty(it.target)} ${it.unit}</div></div><input class="field" inputmode="decimal" aria-label="Остаток: ${escape(it.label)}" placeholder="—" data-stock="${it.id}" data-type="current" value="${escape(rec.current??'')}"><input class="field" inputmode="decimal" aria-label="В пути: ${escape(it.label)}" placeholder="0" data-stock="${it.id}" data-type="inTransit" value="${escape(rec.inTransit??'')}"></div>`;}).join('')}<p class="tiny">Пустой остаток означает «неизвестно», а не ноль. Товар в пути указывается только когда заказ действительно подтверждён.</p>`;}
 function showQuestion(q,index,total){
   const info=`<div class="question-progress"><div class="row"><span class="eyebrow">РАЗБИРАЕМ ЗАКУПКУ</span><strong>${index} из ${total}</strong></div><div class="progress"><div style="width:${Math.max(8,Math.min(100,index/total*100))}%"></div></div></div>`;
   const source=`<div class="note">Ты написал: <strong>${escape(q.item.raw)}</strong></div>`;
   if(q.kind==='unit'){
     const n=qty(q.item.n);
     const units=q.item.category==='napkins' ? [
       ['шт.',`${n} ${plural(q.item.n,'штука','штуки','штук')}`],
       ['уп.',`${n} ${plural(q.item.n,'упаковка','упаковки','упаковок')}`]
     ] : [
       ['бут.',`${n} ${plural(q.item.n,'бутылка','бутылки','бутылок')}`],
       ['л',`${n} ${plural(q.item.n,'литр','литра','литров')}`],
       ['уп.',`${n} ${plural(q.item.n,'упаковка','упаковки','упаковок')}`]
     ];
     return `${info}<h2>В чём измеряем ${escape(q.item.name)}?</h2><p class="muted">Указано количество ${n}, но не указана единица. Выбери одним нажатием.</p>${source}<div class="card stack gap-sm">${units.map(([unit,text])=>`<button class="offer offer-choice" data-fix-unit="${q.item.id}" data-unit="${unit}"><strong>${text}</strong><span class="choice-icon">→</span></button>`).join('')}</div>${btn('Исправить название или количество','edit-'+q.item.id,'btn-quiet btn-wide')}`;
   }
   if(q.kind==='quantity'){
     return `${info}<h2>Сколько нужно ${escape(q.item.name)}?</h2><p class="muted">Не хватает понятного количества. Укажи число и единицу один раз.</p>${source}<form class="card stack" id="amount-form" data-id="${q.item.id}"><label class="field-label" for="amount-value">Количество</label><input id="amount-value" class="field" inputmode="decimal" required min="0.01" type="number" step="any" placeholder="Например, 6"><label class="field-label" for="amount-unit">Единица</label><select id="amount-unit"><option value="бут.">Бутылки</option><option value="л">Литры</option><option value="шт.">Штуки</option><option value="уп.">Упаковки</option></select><button class="btn btn-primary btn-wide" type="submit">Продолжить →</button></form>${btn('Изменить исходную строку','edit-'+q.item.id,'btn-quiet btn-wide')}`;
   }
   if(q.kind==='missing'){
     return `${info}<h2>Этот товар пока не найден</h2><p class="muted">В небольших учебных прайсах Alpha подходящего предложения нет. Это не означает, что товара нет у реальных поставщиков.</p>${source}<div class="card stack"><div class="note">${escape(q.reason||'Товара нет среди учебных предложений. Мы сохраним его в списке без цены.')}</div>${btn('Исправить только этот товар','edit-'+q.item.id,'btn-primary btn-wide')}${btn('Оставить в списке без предложения →','ack-'+q.item.id,'btn-outline btn-wide')}</div>${btn('Пропустить все товары без предложения','ack-all','btn-quiet btn-wide')}`;
   }
   if(q.kind==='spark-brand'){
     const variants=q.offers.map(o=>({o,best:orderOffer(q.item,o)})).filter(x=>x.best).sort((a,b)=>a.best.cost-b.best.cost);
     return `${info}<h2>Какое игристое берём?</h2><p class="muted">Объём выбран. Есть несколько марок — выбери нужную.</p>${source}<div class="card stack">${variants.map(({o,best})=>`<button class="offer offer-choice" data-pick-brand="${q.item.id}" data-key="${escape(o.id)}"><span><span class="offer-title">${escape(o.name)}</span><span class="offer-meta">${rub(o.price)}/бут. · ${rub(best.cost)} за ${best.count} бут. · ${escape(getSupplier(o.supplier))}</span></span><span class="choice-icon">→</span></button>`).join('')}</div>${btn('Изменить эту позицию','edit-'+q.item.id,'btn-quiet btn-wide')}`;
   }
   if(q.kind==='choice'){
     const options=[...q.groups.entries()].map(([key,items])=>{const best=getBestOffer(q.item,items),o=best?.o||items[0];return {key,title:q.item.category==='sparklingwine'?`${o.volume.toLocaleString('ru-RU')} л · ${o.volume<0.5?'маленькая бутылка':'стандартная бутылка'}`:o.name,price:best?.cost??null,note:q.item.category==='sparklingwine'?`${rub(o.price)}/бут. · от ${best?rub(best.cost):'—'} за заказ`: `${getSupplier(o.supplier)} · ${rub(o.price)}/бут. · ${best?rub(best.cost):'Нужна единица'} за заказ`};}).sort((a,b)=>(a.price??Infinity)-(b.price??Infinity));
     let title=q.item.category==='sparklingwine'?'Какой объём игристого?':q.item.category==='whitewine'?'Какое белое вино берём?':q.item.category==='chateau'?'Какое вино нужно?':q.item.category==='gold'?'Какой объём бутылки?':q.item.category==='vodka'?'Какую водку выбрать?':'Уточни товар';
     const lead=q.item.category==='sparklingwine'?'Нашёл игристое разных фасовок. Сначала выбери объём бутылки, чтобы не сравнивать 0,2 и 0,75 л как одинаковый товар.':q.item.category==='whitewine'?`Есть белые вина в бюджете ${q.item.priceMin}–${q.item.priceMax} ₽ за бутылку. Выбери стиль.`:q.item.category==='vodka'?'Нашёл несколько марок. Выбери подходящую.':q.item.category==='gold'?'Нашёл бутылки разных объёмов. Это влияет на заказ.':'Нашёл несколько разновидностей. Выбери нужную.';
     return `${info}<h2>${title}</h2><p class="muted">${escape(lead)}</p>${source}<div class="card stack">${options.map(op=>`<button class="offer offer-choice" data-pick="${q.item.id}" data-key="${escape(op.key)}"><span><span class="offer-title">${escape(op.title)}</span><span class="offer-meta">${escape(op.note)} · цены учебные</span></span><span class="choice-icon">→</span></button>`).join('')}</div>${btn('Исправить эту позицию','edit-'+q.item.id,'btn-quiet btn-wide')}${btn('Оставить без предложения','exclude-'+q.item.id,'btn-outline btn-wide')}`;
   }
   const {item,selected}=q,u=selected.o.unit==='bottle'?'бут.':'уп.';
   return `${info}<h2>Нужно заказать больше, чем указано</h2><p class="muted">Поставщик продаёт этот товар минимальной партией.</p>${source}<div class="card stack"><h3>${escape(selected.o.name)}</h3><div class="row"><span class="muted">Твоя потребность</span><strong>${qty(item.n)} ${item.unit==='liter'?'л':item.unit==='bottle'?'бут.':item.unit==='piece'?'шт.':'уп.'}</strong></div><div class="row"><span class="muted">У поставщика</span><strong>${qty(selected.count)} ${u}</strong></div><div class="row"><span class="muted">Итог</span><span class="metric-small">${rub(selected.cost)}</span></div><p class="tiny">Учебные условия. Превышение не подтверждаем без тебя.</p>${btn(`Заказать ${qty(selected.count)} ${u}`,'accept-'+item.id,'btn-primary btn-wide')}${btn('Изменить эту позицию','edit-'+item.id,'btn-outline btn-wide')}</div>${btn('Не включать этот товар','exclude-'+item.id,'btn-quiet btn-wide')}`;
 }

 function viewReview(){const calc=scenario();
   if(!state.demoSources) return `${stepBack('work')}<p class="eyebrow">Сначала источник</p><h2>Нужны предложения поставщиков</h2><p class="muted">Список сохранён. Чтобы проверить подбор на учебных данных, подключи демо-прайсы.</p>${btn('Подключить учебные прайсы','enableSources','btn-primary btn-wide')}`;
   if(!calc.lines.length)return `${stepBack('work')}<h2>Заявка пока пуста</h2>${btn('Вернуться к списку','work','btn-primary btn-wide')}`;
   if(state.editItemId!==null){const item=calc.lines.find(x=>x.id===state.editItemId);if(item)return `${stepBack('review')}${editMarkup(item)}`;state.editItemId=null;}
   if(calc.questions.length){state.flowTotal=Math.max(state.flowTotal||0,calc.questions.length);const index=Math.max(1,state.flowTotal-calc.questions.length+1);return `${stepBack('work')}<div class="helper-steps"><span>1. Потребность</span><span>→</span><b>2. Уточнения</b><span>→</span><span>3. Результат</span></div>${showQuestion(calc.questions[0],index,state.flowTotal)}<p class="tiny">Ответ сразу сохраняется и открывает следующий вопрос. Вернуться к списку можно в любой момент.</p>`;}
   return resultMarkup(calc);
 }
 function unitLabel(o,count){
   if(o.unit==='pack')return `${qty(count)} уп. × ${qty(o.volume)} шт.`;
   if(o.multiple>1&&count%o.multiple===0)return `${qty(count/o.multiple)} кор. × ${o.multiple} бут.`;
   return `${qty(count)} бут.`;
 }
 function resultMarkup(calc){
   const partial=calc.missing.length>0;
   let sourceCount=calc.lines.filter(x=>!x.missingStock&&!x.invalid).length;
   return `${stepBack('work')}<div class="helper-steps"><span>1. Потребность</span><span>→</span><span>2. Подбор</span><span>→</span><b>3. Результат</b></div><div class="result-heading"><p class="eyebrow">${partial?'Частично готово':'Готово к отправке'}</p><h2>${partial?'Часть позиций требует внимания':'Закупка готова'}</h2><p class="muted">Предварительный расчёт по учебным предложениям.</p></div>
   <div class="card"><p class="label-quiet">Общая стоимость</p><div class="metric">${rub(calc.total)}</div><p class="tiny">${calc.ready.length} ${plural(calc.ready.length,'позиция','позиции','позиций')} · ${calc.suppliers.size} ${plural(calc.suppliers.size,'поставщик','поставщика','поставщиков')}${partial?` · ${calc.missing.length} без предложения`:''}</p>${calc.ready.length?'':'<div class="note warm">Пока нет позиций, которые можно включить в заказ.</div>'}</div>
   ${partial?`<div class="card warm"><h3>Не включено в сообщения</h3>${calc.missing.map(x=>`<div class="product-line"><div class="name">${escape(x.item.raw)}</div><div class="detail">${escape(x.reason)}</div><button class="link-btn" data-action="edit-${x.item.id}">Исправить эту позицию →</button></div>`).join('')}<div class="space"></div>${btn('Изменить список','work','btn-outline btn-wide')}</div>`:''}
   ${[...calc.suppliers].map(([id,items])=>{const total=items.reduce((s,x)=>s+x.cost,0);return `<div class="card"><div class="row"><div><h3>${escape(getSupplier(id))}</h3><p class="tiny">${items.length} ${plural(items.length,'позиция','позиции','позиций')} · вымышленные цены</p></div><div class="metric-small">${rub(total)}</div></div><details><summary class="details-toggle">Посмотреть товары и расчёт ↓</summary>${items.map(x=>`<div class="product-line"><div class="row row-top"><div class="name">${escape(x.o.name)}</div><strong>${rub(x.cost)}</strong></div><div class="detail">К заказу: ${unitLabel(x.o,x.count)} · ${rub(x.o.price)} за ${x.o.unit==='bottle'?'бутылку':'упаковку'}</div>${x.over?`<div class="detail">Потребность: ${qty(x.item.n)} ${x.item.unit==='liter'?'л':x.item.unit==='bottle'?'бут.':'шт.'} · покупка с запасом подтверждена</div>`:''}</div>`).join('')}</details></div>`;}).join('')}
   ${calc.ready.length?`${deliveryForm()}<div class="card"><h3>Сообщения поставщикам</h3><p class="tiny">Без технических расчётов и цен по умолчанию. Сообщения не отправляются автоматически.</p><div class="space"></div>${[...calc.suppliers].map(([id,items])=>`<div class="stack"><div class="row"><strong>${escape(getSupplier(id))}</strong><span class="pill">Готово к копированию</span></div><div class="message-text" id="msg-${id}">${escape(messageForSupplier(id,items))}</div>${btn('Скопировать сообщение','copy-'+id,'btn-primary btn-wide')}</div><div class="space"></div>`).join('')}</div>${btn('Сохранить как прошлую закупку','saveHistory','btn-outline btn-wide')}`:''}
   ${btn('Изменить товары','work','btn-quiet btn-wide')}`;
 }
 function deliveryForm(){const d=state.delivery;return `<div class="card stack"><div><h3>Доставка</h3><p class="tiny">Заполни только то, что нужно указать поставщику. Эти значения сохранятся для следующей закупки.</p></div><div class="grid-2"><div><label class="field-label" for="delivery-date">Дата</label><input type="date" id="delivery-date" class="field" value="${escape(d.date)}"></div><div><label class="field-label" for="delivery-window">Время</label><input id="delivery-window" class="field" placeholder="15:00–19:00" value="${escape(d.window)}"></div></div><div><label class="field-label" for="delivery-address">Адрес</label><input id="delivery-address" class="field" placeholder="Улица, дом, заведение" value="${escape(d.address)}"></div><div><label class="field-label" for="delivery-comment">Комментарий</label><input id="delivery-comment" class="field" placeholder="Например: звонить при подъезде" value="${escape(d.comment)}"></div><label class="checkboxline"><input type="checkbox" id="include-prices" ${d.includePrices?'checked':''}>Указать закупочные цены в сообщениях</label><p class="tiny">Менять доставку можно прямо здесь. Сообщения обновятся автоматически.</p></div>`;}
 function messageForSupplier(id,items){const d=state.delivery;const lines=['Привет! Заказ для бара:',''];items.forEach((x,i)=>{
   const cost=d.includePrices?` · ${rub(x.cost)}`:'';
   lines.push(`${i+1}. ${x.o.name} — ${unitLabel(x.o,x.count)}${cost}`);
 });
   if(d.date||d.window||d.address||d.comment)lines.push('');
   if(d.date){const parts=d.date.split('-');lines.push(`Дата доставки: ${parts.length===3?`${parts[2]}.${parts[1]}.${parts[0]}`:d.date}`);}
   if(d.window)lines.push(`Время доставки: ${d.window}`);
   if(d.address)lines.push(`Адрес: ${d.address}`);
   if(d.comment)lines.push(d.comment);
   lines.push('','Спасибо!');return lines.join('\n');
 }
 function viewHistory(){return `${stepBack('home')}<p class="eyebrow">История</p><h2>Закупки и повтор</h2><p class="muted">Здесь сохраняется утверждённый тобой шаблон. Копирование сообщения не означает, что поставщик его получил.</p>${state.history.length?`<div class="card">${state.history.map((h,i)=>`<div class="history-item"><div class="row"><div><strong>${escape(h.label)}</strong><p class="tiny">${escape(h.savedAt)} · ${h.mode==='stock'?'По остаткам':'Списком'}</p></div><span class="pill">Учебная</span></div><button class="link-btn" data-action="repeat-${i}">Повторить закупку →</button></div>`).join('')}</div>`:'<div class="card"><div class="empty-icon">↻</div><h3>Пока нет сохранённых закупок</h3><p class="muted">После первого учебного расчёта можно сохранить его как основу для повторения.</p></div>'}${btn('Новая закупка','new','btn-primary btn-wide')}`;}

(()=>{
'use strict';
/* Verified native parser and conservative supplier field mapping from v0.9.3 */
function xmlText(t){const p=new DOMParser().parseFromString(t,'application/xml');if(p.querySelector('parsererror'))throw Error('Некорректная XML-структура');return p;}
function xmlTags(parent,name){return Array.from(parent.getElementsByTagNameNS('*',name));}

function zipEntries(bytes){const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);const decoder=new TextDecoder();let end=-1;for(let p=bytes.length-22;p>=Math.max(0,bytes.length-65558);p--){if(view.getUint32(p,true)===0x06054b50){end=p;break;}}if(end<0)throw Error('В файле не найден ZIP-каталог');const n=view.getUint16(end+10,true),off=view.getUint32(end+16,true);if(n>3000)throw Error('Слишком много вложенных частей');let pos=off,m=new Map,total=0;for(let i=0;i<n;i++){if(pos+46>bytes.length||view.getUint32(pos,true)!==0x02014b50)throw Error('Повреждён ZIP-каталог');let method=view.getUint16(pos+10,true),cs=view.getUint32(pos+20,true),us=view.getUint32(pos+24,true),fl=view.getUint16(pos+28,true),el=view.getUint16(pos+30,true),cl=view.getUint16(pos+32,true),local=view.getUint32(pos+42,true),name=decoder.decode(bytes.slice(pos+46,pos+46+fl));pos+=46+fl+el+cl;total+=us;if(total>100*1024*1024)throw Error('Распакованные данные слишком велики');if(local+30>bytes.length||view.getUint32(local,true)!==0x04034b50)throw Error('Повреждён ZIP-файл');let dl=local+30+view.getUint16(local+26,true)+view.getUint16(local+28,true);if(dl+cs>bytes.length)throw Error('Некорректная длина данных');m.set(name,{method,data:bytes.slice(dl,dl+cs),size:us})}return m}
async function unzipPart(ent){if(!ent)return null;if(ent.size>35*1024*1024)throw Error('Слишком большой XML-раздел');if(ent.method===0)return ent.data;if(ent.method!==8)throw Error('Неподдерживаемое сжатие XLSX');if(typeof DecompressionStream!=='function')throw Error('Браузер не поддерживает распаковку XLSX. Используйте CSV.');let ds=new DecompressionStream('deflate-raw');let stream=new Blob([ent.data]).stream().pipeThrough(ds);let out=new Uint8Array(await new Response(stream).arrayBuffer());if(out.byteLength>35*1024*1024)throw Error('Слишком большой распакованный XML');return out;}
async function nativeXLSX(buf){const files=zipEntries(new Uint8Array(buf)),decode=new TextDecoder('utf-8');let read=async path=>{let v=await unzipPart(files.get(path));return v?decode.decode(v):null};let workbook=await read('xl/workbook.xml');if(!workbook)throw Error('Файл не содержит xl/workbook.xml');let wb=xmlText(workbook),rels=xmlText(await read('xl/_rels/workbook.xml.rels')||'<Relationships/>');let relMap=new Map(xmlTags(rels,'Relationship').map(e=>[e.getAttribute('Id'),e.getAttribute('Target')]));let ss=[];let sxml=await read('xl/sharedStrings.xml');if(sxml){let doc=xmlText(sxml);ss=xmlTags(doc,'si').map(si=>xmlTags(si,'t').map(t=>t.textContent||'').join(''));}
let sheets={};for(let sheet of xmlTags(wb,'sheet').slice(0,15)){let name=sheet.getAttribute('name')||'Лист';let rid=sheet.getAttribute('r:id')||sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');let target=relMap.get(rid);if(!target)continue;let path=target.startsWith('/')?target.replace(/^\//,''):target.startsWith('xl/')?target:'xl/'+target.replace(/^\.\//,'');let raw=await read(path);if(!raw)continue;let doc=xmlText(raw);let rows=[];let rowNodes=xmlTags(doc,'row').slice(0,5030);for(let row of rowNodes){let idx=Number(row.getAttribute('r')||rows.length+1)-1;if(idx<0||idx>=5030)continue;let cols=[];for(let cell of xmlTags(row,'c')){let ci=colIndex(cell.getAttribute('r'));if(ci<0||ci>=50)continue;let t=cell.getAttribute('t'),v=xmlFirst(cell,'v')?.textContent;let value='';if(t==='s')value=ss[Number(v)]||'';else if(t==='inlineStr')value=xmlTags(cell,'t').map(x=>x.textContent||'').join('');else if(t==='str')value=v||'';else value=v??'';cols[ci]=String(value).slice(0,700);}rows[idx]=cols;}sheets[name]=rows.map(x=>x||[]);}if(!Object.keys(sheets).length)throw Error('Не удалось прочитать листы Excel');return sheets;}


function csvRows(text,del,limit=5030){
 let rows=[],row=[],cell='',quoted=false;const input=String(text||'').replace(/^\uFEFF/,'');
 for(let i=0;i<input.length;i++){
  let c=input[i];
  if(quoted){if(c==='"'&&input[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}
  else if(c==='"')quoted=true;
  else if(c===del){row.push(cell);cell='';}
  else if(c==='\r'||c==='\n'){
   if(c==='\r'&&input[i+1]==='\n')i++;
   row.push(cell);if(row.some(x=>x.trim()))rows.push(row);
   if(rows.length>=limit)return rows;
   row=[];cell='';
  }else cell+=c;
 }
 if(cell||row.length){row.push(cell);if(row.some(x=>x.trim()))rows.push(row);}

}
function detectCSVDelimiter(text){
 const sample=String(text||'').slice(0,60000), choices=[';','\t',','];

  const rows=csvRows(sample,del,45).filter(r=>r.length>0);
  const widths=rows.map(r=>r.length);
  const withColumns=widths.filter(n=>n>=2);
  if(!withColumns.length)return {del,score:-100};
  const histogram=new Map;for(const n of widths){histogram.set(n,(histogram.get(n)||0)+1)}
  const [common,count]=[...histogram].sort((a,b)=>b[1]-a[1])[0];
  let header=0;
  for(const row of rows.slice(0,12)){
   const labels=row.map(v=>norm(v));
   const hasName=labels.some(v=>/^(наимен|назван|товар|позиция|product|name)/.test(v));
   const hasPrice=labels.some(v=>/^(цена|стоим|price|закупочн)/.test(v)||v.includes('цена со скидкой'));
   if(hasName&&hasPrice)header=Math.max(header,20);
   else if(hasName||hasPrice)header=Math.max(header,7);
  }
  // Reward stable column widths and sensible number of fields, not raw delimiter count.
  const consistency=count/rows.length;
  const multi=withColumns.length/rows.length;
  const plausibility=common>=2&&common<=70?8:-6;
  let score=header+12*consistency+5*multi+plausibility;
  if(del===';'&&score>0)score+=1;
  return {del,score};
 });

}
function parseCSV(text){text=String(text||'').replace(/^\uFEFF/,'');return csvRows(text,detectCSVDelimiter(text),5030)}
function decodeCSVBuffer(buffer){

  grouped.get(id).items.push(q.off.name+' — '+q.count+' '+unit+(state.delivery.includePrices?' · '+rub(q.cost):''));
  grouped.get(id).sum+=q.cost;
 }
 return [...grouped.values()].map(g=>{
  const extra=[state.delivery.date?'Дата: '+state.delivery.date:'',state.delivery.window?'Время доставки: '+state.delivery.window:'',state.delivery.address?'Адрес: '+state.delivery.address:'',state.delivery.comment?'Комментарий: '+state.delivery.comment:''].filter(Boolean);
  g.text='Здравствуйте! Просим подготовить заказ:\n\n'+g.items.map((x,i)=>(i+1)+'. '+x).join('\n')+(extra.length?'\n\n'+extra.join('\n'):'');
  return g;
 });
}
function backSprite(){return document.querySelector('.bar-hero .bek-ready')?.src||'';}
function startUI(){
 visualHeroTemplate=document.querySelector('#app .bar-hero')?.cloneNode(true)||null;
 const btn=document.createElement('button');btn.type='button';btn.id='real-entry';btn.textContent='Мои прайсы →';
 btn.className='btn btn-secondary';btn.style.cssText='margin:0 12px 8px;min-height:44px';
 document.querySelector('.back-experiment-switch')?.insertAdjacentElement('beforebegin',btn);
 btn.onclick=()=>enter(!document.body.classList.contains('real-active'));
 const menu=document.querySelector('#side-menu');
 if(menu){const b=document.createElement('button');b.textContent='Мои прайсы · реальная закупка';b.onclick=()=>enter(true);menu.append(b);}
 const element=document.createElement('main');element.id='real-app';element.className='real-app hidden';element.setAttribute('aria-live','polite');
 document.querySelector('main#app')?.insertAdjacentElement('afterend',element);
}
function enter(open){
 document.body.classList.toggle('real-active',open);
 by('real-app').classList.toggle('hidden',!open);
 by('real-entry').textContent=open?'Вернуться к демо':'Мои прайсы →';
 const h=document.querySelector('.demo-banner strong');
 if(h)h.textContent=open?'Реальные прайсы · локальная обработка · заказы не отправляются':'Демо · учебные цены, без AI и реальных заказов';
 if(open){paint();window.scrollTo(0,0);}
}
function top(){
 const valid=state.offers.filter(o=>!o.invalid).length;
 return '<header class="real-head"><button type="button" data-r="close" class="real-link">← К демо</button><div class="real-topline">'+(state.showBack?'<img alt="" class="real-bek" src="'+backSprite()+'">':'')+'<div><p class="eyebrow">Закупка из своих прайсов</p><h1>Твой барбэк для закупок</h1><p class="real-muted">Кидай список. Найду варианты в загруженных прайсах.</p></div></div><button class="real-link" data-r="switch">'+(state.showBack?'С Бэком ✓':'Без Бэка')+'</button></header><div class="real-source-status"><b>'+state.files.length+' '+pl(state.files.length,'прайс','прайса','прайсов')+' · '+valid+' '+pl(valid,'предложение','предложения','предложений')+'</b> с ценой'+(state.offers.length>valid?' · '+(state.offers.length-valid)+' строк требуют внимания':'')+'</div>';
}
function viewStart(){
 let html='<section class="real-card"><h2>Прайсы поставщиков</h2><p class="real-muted">Добавь XLSX или CSV. Один раз загрузи прайсы — потом просто вводи товары.</p><label class="real-upload">＋ Добавить прайсы<input type="file" id="real-files" accept=".csv,.xlsx" multiple></label>';
 if(state.files.length)for(const f of state.files){const offers=state.offers.filter(o=>o.sourceId===f.id&&!o.invalid);html+='<div class="real-file"><div><strong>'+esc(f.supplier)+'</strong><small>'+esc(f.name)+' · '+offers.length+' предложений</small></div><div><button data-r="configure" data-id="'+f.id+'">Поля</button><button data-r="delete" data-id="'+f.id+'">×</button></div></div>';}
 else html+='<p class="real-muted">Прайсов пока нет.</p>';
 html+='<p class="real-small">Файлы остаются в этом браузере (IndexedDB). Это локальная тестовая версия, не облачное хранилище.</p></section>';
 html+='<section class="real-card"><h2>Что нужно заказать?</h2><textarea id="real-request" rows="7" placeholder="Апельсиновый ликёр — 6 бутылок&#10;Вино белое — 6 бутылок&#10;Водка — 10 л">'+esc(state.request)+'</textarea><button class="real-primary" data-r="analyze">Подобрать предложения →</button></section>';
 return html;
}
function choices(options,itemId){
 return '<div class="real-choices">'+options.map(z=>'<button type="button" data-r="choose" data-id="'+itemId+'" data-offer="'+esc(z.off.id)+'"><strong>'+esc(z.off.name)+'</strong><small>'+esc(z.off.supplier)+' · '+rub(z.off.priceKop)+' за единицу · заказать '+z.count+' шт. · итого '+rub(z.cost)+'</small></button>').join('')+'</div>';
}
function viewQuestion(){
 const q=state.questions[0];if(!q)return viewResult();
 const item=q.item;
 let html='<button class="real-link" data-r="to-start">← К списку</button><section class="real-card"><p class="real-overline">Осталось уточнить '+state.questions.length+'</p><h2>Бэк разбирает закупку</h2><p class="real-line">Ты написал: <strong>'+esc(item.raw)+'</strong></p>';
 if(q.kind==='invalid')html+='<h3>Уточним количество</h3><p>'+esc(item.invalid)+'</p><button data-r="edit-line" data-id="'+item.id+'">Исправить эту строку</button>';
 if(q.kind==='missing')html+='<h3>Товар пока не найден</h3><p>Не вижу подходящего предложения в подключённых прайсах. Другую марку не подставлю без разрешения.</p><button data-r="edit-line" data-id="'+item.id+'">Исправить позицию</button><button data-r="skip" data-id="'+item.id+'">Оставить без предложения →</button>';
 if(q.kind==='volume')html+='<h3>Какую фасовку берём?</h3><p>В прайсах разные объёмы бутылок.</p><div class="real-choices">'+q.volumes.map(v=>'<button data-r="volume" data-id="'+item.id+'" data-value="'+v+'">'+(v/1000).toLocaleString('ru-RU')+' л</button>').join('')+'</div>';
 if(q.kind==='choose')html+='<h3>Какой вариант подходит?</h3><p>Это разные предложения. Выбери одним нажатием.</p>'+choices(q.options,item.id);
 if(q.kind==='excess')html+='<h3>Минимальная партия больше потребности</h3><p>'+esc(q.q.off.name)+'</p><p>Нужно '+q.q.required+' шт., но заказать придётся '+q.q.count+' шт. · '+rub(q.q.cost)+'</p><button class="real-primary" data-r="approve" data-id="'+item.id+'" data-offer="'+esc(q.q.off.id)+'">Разрешить '+q.q.count+' шт.</button><button data-r="skip" data-id="'+item.id+'">Оставить без заказа</button>';
 return html+'</section>';
}
function viewConfig(){
 const f=state.files.find(x=>x.id===state.configId);if(!f)return viewStart();
 const header=f.sheets[f.sheet]?.[f.header]||[];
 let html='<button class="real-link" data-r="to-start">← К прайсам</button><section class="real-card"><h2>Проверка полей: '+esc(f.name)+'</h2>';
 html+='<label>Имя поставщика<input id="real-supplier-name" value="'+esc(f.supplier)+'"></label><label>Лист<select id="real-sheet">'+Object.keys(f.sheets).map(k=>'<option '+(k===f.sheet?'selected':'')+'>'+esc(k)+'</option>').join('')+'</select></label><label>Строка заголовка<input type="number" min="1" max="30" id="real-header" value="'+(f.header+1)+'"></label>';
 const fields=[['name','Товар'],['price','Цена'],['final','Цена со скидкой'],['pack','Штук в коробе'],['min','Минимум'],['multiple','Кратность'],['volume','Объём']];
 html+='<div class="real-map">'+fields.map(([field,label])=>'<label>'+label+'<select data-field="'+field+'"><option value="-1">Не указан</option>'+header.map((v,i)=>'<option value="'+i+'" '+(f.cols[field]===i?'selected':'')+'>'+(i+1)+'. '+esc(String(v||'Столбец').slice(0,45))+'</option>').join('')+'</select></label>').join('')+'</div>';
 html+='<label>Цена<select id="real-price-mode"><option value="unit" '+(f.priceMode==='unit'?'selected':'')+'>за единицу</option><option value="box" '+(f.priceMode==='box'?'selected':'')+'>за короб</option><option value="final" '+(f.priceMode==='final'?'selected':'')+'>со скидкой</option></select></label><button class="real-primary" data-r="save-config">Применить настройки</button></section>';
 return html;
}
function viewResult(){
 const {result,missing}=selectedOrders(),groups=messages(),total=result.reduce((s,x)=>s+x.q.cost,0);
 let h='<button class="real-link" data-r="to-start">← Изменить список</button><section class="real-card"><p class="real-overline">'+(missing.length?'Частично готово':'Закупка готова')+'</p><div class="real-total">'+rub(total)+'</div><p class="real-muted">'+result.length+' '+pl(result.length,'позиция','позиции','позиций')+' · '+groups.length+' '+pl(groups.length,'поставщик','поставщика','поставщиков')+' · '+missing.length+' без предложения</p>';
 if(missing.length)h+='<details><summary>Не включено ('+missing.length+')</summary>'+missing.map(x=>'<p>'+esc(x.item.raw)+' — '+esc(x.reason)+'</p>').join('')+'</details>';
 for(const {q} of result)h+='<div class="real-result-row"><strong>'+esc(q.off.name)+'</strong><small>'+esc(q.off.supplier)+' · '+q.count+' шт. · '+rub(q.off.priceKop)+'/шт. · строка '+q.off.sourceRow+'</small><strong>'+rub(q.cost)+'</strong></div>';
 h+='</section><section class="real-card"><h2>Доставка</h2><label>Дата<input id="real-date" type="date" value="'+esc(state.delivery.date)+'"></label><label>Время<input id="real-window" value="'+esc(state.delivery.window)+'" placeholder="15:00–19:00"></label><label>Адрес<input id="real-address" value="'+esc(state.delivery.address)+'" placeholder="Адрес заведения"></label><label>Комментарий<input id="real-comment" value="'+esc(state.delivery.comment)+'"></label><label class="real-check"><input type="checkbox" id="real-prices" '+(state.delivery.includePrices?'checked':'')+'> Указать цены в сообщениях</label><button class="real-primary" data-r="save-delivery">Обновить сообщения</button></section>';
 for(const [i,g] of groups.entries())h+='<section class="real-card"><h2>'+esc(g.name)+'</h2><pre class="real-message">'+esc(g.text)+'</pre><button class="real-primary" data-r="copy" data-id="'+i+'">Скопировать сообщение</button></section>';
 h+='<p class="real-small">Расчёт основан на загруженных файлах. Наличие у поставщика не проверялось; сообщения не отправляются автоматически.</p>';
 return h;
}
function paint(){
 const el=by('real-app');if(!el)return;
 el.innerHTML=top()+(state.error?'<p class="real-alert">'+esc(state.error)+'</p>':'')+(state.notice?'<p class="real-note">'+esc(state.notice)+'</p>':'')+(state.step==='config'?viewConfig():state.step==='question'?viewQuestion():state.step==='result'?viewResult():viewStart());
 if(state.showBack && state.step==='start' && visualHeroTemplate){
   const hero=visualHeroTemplate.cloneNode(true),working=!!state.request.trim();
   hero.classList.toggle('hero-working',working);hero.classList.toggle('hero-asleep',!working);
   const speech=hero.querySelector('.bar-hero-speech');
   if(speech)speech.innerHTML=working?'Я на месте! <strong>Давай проверим прайсы и закупку.</strong>':'Пока тихо… <strong>Начинай закупку, и я проснусь.</strong>';
   el.querySelector('.real-head')?.insertAdjacentElement('afterend',hero);
 }
 persist();
}


async function importFiles(files){
 if(!files.length)return;
 state.busy=true;state.notice='Читаю прайсы…';paint();
 const success=[],errors=[];
 for(const input of files){
  try{
   if(input.size>8*1024*1024)throw Error('Файл больше 8 МБ');
   const data=await input.arrayBuffer();
   let sheets;
   if(/\.xlsx$/i.test(input.name))sheets=await nativeXLSX(data);
   else if(/\.csv$/i.test(input.name))sheets={CSV:parseCSV(decodeCSVBuffer(data))};
   else throw Error('Нужен XLSX или CSV');
   const sheet=Object.keys(sheets)[0];
   if(!sheet)throw Error('Не нашёл лист с товарами');
   const source={id:id(),name:input.name,supplier:input.name.replace(/\.(xlsx|csv)$/i,'').slice(0,55),sheet,sheets,header:0,cols:{name:-1,price:-1,final:-1,discount:-1,pack:-1,multiple:-1,min:-1,volume:-1},priceMode:'unit',packSize:1,minQty:1};
   guess(source);
   if(source.cols.name<0||(source.cols.price<0&&source.cols.final<0))throw Error('Не удалось определить колонки товара и цены');
   const normOffers=readOffers(source);
   state.files.push(source);state.offers.push(...normOffers);
   try{await dbSave({id:source.id,source,offers:normOffers});}
   catch(e){errors.push(input.name+': сохранение недоступно ('+e.message+'); данные останутся только до закрытия страницы');}
   success.push(input.name+': '+normOffers.filter(x=>!x.invalid).length+' цен');
  }catch(e){errors.push(input.name+': '+e.message);}
 }
 state.busy=false;
 state.notice=success.length?'Загружено: '+success.join('; '):'';
 state.error=errors.join('; ');
 state.step='start';paint();
}
function readOffers(source){
 const rows=source.sheets[source.sheet]||[];
 return rows.slice(source.header+1,Math.min(rows.length,source.header+5001)).map((row,i)=>cleanOffer(source,row,source.header+1+i)).filter(Boolean).map(x=>normalizeOffer(x,source));
}
async function boot(){
 recover();startUI();
 try{
  const persisted=await dbRead();
  for(const entry of persisted){state.files.push(entry.source);state.offers.push(...(entry.offers||[]));}
 }catch(e){state.notice='Не удалось восстановить локальные прайсы. Проверь настройки Safari.';}
 if(state.step==='question'||state.step==='result')buildItems();
 paint();enter(true);
}
document.addEventListener('click',async e=>{
 const button=e.target.closest('#real-app [data-r]');
 if(!button)return;
 const action=button.dataset.r,src=button.dataset.id,itemid=Number(src),item=state.items.find(i=>i.id===itemid);
 if(action==='close'){enter(false);return;}
 if(action==='switch'){state.showBack=!state.showBack;paint();return;}
 if(action==='to-start'){state.step='start';state.error='';state.notice='';paint();window.scrollTo(0,0);return;}
 if(action==='analyze'){
  if(!state.files.length){notify('Сначала загрузи хотя бы один прайс',true);return;}
  if(!state.request.trim()){notify('Напиши список товаров',true);return;}
  state.chosen={};state.approvals={};buildItems();
  state.step=state.questions.length?'question':'result';state.notice='';state.error='';paint();window.scrollTo(0,0);return;
 }
 if(action==='configure'){state.configId=src;state.step='config';paint();return;}
 if(action==='delete'){
  const f=state.files.find(f=>f.id===src);
  if(!f||!confirm('Удалить прайс '+f.supplier+' из локального каталога?'))return;
  state.files=state.files.filter(f=>f.id!==src);
  state.offers=state.offers.filter(x=>x.sourceId!==src);
  try{await dbDelete(src);}catch{}
  state.step='start';state.chosen={};state.approvals={};paint();return;
 }
 if(action==='save-config'){
  const f=state.files.find(f=>f.id===state.configId);
  if(!f)return;
  f.supplier=by('real-supplier-name')?.value?.trim()||f.supplier;
  const sheet=by('real-sheet').value;const hdr=Math.max(0,Number(by('real-header').value)-1);
  if(f.sheet!==sheet){f.sheet=sheet;guess(f);}
  f.header=hdr;
  document.querySelectorAll('#real-app [data-field]').forEach(s=>f.cols[s.dataset.field]=Number(s.value));
  f.priceMode=by('real-price-mode').value;
  if(f.cols.name<0||(f.cols.price<0&&f.cols.final<0)){notify('Укажи столбцы товара и цены',true);return;}
  state.offers=state.offers.filter(x=>x.sourceId!==f.id);
  const list=readOffers(f);state.offers.push(...list);
  try{await dbSave({id:f.id,source:f,offers:list});}catch(e){state.error='Не удалось сохранить прайс: '+e.message;}
  state.step='start';state.chosen={};state.approvals={};state.notice='Настройки прайса обновлены';paint();return;
 }
 if(action==='volume'&&item){state.chosen[item.id+'-volume']=Number(button.dataset.value);buildItems();}
 if(action==='choose'&&item){state.chosen[item.id]=button.dataset.offer;buildItems();}
 if(action==='approve'&&item){state.approvals[item.id+'-'+button.dataset.offer]=true;buildItems();}
 if(action==='skip'&&item){state.chosen['skip-'+item.id]=true;buildItems();}
 if(action==='edit-line'&&item){state.step='start';paint();const area=by('real-request');if(area){area.focus();area.setSelectionRange(0,area.value.length);}return;}
 if(['volume','choose','approve','skip'].includes(action)){state.step=state.questions.length?'question':'result';paint();window.scrollTo(0,0);return;}
 if(action==='save-delivery'){
  state.delivery={date:by('real-date').value,window:by('real-window').value,address:by('real-address').value,comment:by('real-comment').value,includePrices:by('real-prices').checked};
  state.notice='Сообщения обновлены';paint();return;
 }
 if(action==='copy'){
  const g=messages()[Number(src)];if(!g)return;
  try{await navigator.clipboard.writeText(g.text);notify('Скопировано для '+g.name);}
  catch(e){notify('Не удалось скопировать автоматически — выдели текст сообщения',true);}
 }
});
document.addEventListener('input',e=>{
 if(e.target?.id==='real-request'){
  state.request=e.target.value;persist();
  const hero=document.querySelector('#real-app .bar-hero');
  if(hero){
    const working=!!state.request.trim();
    hero.classList.toggle('hero-working',working);hero.classList.toggle('hero-asleep',!working);
    const speech=hero.querySelector('.bar-hero-speech');
    if(speech)speech.innerHTML=working?'Я на месте! <strong>Давай проверим прайсы и закупку.</strong>':'Пока тихо… <strong>Начинай закупку, и я проснусь.</strong>';
  }
}
});
document.addEventListener('change',e=>{
 if(e.target?.id==='real-files')importFiles([...e.target.files]);
});
boot();
})();
